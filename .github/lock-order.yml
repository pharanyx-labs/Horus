# The kernel's locks, and every nesting between them that exists on purpose.
#
# tools/check_lock_order.py (S88) reads this file and fails the build on a
# nesting that is not here, and on the REVERSE of one that is. The second rule
# is the one with teeth: a nesting is not a defect, a CYCLE is, and a declared
# order is safe exactly while the other direction stays absent.
#
# Until 2026-09-10 this order lived in five comments across four files, with no
# registry and nothing that could fail. Two of them were in the same file and
# disagreed about the same pair of locks -- see the `endpoint_lock -> cap_lock`
# entry below, which records how that happened.

locks:
  - scheduler_lock     # src/kernel/scheduler.c
  - page_lock          # src/kernel/scheduler.c (the pager's structures)
  - cap_lock           # src/kernel/scheduler.c (every cspace)
  - endpoint_lock      # src/kernel/scheduler.c; taken via ipc_lock()/ipc_unlock()
  - storage_lock       # src/kernel/scheduler.c
  - pipe_lock          # src/kernel/pipe.c
  - untyped_lock       # src/kernel/untyped.c
  - ata_lock           # src/kernel/ata.c
  - sdhci_lock         # src/kernel/sdhci.c -- one command on the SD controller at a time
  - swap_lock          # src/kernel/swap.c -- the swap slot table; held across the block I/O,
                       # so it sits outside ata_lock and sdhci_lock (reached through
                       # the block device's function pointers, which this checker does
                       # not follow) and never inside page_lock (docs/design/swap.md 3.5)
  - spawn_stage_lock   # src/kernel/kspawn.c -- the outermost lock in the kernel

nesting:
  - outer: page_lock
    inner: swap_lock
    reason: >-
      Task teardown and mapping over a swapped PTE free the page's swap slot
      (swap_free) while the page tables are held. Swap code never takes
      page_lock while it holds swap_lock: eviction drops page_lock before it
      writes, and fault-in drops it before it reads (docs/design/swap.md 3.5),
      so the reverse edge cannot exist.
  - outer: endpoint_lock
    inner: swap_lock
    reason: >-
      The same path as endpoint_lock -> page_lock: delivering a message body
      copies into the receiver's memory, and a page of it that is in swap is
      brought back, which reads its slot under swap_lock. swap_lock is a leaf
      apart from the block driver locks, and nothing under it enters IPC.
  - outer: endpoint_lock
    inner: cap_lock
    reason: >-
      ipc_publish_pending_block mints the one-shot CAP_REPLY under the IPC lock,
      BEFORE waking the receiver, via cap_install_reply_for. Minting after the
      wake loses the race against a receiver already running on another CPU:
      measured at ~33% of sessions with a second CPU loaded, 0% for the control,
      and invisible on one CPU because there is no second CPU to run the server
      inside the window. Safe because it is the only direction that exists --
      no path takes an IPC lock while holding cap_lock, and rule 2 of the
      checker is what keeps that true rather than a comment saying "keep it
      that way".

      THE COMMENT THAT DISAGREED. sys_ipc_recv mints AFTER ipc_unlock and its
      comment says doing otherwise "would create a second lock order between two
      locks that are otherwise unrelated". That was written 2026-08-10; the
      nesting above landed 2026-08-11 and made it false the next day. Both
      paths are still correct -- exactly one of them nests -- but the reason
      given in the second is not.
  - outer: untyped_lock
    inner: scheduler_lock
    reason: >-
      Scheduling contexts (docs/design/scheduler.md 3.1, step 4a). The collector
      destroys a context no capability names with the untyped lock held
      (destroy_dyn_sc), and sched_context_destroyed then takes the scheduler lock
      to give the context's share back and unbind its tasks. Nothing holding the
      scheduler lock takes the untyped lock: SYS_SCHED_SPLIT carves the memory
      first and releases the untyped lock before sched_carve takes the scheduler
      lock, and selection reads the context table without it. The scheduler lock
      is taken through sched_raw_lock, which this checker does not read, so this
      edge is declared for the reader rather than observed by the check.
  - outer: cap_lock
    inner: untyped_lock
    reason: >-
      The object collector reads every cspace and must see none mid-write, so it
      runs with cap_lock held and takes the untyped lock to destroy what nothing
      names. cap_revoke calls kobj_gc_locked under the cap_lock it already holds;
      task teardown empties the cspace and sweeps inside one cap_lock section
      (cap_release_cspace_and_collect); kobj_gc takes cap_lock first for the
      self-tests. kobj_gc_locked halts unless this CPU holds cap_lock. This order was always cap_revoke's and is stated in
      docs/ARCHITECTURE.md; until 2026-10-17 teardown swept with no cap_lock at
      all, which is why the checker never saw the edge. Nothing holding the
      untyped lock takes cap_lock: untyped_retype and untyped_split release it
      before they install a capability.
  - outer: cap_lock
    inner: pipe_lock
    reason: >-
      A pipe end is a capability and a count of ends in the pipe table, and the
      two must change together wherever a revocation sweep could see them apart
      (LIMITATIONS 1.14). cap_install_child_pipe_end and pipe_count_forked_ends
      count an end inside the cap_lock section that installs it; cap_revoke
      releases the ends its sweep removed (pipe_release_revoked_ends) before it
      drops cap_lock; and SYS_PIPE_READ / SYS_PIPE_WRITE resolve the end and move
      the bytes under one cap_lock, so a revoke cannot free the pipe between the
      lookup and the use. Until 2026-10-13 this nesting was avoided on purpose,
      which was safe only while no pipe end could be revoked. pipe_lock is a
      leaf: nothing in pipe.c takes another lock while holding it, so the reverse
      edge cannot exist.
  - outer: endpoint_lock
    inner: page_lock
    reason: >-
      ipc_publish_pending_block calls copy_to_user to deliver the message body,
      and the user-copy path takes page_lock to fault the destination in. The
      2026-08-30 audit investigated this pair and rejected it as a finding
      (docs/AUDIT.md section 5) on the grounds that matter: "checked in the
      direction that matters: no page_lock holder enters IPC." That argument is
      about the ABSENCE of the reverse edge, it was checked by hand once, and
      rule 2 of this checker is what now keeps it checked.
