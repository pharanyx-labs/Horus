# Every Kani proof in the crate, each of which gates a merge.
#
# EVERY `#[kani::proof]` harness in rust/src must appear in the `gating` list
# below. `tools/check_kani_harnesses.py` fails the build if one is missing, if a
# listed name no longer exists, or if anything tries to excuse a proof from
# running: there is no `manual` list any more, because no job would run it.
#
# This exists because the answer to "does this proof run?" had been "no" for
# every harness. The `kani` job was `workflow_dispatch`-only AND carried
# `continue-on-error: true` on both of its steps: it never ran on a pull request,
# and could not have failed one if it had. Thirteen proofs of the capability
# algebra, none of them load-bearing: the same shape as [C-6] (a required list
# nothing checked) and as `smoke-kstack-park` (a gate that could not fail),
# applied to formal verification.
#
# From 2026-08-23 to 2026-10-06 this file had a second list, `manual`, for the
# two lineage-generation proofs: with the real serial-to-cell hash they did not
# finish in 1500 s each, and they ran only in that manual job. Stubbing the hash
# (capability.rs `lineage_idx_model`, which says why the proofs lose nothing by
# it) brought them to about four minutes each, so they gate like the rest, the
# manual job was deleted, and the list with it.
#
# Times below are per-harness SOLVER time, measured on 2026-08-23 on the
# maintainer's machine with Kani 0.67.0, except where a later entry says
# otherwise.
#
# END-TO-END WALL TIME IS NOT THAT SUM, AND IS NOT ONE NUMBER EITHER. The list
# was measured twice the same day: **319 s** for eleven harnesses against a cold
# target directory, and **196 s** for THIRTEEN against a warm one. More proofs,
# less time: what dominates is the rebuild each `cargo kani --harness`
# invocation may or may not need, not the solving. Quoting either figure alone
# would mislead whoever budgets this job next, so both are here. The 45-minute
# job bound is set against the cold case with room to spare.
#
# THIRD MEASUREMENT, 2026-09-20: **368 s** for all EIGHTEEN gating harnesses on
# Kani 0.68.0 / CBMC 6.11.0, on the maintainer's machine, warm target directory.
# Not comparable like-for-like with the two figures above, which were taken on
# 0.67.0: the version is part of the measurement and is recorded rather than
# elided. Five more harnesses for 49 s more than the 319 s cold run, because the
# five added that day are pure integer arithmetic and cost about a second each.
#
# 2026-10-06: the two lineage proofs joined at 234 s and 243 s of solver time
# (Kani 0.68.0 / CBMC 6.11.0). All TWENTY-FOUR, run one by one as the CI step
# runs them, took **645 s** end to end on the maintainer's machine, warm. The 45-minute bound
# still has room; revisit it if a harness is added whose cost is not a rounding
# error.

# Run on every pull request by the `kani-bounded` job.
gating:
  - serial_never_reserved_or_zero                            # 0s
  - mint_never_escalates_rights                              # 1s
  - lookup_grants_exactly_the_rights_held                    # 0s
  - lookup_never_returns_an_empty_slot                       # 1s
  - lookup_refuses_every_out_of_range_slot                   # 1s
  - grant_never_escalates_rights                             # 1s
  - reply_mint_never_escalates_and_never_receives            # tokens, filesystem.md §5.1
  - mint_token_only_from_an_untokened_minter
  - mint_keeps_the_token
  - grant_records_its_parent_and_takes_a_fresh_serial        # 0s
  - grant_from_an_invalid_source_refuses_and_writes_nothing  # 1s
  - grant_refuses_every_out_of_range_slot                    # 1s
  - revoke_descendant_never_nulls_ancestors                  # 66s
  - revoke_root_nulls_every_descendant                       # 37s, hash stubbed since 2026-10-06 (was 157s)
  - elf_header_validation_is_sound                           # 2s
  - elf_load_plan_is_sound                                   # 2s
  # The page-refcount arithmetic (rust/src/memory.rs), added 2026-09-20. Pure
  # integer properties: no pointer, no allocation, no global state, which is why
  # they are the cheapest harnesses in this file.
  #
  # MEASURED ON KANI 0.68.0 / CBMC 6.11.0, not on the 0.67.0 the times above were
  # taken with, so these five are not strictly comparable with them. The version
  # is recorded rather than the difference ignored.
  #
  # EACH ONE WAS FALSIFIED before it was added, by reintroducing the defect it
  # forbids and requiring `VERIFICATION:- FAILED`: dropping the upper-bound test
  # from refc_index; halving the page divisor; refusing every address; swapping
  # saturating_add for wrapping_add; swapping the zero test for wrapping_sub.
  # Five arms, five reds, source restored clean. A proof that cannot fail proves
  # nothing, and this file is the wrong place to find that out later.
  - refc_index_is_always_inside_the_table                    # 1s
  - refc_index_names_the_page_that_contains_the_address      # 0s
  - every_page_in_the_pool_has_an_index                      # 1s
  - an_increment_never_wraps_a_refcount                      # 0s
  - a_decrement_never_underflows_a_refcount                  # 1s
  # The lineage-generation pair (rust/src/capability.rs, finding 3.3), and the
  # range proof over the real hash that their stub depends on. EACH WAS
  # FALSIFIED on 2026-10-06 by reintroducing the defect it forbids and requiring
  # `VERIFICATION:- FAILED`, with the stub in place:
  #   lineage_idx_is_always_inside_the_table: masking with LINEAGE_SLOTS rather
  #     than LINEAGE_SLOTS - 1 (red in under a second);
  #   revoke_invalidates_recorded_generation: a gen-0 escape hatch in
  #     lineage_check (red in 219 s), and the wrap-around fix dropped from
  #     bump_lineage (red in 68 s);
  #   revoke_does_not_touch_a_distinct_lineage_cell: bump_lineage also bumping
  #     the neighbouring cell (red in 774 s).
  # Four arms, four reds, source restored clean.
  - lineage_idx_is_always_inside_the_table                   # 0s
  - revoke_invalidates_recorded_generation                   # 234s
  - revoke_does_not_touch_a_distinct_lineage_cell            # 243s
  # The ELF field readers and the relocation resolvers (rust/src/lib.rs, S111),
  # added 2026-10-06 with the fix the first of them found: the readers computed
  # `off + N` unchecked. EACH WAS FALSIFIED by reintroducing a defect and
  # requiring `VERIFICATION:- FAILED`:
  #   elf_readers_never_wrap_an_offset: the unchecked u64 reader (red in 3 s);
  #   x86_64_reloc_target_is_inside_a_segment: the same reader (red in 16 s),
  #     and a segment check that tests only the first byte (red in 12 s);
  #   i386_reloc_target_is_inside_a_segment: the first-byte-only check (red in
  #     3 s).
  - elf_readers_never_wrap_an_offset                         # 4s
  - x86_64_reloc_target_is_inside_a_segment                  # 18s
  - i386_reloc_target_is_inside_a_segment                    # 3s
  # The user-address validators (rust/src/lib.rs, S112), added 2026-10-06 with
  # the fix the first of them found: both trusted the bounds C passes and would
  # accept a kernel-half address given kernel-half bounds. Both are equivalences.
  # FALSIFIED by removing each ceiling check (each red in 1 s) and by a
  # validator that refuses everything (red in 1 s).
  - page_fault_never_accepts_a_kernel_half_address           # 3s
  - signal_handler_is_never_a_kernel_half_address            # 1s
  # Added 2026-10-06 from the CI and Kani survey. EACH WAS FALSIFIED by
  # reintroducing a defect and requiring `VERIFICATION:- FAILED`:
  #   revoke_reaches_every_cspace_and_spares_a_peer: the fixpoint expansion
  #     visiting only the first cspace (red in 66 s), and the sweep nulling
  #     every capability on the root's object, the [I-3] shape (red in 96 s);
  #   an_unseeded_pool_emits_nothing: the existing `rng_unseeded_legacy` arm,
  #     `cargo kani --features rng_unseeded_legacy` (red in 162 s);
  #   the_throttle_locks_within_the_limit: `>` for `>=` at MAX_AUTH_FAILS (red
  #     in 1 s).
  - revoke_reaches_every_cspace_and_spares_a_peer            # 98s, hash stubbed
  - an_unseeded_pool_emits_nothing                           # 4s
  - the_throttle_locks_within_the_limit                      # 1s
