LOGIN.CONF(5)                   File Formats                   LOGIN.CONF(5)

NAME
    login.conf - settings for the login prompt

SYNOPSIS
    /etc/login.conf

DESCRIPTION
    Settings that can make logging in stricter than the compiled default,
    never looser. Read by the shell before every login prompt.

    WHEN IT APPLIES. On an installed system the disk is sealed from power
    on until the first login of the boot unlocks it, so nothing on it can
    be read before then, and the shell makes no request before it on any
    system: the compiled defaults hold for the first login after each
    boot, and this file for every login after.

    One setting per line, `key = value`. '#' starts a comment, and blank
    lines are ignored. The file may be at most 4096 bytes, and a line 128
    characters. A value outside its range is REFUSED, not rounded, with a
    message naming the line, and the default stands.

SETTINGS
    failure_delay   Whole seconds, 0 to 30, to wait after each wrong
                    password at this console. Default: 0.

SECURITY
    The kernel locks an account after repeated wrong passwords, whatever
    this file says, and no file can change that. failure_delay only adds
    to it.

FILES
    /etc/login.conf  root's, mode 0644. Written once, with every setting
                     commented, on the first boot that finds none; never
                     overwritten.

SEE ALSO
    sh(1), shell.conf(5), passwd(1)
