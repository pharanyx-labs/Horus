# Which Kani proofs gate a merge, which do not, and why.
#
# EVERY `#[kani::proof]` harness in rust/src must appear in exactly one of the
# two lists below. `tools/check_kani_harnesses.py` fails the build if any is in
# neither, or in both, or names a harness that no longer exists — so adding a
# proof forces the "does this run?" question at review time instead of silently
# answering it.
#
# This exists because the answer had been "no" for every harness. The `kani` job
# was `workflow_dispatch`-only AND carried `continue-on-error: true` on both of
# its steps: it never ran on a pull request, and could not have failed one if it
# had. Thirteen proofs of the capability algebra, none of them load-bearing —
# the same shape as [C-6] (a required list nothing checked) and as
# `smoke-kstack-park` (a gate that could not fail), applied to formal
# verification.
#
# The full run really is too slow to gate: a whole `cargo kani` exceeded
# GitHub's 6-hour job ceiling and stalled the pipeline, which is why it was
# demoted in the first place. The answer is not "run everything" but "run the
# ones that finish, and say out loud which ones do not".
#
# Times below are per-harness SOLVER time, measured on 2026-08-23 on the
# maintainer's machine with Kani 0.67.0. They sum to about three minutes, and
# nearly all of it is the two revocation proofs.
#
# END-TO-END WALL TIME IS NOT THAT SUM, AND IS NOT ONE NUMBER EITHER. The list
# was measured twice the same day: **319 s** for eleven harnesses against a cold
# target directory, and **196 s** for THIRTEEN against a warm one. More proofs,
# less time — because what dominates is the rebuild each `cargo kani --harness`
# invocation may or may not need, not the solving. Quoting either figure alone
# would mislead whoever budgets this job next, so both are here. The 45-minute
# job bound is set against the cold case with room to spare.
#
# THIRD MEASUREMENT, 2026-09-20: **368 s** for all EIGHTEEN gating harnesses on
# Kani 0.68.0 / CBMC 6.11.0, on the maintainer's machine, warm target directory.
# Not comparable like-for-like with the two figures above, which were taken on
# 0.67.0: the version is part of the measurement and is recorded rather than
# elided. Five more harnesses for 49 s more than the 319 s cold run, because the
# five added that day are pure integer arithmetic and cost about a second each.
# The 45-minute bound still has room; revisit it if a harness is added whose
# cost is not a rounding error.

# Merge-gating: run on every pull request by the `kani-bounded` job.
gating:
  - serial_never_reserved_or_zero                            # 0s
  - mint_never_escalates_rights                              # 1s
  - lookup_grants_exactly_the_rights_held                    # 0s
  - lookup_never_returns_an_empty_slot                       # 1s
  - lookup_refuses_every_out_of_range_slot                   # 1s
  - grant_never_escalates_rights                             # 1s
  - reply_mint_never_escalates_and_never_receives            # tokens, filesystem.md §5.1
  - mint_token_only_from_an_untokened_minter
  - mint_keeps_the_token
  - grant_records_its_parent_and_takes_a_fresh_serial        # 0s
  - grant_from_an_invalid_source_refuses_and_writes_nothing  # 1s
  - grant_refuses_every_out_of_range_slot                    # 1s
  - revoke_descendant_never_nulls_ancestors                  # 66s
  - revoke_root_nulls_every_descendant                       # 120s
  - elf_header_validation_is_sound                           # 2s
  - elf_load_plan_is_sound                                   # 2s
  # The page-refcount arithmetic (rust/src/memory.rs), added 2026-09-20. Pure
  # integer properties: no pointer, no allocation, no global state, which is why
  # they are the cheapest harnesses in this file.
  #
  # MEASURED ON KANI 0.68.0 / CBMC 6.11.0, not on the 0.67.0 the times above were
  # taken with, so these five are not strictly comparable with them. The version
  # is recorded rather than the difference ignored.
  #
  # EACH ONE WAS FALSIFIED before it was added, by reintroducing the defect it
  # forbids and requiring `VERIFICATION:- FAILED`: dropping the upper-bound test
  # from refc_index; halving the page divisor; refusing every address; swapping
  # saturating_add for wrapping_add; swapping the zero test for wrapping_sub.
  # Five arms, five reds, source restored clean. A proof that cannot fail proves
  # nothing, and this file is the wrong place to find that out later.
  - refc_index_is_always_inside_the_table                    # 1s
  - refc_index_names_the_page_that_contains_the_address      # 0s
  - every_page_in_the_pool_has_an_index                      # 1s
  - an_increment_never_wraps_a_refcount                      # 0s
  - a_decrement_never_underflows_a_refcount                  # 1s

# Not gating, with a reason. These run in the manual `kani` job.
#
# The list was longer when it was written. The two ELF validators were excused on
# 2026-08-23 with a plausible-sounding reason -- "corroboration, not the only
# witness", and one of them "the more expensive of the two" -- and then MEASURED
# the same day at 2 seconds each. Both gate now. The excuse was not a lie, it was
# unmeasured, which is the failure mode this file exists to prevent one directory
# over; a reason that cannot be checked is worth what an unenforced note is worth.
#
# The two below were measured properly: both TIME OUT at 1500 s.
manual:
  revoke_invalidates_recorded_generation: >-
    Serial-keyed lineage proof: it ranges over the whole serial space against the
    LINEAGE_GEN table, which builds a large SAT instance. MEASURED 2026-08-23: it
    does not finish in 1500 s. Together with the one below, this pair is what
    pushed a full `cargo kani` past GitHub's 6-hour job ceiling. Still verified on
    demand, and a bounded version of it is worth writing.
  revoke_does_not_touch_a_distinct_lineage_cell: >-
    The precision half of the same lineage pair, and the same cost for the same
    reason: two independent symbolic serials indexing the same table. MEASURED
    2026-08-23: also does not finish in 1500 s.
