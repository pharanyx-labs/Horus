      - name: Fault in the kernel on purpose after the console handover and require the report on serial
        run: make smoke-kfault SMOKE_TIMEOUT=180
      # The control arm, in the same job: without it, a green smoke-kfault is
      # consistent with the gate measuring the existence of the fault rather
      # than where the report went.
      - name: Restore println() reporting and require the report to be INAUDIBLE
