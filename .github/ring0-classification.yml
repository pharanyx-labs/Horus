# What each object linked into kernel.elf is, and whether it belongs in a core
# somebody could hope to verify.
#
# WHY THIS FILE EXISTS. The kernel is 40,316 physical / 20,532 code lines across
# 37 linked objects (measured 2026-09-10). No document said which of those are
# the security core and which are passengers, so "shrink ring 0" had no subject:
# the seven files a reviewer named come to 13,977 physical but 6,318 code, and
# the same target is met or missed depending on which you count.
#
# THE BUDGET IS ON CODE LINES, NOT PHYSICAL ONES, and that is not a convenience.
# CLAUDE.md section 7 requires long explanatory comments -- ring 0 here is about
# half comment and blank by line, and the comments are load-bearing for
# auditability. A budget on physical lines would create pressure to delete them,
# which is a perverse incentive dressed as rigour.
#
# THE CLASSIFICATION IS THE POINT; the budget is a ratchet on top of it. A new
# object linked into kernel.elf that is not listed here fails the build, so
# adding to ring 0 is a decision somebody wrote down rather than a side effect
# of adding a file.

# Code lines permitted in `core`, set to the measured value on 2026-09-10 with ZERO
# headroom. Exact rather than generous on purpose: growth in the set somebody
# would have to verify should be conspicuous, and a budget with slack quietly
# absorbs the first few hundred lines that were supposed to prompt a discussion.
# Raising it is allowed -- say why in the commit. It ratchets rather than
# failing retroactively, since it starts where the tree already is.
# 2026-09-10: 9676 -> 9707, +31 for PS2_PROBE. terminal.c +24 (the painter,
# where the mode-agnostic cell accessor lives), idt.c +7 (two counters in the
# IRQ 1 path and the tick call). ALL of it is behind `#ifdef PS2_PROBE` and none
# of it is in the ship build -- `make print-defect-flags` answers `none` and the
# default build defines no such macro.
#
# THE BUDGET COUNTS SOURCE LINES, NOT SHIPPED LINES, and this is the first time
# that distinction has cost anything. Raised rather than special-cased: teaching
# the checker to evaluate the preprocessor would be a large amount of new
# machinery to make a number smaller, and a reader auditing core still has to
# read these lines whether or not the compiler keeps them. Recorded here so the
# imprecision is known rather than discovered later.
# 2026-09-11: 9707 -> 9709, +2 in idt.c, fixing the probe defect above. The
# scancode sample moved out of the IRQ 1 handler's common path and into the
# branch that consumes the byte -- one line net, plus the `#ifdef PS2_PROBE` /
# `#endif` pair the new site needs. Still entirely behind that macro and still
# absent from the ship build. Not worth a macro wrapper to avoid: hiding two
# lines behind five would make the number smaller and the code worse.
# 2026-09-11: 9709 -> 9678, and the -31 is TWO different things, which is why it
# is spelled out rather than banked quietly. About 40 lines are the kernel's
# private ps2_translate if-chain, deleted in favour of include/ps2_scancode.h,
# which both the kernel and the ring-3 console_server now read -- the code still
# executes in ring 0 and this checker no longer counts it, because it counts
# linked objects and not the headers they include. That part of the drop is a
# MEASUREMENT ARTEFACT and buys no real assurance; naming it here is the whole
# mitigation, since teaching the checker to follow includes would pull half of
# src/include into every file's total. The rest is genuine: the vector-33
# handover replaced a translation path with an EOI. Ratcheted down anyway rather
# than left as slack, per the zero-headroom rule at the top -- a budget that
# quietly keeps room it stopped needing is how the first few hundred lines get
# absorbed.
# 2026-09-11: 9678 -> 9679, +1 in idt.c. ps2_feed grew a return type -- it
# reports the arrows and Home/End symbolically now, so the ring-3 console can
# expand them into the escape sequences a terminal sends -- and the kernel's
# early reader needs one extra line to keep taking characters only. It has
# nowhere to put an arrow: it fills a byte ring feeding a line reader with no
# cursor movement, which is what it did before those keys had names.
# 2026-09-11: 9679 -> 9682, +3 in storage.c for S90. The unlocked check gained a
# conjunct and an #ifdef pair, the format authorisation became a read-and-clear
# token rather than a bare test, and storage_forget_mounted() is a new static
# beside the mount it undoes. All three are in the format path, which is core by
# any reading -- the code that decides whether a disk is destroyed is not a
# driver detail.
# 2026-09-11: 9682 -> 9727, +45 for the boot menu (S91). main.c gains the
# multiboot2 command-line tag, a bounded copy of it, whole-word matching and the
# flag derivation; tpm.c gains the length-prefixed command line in the PCR[8]
# serialization; syscall_hw.c gains a four-line handler. ALL OF IT IS CORE and
# none of it is a candidate for eviction: it decides whether the installer runs
# and what the machine commits to its TPM. The parsing is the part worth
# counting, because it reads bytes an attacker may influence -- whoever controls
# the boot media writes them -- which is exactly the code a verified core should
# be small enough to read. It is one loop over a bounded buffer, with no
# allocation and no pointer arithmetic leaving it.
# 2026-09-11: 9727 -> 9732, +5 in idt.c. keyboard_init sent the keyboard 0xF4,
# waited for its 0xFA acknowledgement, and then `(void)got_ack;` -- it asked, was
# answered, and discarded the reply. A machine whose keyboard never responded
# therefore booted looking exactly like one whose keyboard was fine, and the
# first symptom was a login prompt that ignored typing, with nothing anywhere
# saying why. Diagnosed from real hardware the hard way (PS2 n=0 st=14: a healthy
# controller, IRQ 1 never fired) when the kernel already had the answer in a
# local variable. The five lines are the test and the report; they are in `core`
# because the 8042 bring-up is, and moving them out to dodge the budget would be
# the reclassification bypass the arm below exists to catch.
# 2026-09-12: 9732 -> 9736, +4 in syscall_ipc.c. SYS_IPC_SENDER reports the
# sender's TASK ID through an out-parameter that was already unused, because a
# server whose clients share a uid cannot tell them apart with it -- and
# console_server's clients are exactly that population: one is the task a person
# is typing at, the rest are programs that person ran (S93). Four lines: a null
# check, a narrowing, a copy_to_user and its failure path. In `core` because the
# IPC authorisation path is, and because the alternative -- a new syscall --
# would have cost a dispatch entry and a number for the same four lines.
# RAISED 2026-09-12, 9736 -> 9857 (+121), for S94: the five raw capability-slot
# stores in pipe.c and kspawn.c were replaced by three locked primitives in
# capability.c. The growth is measured per file rather than asserted:
#
#     capability.c   642 -> 733   (+91)   cap_install_object_first_free,
#                                         cap_consume_slot_of,
#                                         cap_install_child_pipe_end
#     pipe.c         235 -> 265   (+30)   of which 27 are the control arm
#     scheduler.c   1938 -> 1938   (0)
#
# WHY THIS IS THE RIGHT DIRECTION FOR A VERIFICATION BUDGET even though the
# number went up. What the core gained is three functions on ONE locked path; what
# the kernel lost is five ad-hoc cap-writes spread across two files that a
# verification effort would have had to discover and reason about separately --
# and two of those five were in `service`, outside this budget entirely, which is
# the perverse part of counting only core: moving a cap-write INTO the audited set
# makes the figure worse while making the kernel easier to verify. The budget is a
# ratchet on accidental growth, not an argument against consolidation.
#
# 27 of pipe.c's 30 are `#ifdef PIPE_CAP_UNACCOUNTED`, the defect arm. The
# SHIPPING path in pipe.c is shorter than it was: h_pipe_close went from a
# four-step unsynchronised slot edit to one cap_consume_slot_of, and h_pipe no
# longer scans. The arm is counted because check_ring0_budget counts source, which
# is correct -- an arm that the budget could not see would be a place to hide code.
# RAISED AGAIN 2026-09-12, 9857 -> 9929 (+72), for S95: the endpoint index space fix
# and its witness. Measured per file:
#
#     scheduler.c   1938 -> 2007   (+69)   of which 57 are the REPLY_EP_SELFTEST
#                                          block and 12 the boot clamp in tasks_init
#     main.c         444 ->  447    (+3)   the selftest's invocation, after
#                                          scheduler_init
#
# So the SHIPPING guard is 12 code lines -- a clamp comparing the machine-derived
# g_max_tasks against what the endpoint table can give a private reply endpoint to,
# plus the line that announces it. The other 60 are the structural proof and its
# call, present in source and therefore counted, for the same reason
# PIPE_CAP_UNACCOUNTED's arm is counted above: an arm the budget could not see
# would be a place to hide code.
#
# RAISED 2026-09-19, 10009 -> 10081 (+72), for S96's second half: the pool's
# base reserves follow the boot modules, and every verified module is hashed
# again before userspace. Measured per file against 06dbf07:
#
#     paging.c   1239 -> 1264   (+25)   pool_reserve_base (the first-fit walk
#                                       and its POOL_RESERVE_FIXED_BASE arm), the
#                                       halt when the reserves no longer fit, and
#                                       the free-list loop now skipping a window
#                                       rather than a prefix
#     main.c      494 ->  541   (+47)   boot_module_reverify_all and its one-write
#                                       marker, boot_module_matches_manifest split
#                                       out so verify and re-verify share one
#                                       definition of "matches", and the
#                                       BOOT_MODULE_IMAGE_PROBE selftest (counted
#                                       for the reason given for the arms above)
#
# IT CANNOT LEAVE RING 0, for the same reason as the check below: the reserves
# are placed and the modules re-hashed before any task exists, and the property
# is about what the kernel itself writes. What it bought is a capacity limit
# gone, not a new mechanism: #402 held the property by halting any boot whose
# modules reached 16 MiB, which capped modules at about 5.5 MiB, and this holds
# it by moving the reserves instead.
#
# RAISED 2026-09-19, 9963 -> 10009 (+46), for S96, the boot-module placement
# check. All 46 are in main.c: boot_module_placement_check (the two overlap tests,
# with its BOOT_MODULE_RESERVE_UNCHECKED arm counted for the reason given above)
# and boot_module_placement_halt with its two line helpers, which build the halt
# message as ONE write because a gate asserts it as a contiguous string.
#
# IT CANNOT LEAVE RING 0. It has to run after the tag walk records the modules and
# before paging_init writes the pool's base reserves, which is before any task
# exists: there is nothing in ring 3 yet to ask. And the property it holds, that a
# verified module is still the bytes the hash approved, is one only the kernel can
# keep, because the kernel is the writer it guards against.
#
# RAISED AGAIN 2026-09-14, 9960 -> 9963 (+3), for the keyboard layout report.
# All three lines are the `kbd: layout <name>` announcement in keyboard_init.
# The layouts themselves cost the core NOTHING: include/ps2_scancode.h is a
# header, and this budget counts linked objects. That is the cheap direction and
# worth recording -- a whole framework arrived as data in a header, and the only
# core lines it bought are the ones that tell an operator which keyboard the
# build thinks it has. Without them "some keys type the wrong character" is a bug
# report nobody can act on, because the reader, the controller and the tables all
# look right in isolation and only the PAIRING is wrong.
#
# RAISED 2026-09-12, 9942 -> 9960 (+18), for 24-bit framebuffer pixels.
# A 24bpp pixel is three bytes with no padding and the pitch is not a whole
# number of words, so the blitter had to stop addressing the framebuffer as an
# array of uint32_t. All 18 lines are in terminal.c: the fb_store helper and the
# byte arithmetic at the three sites that write pixels (glyph, cursor underline,
# full-screen clear), plus the widened depth check.
#
# THE ALTERNATIVE WAS A BLACK SCREEN, which is why this is worth core lines: the
# console refused 24bpp and fell back to a VGA text window that a UEFI machine
# does not have, so console_server halted and the display stayed dark. QEMU's
# default -vga std under OVMF is such a display. A console that cannot be driven
# is not a smaller attack surface, it is a machine that cannot report anything.
#
# RAISED 2026-09-12, 9929 -> 9942 (+13), for the UART presence probe. A
# machine with no 16550 at 0x3F8 floats every register in the range to 0xFF, and
# bit 0 of the line-status register means "receive data ready" -- so console_getc
# believed a byte was waiting forever and never reached the keyboard beneath it.
# Measured per file:
#
#     terminal.c    +11   probe_com1_present (5 lines, two scratch-register
#                         round trips) and the guarded branch in console_getc
#     idt.c          +2   the call in serial_init and its assignment
#
# NOT MOVED OUT TO DODGE THE BUDGET, for the reason the PS2_PROBE note above
# gives about the 8042 bring-up: the console's input path is core because the
# console is, and a probe relocated to `driver` purely to keep a number down
# would make the figure better and the kernel no easier to verify. Eleven of the
# thirteen are in the one function that reads the port.
#
# The fix proper cost ZERO code lines in the core -- it is a derived constant and
# two static asserts in src/include/kernel.h, which is a header and not a linked
# object. That is worth recording because it is the cheap direction: a defect that
# existed because two numbers were written in two places was closed by deriving one
# from the other, and the only code the kernel gained is the runtime check that
# catches the case the constants cannot see.
#
# RAISED 2026-09-21, 10081 -> 10108 (+27), for S97 (HORUS-20260920-01): a task's
# exit record no longer carries a kernel rip or a kernel-half fault address. Only
# 15 of the 27 are in the ship kernel's source path, and all 15 are in idt.c:
# exit_record_rip and exit_record_addr, of which six lines are the
# EXIT_RECORD_KERNEL_RIP control arm's #ifdef branches. The fix belongs where the
# cause is built from the trap frame, which is ring 0 by nature. The other 12 are
# compiled out of the ship kernel: 4 in syscall.c are the KFAULT_RECORD_SELFTEST
# hook, and 8 in multiboot.S embed the kfaulter test child under PROC_SELFTEST.
# Two of those 8 are comment continuation lines, a MEASUREMENT ARTEFACT: this
# checker's .S rule strips only lines that begin with `#` or `/`, so the ` * `
# lines of a block comment count as code.
#
# RAISED 2026-09-21, 10108 -> 10128 (+20), for S98 (HORUS-20260920-02): a task
# in a reused slot no longer inherits the previous occupant's death records.
# 6 are in scheduler.c and are the fix: create_task clearing exit_info and
# wait_exit_info, two of them the EXIT_RECORD_STALE_ON_REUSE control arm's
# #ifdef pair (task_teardown's whole-name zeroing replaced one line with one).
# The other 14 are in multiboot.S and embed the waiter and exitprobe test
# children, only under PROC_SELFTEST: 12 directives and 2 comment continuation
# lines, the .S counting artefact recorded in the S97 entry above.
#
# RAISED 2026-09-21, 10128 -> 10136 (+8), for S99 (HORUS-20260921-01): SYS_WAIT
# requires a CAP_TCB naming its target. All 8 are in syscall.c and in the ship
# kernel: 3 are the check in h_wait (two of them the WAIT_TCB_UNCHECKED control
# arm's #ifndef pair), and 5 are the net of factoring task_kill_authorized's
# cspace scan out into task_tcb_held, so kill and wait share one scan instead of
# carrying two. An authorisation check on a syscall is ring 0 by nature.
#
# RAISED 2026-09-21, 10136 -> 10177 (+41), for S100 (HORUS-20260921-02): a
# CAP_TCB names one incarnation of a task, not a slot number. 33 are in the ship
# kernel: 22 in syscall.c (task_tcb_held comparing slot and generation, with the
# TCB_GENERATION_UNCHECKED arm's #ifdef lines, and the five three-line wrappers
# that run each CAP_TCB-authorised syscall under the spawn lock), 4 in
# syscall_ipc.c (the pending wait's generation re-check under that lock), 5 in
# capability.c (cap_install_from_root encoding a root CAP_TCB for its caller)
# and 2 in scheduler.c (create_task bumping the generation). The other 8 are in
# multiboot.S and embed the slotheir test child, only under PROC_SELFTEST: 6
# directives and 2 comment continuation lines, the .S counting artefact recorded
# in the S97 entry above. Authorisation of a syscall is ring 0 by nature.
#
# RAISED 2026-09-21, 10177 -> 10223 (+46), for up to eight CPUs with CPU indices
# independent of LAPIC ids, and S101 (no task on an SMT sibling). All 46 are in
# the ship kernel: 43 in smp.c (apic_to_cpu[]/cpu_to_apic[], this_apic_id,
# cpu_is_smt_sibling, smp_build_cpu_map numbering the BSP, then primaries, then
# siblings from the MADT with each id once, and the APIC_ID_IS_CPU_INDEX and
# SMT_SIBLING_BY_INDEX arms' #ifdef lines) and 3 in scheduler.c (this_cpu_lapic
# resolving through the map). CPU bring-up is ring 0 by nature. The trampoline's
# +13 are not counted: it is embedded as a binary, not linked.
#
# RAISED 2026-09-21, 10223 -> 10277 (+54), for HORUS-20260921-04: a task
# killed while another CPU runs it stops. 47 are in the ship kernel: 24 in
# scheduler.c (preempt_on_tick never resuming, re-claiming or signalling a dead
# task and parking the CPU instead, task_teardown refusing a dead task and
# kicking any CPU still running it, and the DEAD_TASK_RUNS arm's lines), 11 in
# smp.c (smp_kick_cpu, the targeted kill IPI), 8 in idt.c (vector 0xFC and the
# syscall-entry check) and 4 in lowlevel64.S (the 0xFC stub). The other 7 are in
# multiboot.S and embed the killspin test child, only under PROC_SELFTEST: 5
# directives and 2 comment continuation lines, the .S counting artefact recorded
# in the S97 entry above. Stopping a task is ring 0 by nature.
core_budget_loc: 10277

classify:
  # ---- core: the capability, memory, task and IPC machinery, plus the machine
  # bring-up that has nowhere else to live. This is the set a verification
  # effort would have to cover.
  core:
    - src/kernel/capability.c      # the capability engine (S3, S4, S26, S55, S60)
    - src/kernel/untyped.c         # untyped retype/split; every kernel object comes from here
    - src/kernel/paging.c          # the pager, CR3 ownership, COW
    - src/kernel/scheduler.c       # the scheduler and the claim invariant (S20)
    - src/kernel/syscall.c         # dispatch table and its authorisation column (S6, S79)
    - src/kernel/syscall_vm.c      # map/unmap: the pager's ring-3 surface
    - src/kernel/syscall_ipc.c     # endpoints, notifications, reply capabilities
    - src/kernel/pipe.c            # the other IPC object
    - src/kernel/terminal.c        # the stub console the reviewer's core includes
    - src/kernel/idt.c             # interrupts and the fault path
    - src/kernel/gdt.c             # descriptor tables
    - src/kernel/smp.c             # AP bring-up and TLB shootdown
    - src/kernel/acpi.c            # table discovery, needed before anything else runs
    - src/kernel/aslr.c            # address-space randomisation
    - src/kernel/main.c            # boot sequencing
    - src/boot/multiboot.S         # entry, long-mode bring-up
    - src/kernel/lowlevel64.S      # trap entry/exit, context switch
    - src/kernel/rust_memory_stubs.c  # the C side the Rust ABI requires

  # ---- driver: hardware. Roadmap 2.7 ("real device drivers as ring-3 servers")
  # is the eviction track; the CAP_IO_DEVICE mechanism landed, the drivers did
  # not move.
  driver:
    - src/kernel/pci.c
    - src/kernel/sdhci.c
    - src/kernel/ata.c
    - src/kernel/ahci.c
    - src/kernel/iommu.c
    - src/kernel/ioapic.c
    - src/kernel/msi.c
    - src/kernel/tpm.c

  # ---- service: things a finished system runs in ring 3. Each is a policy blob
  # holding authority the capability graph could describe instead.
  service:
    - src/kernel/storage.c         # encrypted object store + on-disk fs, WAL, Merkle, fsck
    - src/kernel/syscall_fs.c      # its ring-3 surface
    - src/kernel/kusers.c          # accounts, Argon2id; the authority is already CAP_USER
    - src/kernel/crypto.c          # CSPRNG seeding and key handling
    - src/kernel/kaudit.c          # the audit ring (S19)
    - src/kernel/kshell.c          # boot glue plus the DEBUG_SHELL commands
    - src/kernel/loader.c          # ELF loading: the surface that produced [G-10] and [G-11]
    - src/kernel/kspawn.c          # spawn/exec staging
    - src/kernel/shlib.c           # shared-library mapping
    - src/kernel/syscall_hw.c      # device-capability syscalls

  # ---- selftest: in-tree tests. Dominates a physical-line budget while being
  # nearly free in the shipped image (its own header notes the default build
  # yields an almost-empty object), which is a second reason the budget counts
  # code lines in `core` rather than lines in the tree.
  selftest:
    - src/kernel/selftest.c
