
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

set timeout=0
set default=0

# ---------------------------------------------------------------------------
# THE KERNEL IS CHECKED AGAINST A HASH THAT TRAVELS INSIDE THE MEASURED BOOT
# IMAGE, NOT BESIDE IT ON THE ISO.
#
# This file and `kernel.sha256` are both in the memdisk that `tools/mkbootimg.sh`
# packs into the El Torito image, and SeaBIOS measures that image into PCR[4].
# So the check below and the value it checks against are covered by the same
# measurement the TPM seal binds to (`src/kernel/tpm.c`, put_pcr_selection).
#
# That is what makes this a gate rather than a courtesy. Before 2026-09-11
# nothing measured the kernel at all: PCR[8] and PCR[9] are extended by the
# KERNEL, from its own compiled-in manifest and its own command line, so a
# substituted kernel reproducing those values satisfied the seal policy exactly
# and the TPM released the volume key to it. Measured that day: two kernels with
# different SHA-256, byte-identical PCR 0..9.
#
# Removing this check, or editing the hash it reads, changes the boot image and
# therefore changes PCR[4] -- so a volume sealed under the real image stays
# sealed. Neither half works alone, which is why they ship together.
#
# `SECURITY.md` **S92**.
# ---------------------------------------------------------------------------
insmod hashsum
insmod gcry_sha256

function horus_verify_kernel {
    hashsum --hash sha256 --check (memdisk)/boot/grub/kernel.sha256 --prefix ($root)/boot
}

menuentry "Horus 64-bit Secure Microkernel" {
    insmod multiboot2
    # The video drivers. GRUB sets a graphics mode for a multiboot2 payload only
    # when the KERNEL HEADER asks for one (the type-5 request tag, built under
    # FB_REQUEST) *and* a video driver is loaded -- with the request and no
    # driver it silently falls back to EGA text. Measured 2026-09-08, both ways:
    # with all_video and no request tag the machine still boots EGA text 80x25
    # and reaches the login prompt, so this line is inert in a default build and
    # is what lets the framebuffer gate boot THIS grub.cfg rather than a bespoke
    # one written to a different config than the ISO ships.
    insmod all_video
    insmod part_msdos
    insmod part_gpt
    insmod iso9660
    insmod fat
    # Find the volume by a file that is ON it, rather than naming a device.
    # `set root=(cd)` named the BIOS El Torito CD-ROM, which exists only when
    # booted that way: under UEFI, and on a USB stick written with dd (where the
    # device is (hd0)), it resolves to nothing and the kernel path is then looked
    # up on the network -- "error: no server is specified", then "you need to
    # load the kernel first". search works on every one of those.
    search --no-floppy --set=root --file /boot/kernel.elf

    # FAIL CLOSED. A kernel that does not match the pinned hash is not booted at
    # all -- the machine says so and halts, rather than starting an image the
    # measurement does not cover. `halt` and not `reboot`: a reboot loop hides
    # the reason from anyone watching the console.
    if horus_verify_kernel ; then
        multiboot2 /boot/kernel.elf
        # @HORUS_MODULES@ is replaced by the horus.iso rule with one `module2` line per
        # BOOT_MODULES entry (none in a default build). GRUB loads each module into RAM
        # outside the kernel image; the kernel records them from the multiboot2 tags.
        # Their integrity is the kernel's own manifest check (audit A4) -- which this
        # pin is what makes trustworthy, since the manifest lives inside the kernel.
@HORUS_MODULES@
        boot
    else
        echo "HORUS: REFUSED -- /boot/kernel.elf does not match the hash pinned in the measured boot image."
        echo "HORUS: the kernel on this medium is not the kernel this medium was built to boot."
        sleep 10
        halt
    fi
}
