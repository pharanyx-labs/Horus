SHELL.CONF(5)                   File Formats                   SHELL.CONF(5)

NAME
    shell.conf - settings for the shell

SYNOPSIS
    /etc/shell.conf

DESCRIPTION
    Presentation settings for sh(1), read after every successful login.
    Nothing in this file changes what any program may do: authority comes
    from capabilities, never from a file (capabilities(7)).

    One setting per line, `key = value`. '#' starts a comment, and blank
    lines are ignored. The file may be at most 4096 bytes, and a line 128
    characters. A line that does not parse, an unknown key or a value out
    of range is ignored with a message naming the line, and the default
    stands; a broken file never stops a login. Deleting a line restores
    its default at the next login.

SETTINGS
    hostname   The name in the prompt, as in root@horus#. 1 to 32
               characters from a-z, 0-9 and '-', not starting with '-'.
               Any other byte is refused, because the prompt is drawn
               before everything typed and a name with control bytes
               could draw over the console. Default: horus.

    motd       yes or no: print /etc/motd after a login, if it exists.
               Bytes that are not printable ASCII, a tab or a newline are
               shown as '?'. Default: yes.

FILES
    /etc/shell.conf  root's, mode 0644. Written once, with every setting
                     commented, on the first boot that finds none; never
                     overwritten.
    /etc/motd        the message of the day; Horus ships none.

SEE ALSO
    sh(1), login.conf(5), fs.policy(5)
