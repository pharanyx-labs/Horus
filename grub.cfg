
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

set timeout=0
set default=0


menuentry "Horus 64-bit Secure Microkernel" {
    insmod multiboot2
    # The video drivers. GRUB sets a graphics mode for a multiboot2 payload only
    # when the KERNEL HEADER asks for one (the type-5 request tag, built under
    # FB_REQUEST) *and* a video driver is loaded -- with the request and no
    # driver it silently falls back to EGA text. Measured 2026-09-08, both ways:
    # with all_video and no request tag the machine still boots EGA text 80x25
    # and reaches the login prompt, so this line is inert in a default build and
    # is what lets the framebuffer gate boot THIS grub.cfg rather than a bespoke
    # one written to a different config than the ISO ships.
    insmod all_video
    insmod part_msdos
    insmod part_gpt
    insmod iso9660
    insmod fat
    # Find the volume by a file that is ON it, rather than naming a device.
    # `set root=(cd)` named the BIOS El Torito CD-ROM, which exists only when
    # booted that way: under UEFI, and on a USB stick written with dd (where the
    # device is (hd0)), it resolves to nothing and the kernel path is then looked
    # up on the network -- "error: no server is specified", then "you need to
    # load the kernel first". search works on every one of those.
    search --no-floppy --set=root --file /boot/kernel.elf

    multiboot2 /boot/kernel.elf
    # @HORUS_MODULES@ is replaced by the boot.iso rule with one `module2` line per
    # BOOT_MODULES entry (none in a default build). GRUB loads each module into RAM
    # outside the kernel image; the kernel records them from the multiboot2 tags.
@HORUS_MODULES@
    boot
}
