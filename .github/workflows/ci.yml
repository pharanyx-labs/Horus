name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Newer pushes to the same ref cancel older in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN permissions (defense-in-depth for CI)
permissions:
  contents: read
  actions: read
  pull-requests: read
  # No write permissions by default. upload-artifact is specially granted by GitHub for this workflow.

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-gating:
    name: Every CI job is classified as gating or exempted (with a reason)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml
      # Finding [C-6]: the live required list lives in a branch ruleset no commit
      # touches, so a job added here landed advisory BY DEFAULT and nothing asked
      # whether it should have. This fails the build when ci.yml and
      # .github/ci-gating.yml disagree, which forces that question at review time.
      # It cannot check the ruleset itself -- reading one needs Administration
      # permissions the GITHUB_TOKEN does not have -- so it enforces that the
      # checked-in decision record is COMPLETE, and syncing stays a manual step.
      - name: Check CI gating classification
        run: tools/check_ci_gating.py

  invariants:
    name: "Every security property is bound to a witness that exists"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Roadmap 4.12, finding [F-4.1]. SECURITY.md's table IS the registry --
      # deriving from it rather than duplicating it into a parallel manifest is
      # deliberate, because a second copy of the same claims is [H-3]'s shape.
      - name: Every property has a witness, and every witness exists and runs
        run: python3 tools/check_invariants.py
      # A checker nobody has seen reject anything is indistinguishable from
      # `return 0`, and this repository has been bitten by exactly that: of the
      # first three rules in an earlier checker, two silently could not fail.
      # One arm per rule, applied to a copy of the tree.
      - name: Falsify every rule of the checker
        run: ./tools/test_check_invariants.sh

  unsafe-safety:
    name: "Every unsafe in the security core states the caller's obligations"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # CLAUDE.md section 7 required a `# Safety` clause on every `unsafe` and
      # nothing enforced it. The 2026-08-29 audit found 29 of 49 production sites
      # without one, concentrated in capability.rs (10 of 14) and memory.rs
      # (6 of 6, the string appearing nowhere in the file). Every one is called
      # from C, which cannot be made to uphold an obligation nobody wrote down.
      - name: Every production unsafe carries a # Safety clause
        run: python3 tools/check_unsafe_safety.py
      # The check only proves an obligation is WRITTEN, never that it is true or
      # upheld -- Miri and the Kani proofs are what test the code beneath. So the
      # one thing it must not do is silently pass: falsified three ways, in the
      # repository's own idiom.
      - name: Falsify the checker in every direction
        run: ./tools/test_check_unsafe_safety.sh

  apt-hardening:
    name: "No build depends on a repository this project does not use"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # `apt-get update` fails if ANY configured repository fails, including the
      # vendor lists the runner image ships and this project never uses. On
      # 2026-08-30 packages.microsoft.com answered 403 and main went red in a job
      # that installs binutils and QEMU and nothing else. 87 jobs ran a bare
      # apt-get, so any one of them could redden the run.
      - name: Every package install goes through the hardened action
        run: python3 tools/check_apt_hardening.py
      # Five arms, including one for the exemption and one for the unmutated
      # tree: four "is it caught" arms are satisfied by a checker that rejects
      # everything.
      - name: Falsify the checker in every direction
        run: ./tools/test_check_apt_hardening.sh

  doc-claims:
    name: Every documented count matches the tool that derives it
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml
      # Every number written into a document here has gone stale within days.
      # The 2026-08-19 audit found nine wrong across five files -- CI job and
      # context counts, the required set, the capability suite's check count --
      # while two other files carried them correctly, which is the only reason
      # the drift was visible. CLAUDE.md has said "re-derive every number you
      # cite" the whole time; a rule only a reader enforces fails silently.
      #
      # So the derivable claims are derived and compared against every place
      # that states them (.github/doc-claims.yml). A declared occurrence that
      # matches NOTHING fails too: otherwise rewording a sentence would delete
      # the check along with the claim, which is the failure mode in miniature.
      # The manifest also carries phrasings that were true once and are not now,
      # so a corrected fact cannot reappear in another file later.
      #
      # Static only -- no network, no QEMU, no ruleset read. Comparing the live
      # ruleset needs Administration:read and belongs to `ruleset-audit`.
      - name: Check documented claims against the tree
        run: tools/check_doc_claims.py

  rust:
    name: Rust unit tests + clippy (deny-warnings gate)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install clippy component
        run: rustup component add clippy
      - name: Unit tests (release)
        run: cargo test --manifest-path rust/Cargo.toml --release
      - name: Clippy — all targets, deny every warning
        run: cargo clippy --manifest-path rust/Cargo.toml --release --all-targets -- -D warnings
      # [I-3] falsification, run rather than trusted from a commit message. The
      # control arm restores the bounded revocation closure and its object-wide
      # overflow fallback, so the two subtree-exactness tests MUST fail. Inverted
      # with `!`: this step succeeds only when they do. A green run here would
      # mean the regression tests no longer detect the defect they exist for.
      - name: Falsify the [I-3] closure against the legacy bounded control arm
        run: |
          # Redirect rather than pipe. `if cargo test ... | tee log; then` tests the
          # PIPELINE's status, which is tee's and therefore always 0, so the
          # "control arm unexpectedly passed" branch fired on every run -- an
          # unchecked exit status inside the step that exists to check one. Actions
          # runs `bash -e` without pipefail, so the pipe silently swallowed it.
          status=0
          cargo test --manifest-path rust/Cargo.toml --release \
            --features=revoke_legacy_bounded > /tmp/legacy.log 2>&1 || status=$?
          cat /tmp/legacy.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the [I-3] regression tests PASSED against the defective closure -- they no longer witness the finding"
            exit 1
          fi
          grep -q 'test_revoke_large_subtree_is_exact_and_spares_independent_peers \.\.\. FAILED' /tmp/legacy.log
          grep -q 'test_revoke_deep_chain_is_fully_closed \.\.\. FAILED' /tmp/legacy.log
          echo "control arm reproduces [I-3]: both exactness tests fail, as required"
      # Same shape for the CSPRNG seed gate (S30). Exactly one test must fail:
      # `rng_serves_after_seeding` is the other direction and passing it under
      # the defect is the point -- an arm that broke every RNG test would prove
      # nothing about the seed check specifically.
      - name: Falsify the seed gate against the legacy unseeded control arm
        run: |
          status=0
          cargo test --manifest-path rust/Cargo.toml --release \
            --features=rng_unseeded_legacy > /tmp/rngseed.log 2>&1 || status=$?
          cat /tmp/rngseed.log
          if [ "$status" -eq 0 ]; then
            echo "::error::rng_refuses_before_seeding PASSED against a fill() with no seed check -- it no longer witnesses S30"
            exit 1
          fi
          grep -q 'rng_refuses_before_seeding \.\.\. FAILED' /tmp/rngseed.log
          grep -q 'rng_serves_after_seeding \.\.\. ok' /tmp/rngseed.log
          echo "control arm reproduces the unseeded draw, and only that test fails"
      - name: Clippy the seed-gate control arm
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --release --all-targets \
            --features=rng_unseeded_legacy -- -D warnings
      # The control arm must also stay clippy-clean, or it rots into something
      # nobody can build and the falsification quietly stops being runnable.
      - name: Clippy the control arm
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --release --all-targets \
            --features=revoke_legacy_bounded -- -D warnings

  kernel:
    name: Build kernel.elf + bootable ISO (x86_64)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Build kernel.elf
        run: make
      - name: Build bootable ISO
        run: make boot.iso
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: horus-kernel-x86_64
          path: |
            kernel.elf
            boot.iso
          if-no-files-found: error

  # Keep the non-default build configurations compiling. The default config is
  # covered by the `kernel` job above; these flags (DEBUG_SHELL, MINIMAL_SECURE)
  # toggle whole regions of the kernel via #ifdef and have broken silently
  # before when only the default build was checked. A bare `make` (no ISO) is
  # enough to catch that; -Werror=vla in CFLAGS also gates here.
  altconfigs:
    name: Build alternate configs (${{ matrix.config }})
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        config:
          - DEBUG_SHELL=1
          - MINIMAL_SECURE=1
          - SMP=1
          # SMP=0 is the uniprocessor build. It was absent from this matrix and
          # rotted: the flush-on-switch array was declared inside `#ifdef SMP`
          # and used outside it, so `make SMP=0` had stopped compiling entirely
          # and nothing noticed. A configuration nobody builds is a
          # configuration that does not work.
          - SMP=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Build kernel.elf (${{ matrix.config }})
        run: make ${{ matrix.config }}

  smoke:
    name: QEMU smoke-boot (headless)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot the kernel under QEMU and assert it reaches the shell
        run: make smoke

  smoke-aspace:
    name: QEMU address-space reclaim self-test (a rebuilt slot leaks nothing)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Rebuild a task slot repeatedly and assert the page pool returns
        run: make smoke-aspace

  smoke-wx:
    name: QEMU kernel W^X self-test (no writable+executable page anywhere)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Assert the kernel image is r-x/r--/rw- and sweep every leaf for W+X
        run: make smoke-wx

  smoke-wx-smp:
    name: QEMU kernel W^X self-test, SMP (per-CPU AP IST stack guards)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot multi-core and assert every AP IST fault stack sits above an unmapped guard
        run: make smoke-wx-smp

  # Roadmap 1.5 / finding [I-2]: the heap syscalls and the pager's region gate are
  # 64-bit clean. This target has existed, with a verified control arm, since the
  # fix landed (#145) -- and it has never run in CI, so the gate for a merged fix
  # was documented in TESTS.md and ROADMAP 1.5 while gating nothing. A witness
  # that is never executed is the same defect class as a witness that cannot be
  # heard; see G-8's floor guard.
  #
  # USER_HEAP_HIGH_BASE=1 places every heap at 8 GiB, which is what makes the
  # truncation REACHABLE rather than latent -- on the default base every heap sits
  # under 100 MiB and the 32-bit arithmetic never wraps.
  smoke-heap64:
    name: QEMU 64-bit heap self-test (heap above 4 GiB is reachable and pageable)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Place every heap at 8 GiB and assert sbrk/brk and demand paging still work
        run: make smoke-heap64

  smoke-captest:
    name: QEMU capability/syscall conformance self-test (refusals)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Assert unheld capabilities, post-revoke use and bad input are all refused
        run: make smoke-captest
      # Roadmap 3.6. Without its declared capability the central gate admits
      # everyone and the capability graph becomes readable by any ring-3 task --
      # including captest, which holds no CAP_DEBUG.
      - name: Control arm — an ungated cspace readout is readable by anyone
        run: make smoke-captest-capenum-control
      # Roadmap 2.7 / S43. The four device syscalls have NO dispatch-table slot:
      # the lookup moved into the handler when a device capability started naming
      # a device, so this file is the whole gate. An arm that only bypasses the
      # object check cannot say whether a capability is still required at all,
      # which is why this one removes the lookup entirely.
      - name: Control arm — device syscalls that gate on nothing
        run: make smoke-captest-devcap-control
      # S46's authority half. Unmasking an interrupt line decides that a device
      # may interrupt this machine again; ungated, any task can do it for
      # hardware it does not hold.
      - name: Control arm — re-enabling an interrupt without the device capability
        run: make smoke-captest-irq-ack-control
      # SYS_POLL_NOTIFY's gate. Non-blocking changes when the answer comes back,
      # never who may ask -- ungated it is finding C-2 in a new syscall.
      - name: Control arm — polling a notification the caller does not hold
        run: make smoke-captest-poll-notify-control
      # Roadmap 2.2. The tempting version of SYS_CLOCK_GETTIME reports real
      # microseconds from the TSC -- strictly more accurate, and it undoes
      # CR4.TSD by handing ring 3 the cycle-accurate timer that bit exists to
      # deny. The resolution assertion is the only thing standing between the
      # two, so it needs an arm that proves it can fire.
      - name: Control arm — a TSC-resolution clock undoes CR4.TSD
        run: make smoke-captest-clock-control
      # Console INPUT. SYS_GET_LINE's dispatch entry is SC_NONE, so its handler
      # is the only gate, and it accepted an untyped slot-3 lookup -- the decoy
      # every task is born holding -- as a fallback. Measured before the fix:
      # captest passed the check and BLOCKED inside the console read.
      #
      # This arm asserts a STALL, because a task admitted to that read prints
      # nothing at all: there is no FAIL line to require, and the absence is the
      # evidence. EXPECT_STALL fences it -- the workload must demonstrably run,
      # and must demonstrably not finish.
      - name: Control arm — the slot-3 decoy must not buy console input
        run: make smoke-captest-getline-control
      # S52. cap_mint/cap_transfer resolved their SOURCE slot through a helper
      # that spun forever on a NULL lookup, holding cap_lock with interrupts
      # masked. Every input that makes cap_lookup return NULL is caller-chosen
      # and the handlers validate none of them, so this was a whole-machine stop
      # available to any unprivileged task in one syscall.
      #
      # A stall arm again, for the getline reason: a task wedged inside a syscall
      # prints nothing. EXPECT_STALL fences it -- the probes must be REACHED and
      # then never complete, so a boot that died earlier fails rather than
      # satisfying it.
      - name: Control arm — a refused capability operation that halts instead of returning
        run: make smoke-captest-mint-hang-control
      # cap_lookup is the function every capability gate in this kernel resolves
      # through, and it used to end in an unconditional fallback to the
      # PRIMORDIAL root cnode -- reached both by a task with no cspace and by one
      # asking past the end of its own. Neither was reachable, and neither by a
      # property of cap_lookup: both rest on what create_task happens to do, in
      # another file. The witness manufactures both conditions, because a refusal
      # test whose ungated path could not have succeeded witnesses nothing.
      #
      # THREE STEPS IN THIS JOB, not a job of their own: a new job is a new
      # required context, and the ruleset is synced by hand after the merge
      # ([C-6]), so a new gating job would leave it one context behind.
      - name: A cspace-less task and an out-of-range slot are both refused
        run: make smoke-cap-lookup
      - name: Control arm — restore the fallback and require the escalation
        run: make smoke-cap-lookup-control
      - name: Control arm — the out-of-range half, which the first arm cannot reach
        run: make smoke-cap-lookup-range-control
      # task_teardown released every device resource a task held -- IRQ route, MSI
      # route, IOMMU domain, port grant, console, pipe ends -- and left its
      # CAPABILITIES in place until the slot was next used, which may be never.
      # Nothing could reach them, but only because three separate readers each
      # test `state == 0`; the property was held by those readers agreeing about
      # a flag rather than by the data.
      - name: A dead task holds no capability
        run: make smoke-cspace-release
      - name: Control arm — keep them on teardown and require the dead task to still hold one
        run: make smoke-cspace-release-control

  smoke-modules:
    name: QEMU boot-module transport (printf / tail provisioned into /bin, run from FS)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Ship printf/tail as GRUB modules, provision into /bin, run from the FS
        run: make smoke-modules

  smoke-modules-tamper:
    name: QEMU boot-module integrity gate (a tampered module payload is refused)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Corrupt one module payload in the ISO and assert the kernel refuses it
        run: make smoke-modules-tamper

  smoke-tpm:
    name: Measured boot (TPM PCRs match the reproducible manifest)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
