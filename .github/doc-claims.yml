# Claims the documentation makes that a machine can check.
#
# Every number in this repository's docs has gone stale within days at least
# once. The 2026-08-19 audit found nine of them wrong across five files while
# two other files carried the same numbers correctly -- which is the only reason
# the drift was visible at all. Writing "re-derive every number you cite" into
# CLAUDE.md did not stop it, because a rule that only a reader enforces is a
# rule that fails silently.
#
# So the derivable claims are checked instead. `tools/check_doc_claims.py`
# computes each value from the source of truth and requires every declared
# occurrence to agree, and the `doc-claims` CI job fails the build when one does
# not. Adding a claim here is how you make a number in a document load-bearing.
#
# Two kinds of entry:
#
#   counts:    a value derived from the tree, plus every place that states it.
#              A file that is declared to state a claim and does not is an
#              error too -- otherwise rewording a sentence would silently
#              delete the check along with the claim.
#
#   forbidden: text that was true once and is not any more. When you correct a
#              fact, put its old phrasing here so it cannot come back. This is a
#              ratchet: it costs one line per correction and it is the only part
#              of this file that catches prose rather than digits.

counts:
  - id: ci_jobs
    describe: jobs defined in .github/workflows/ci.yml
    derive: ci_jobs
    occurrences:
      - file: README.md
        pattern: '`\.github/workflows/ci\.yml` runs (\d+) jobs'
      - file: README.md
        pattern: "the bulk of CI's (\\d+) jobs"
      - file: TESTS.md
        pattern: '`\.github/workflows/ci\.yml` defines \*\*(\d+)\*\* jobs'
      - file: docs/LIMITATIONS.md
        pattern: '`\.github/workflows/ci\.yml` defines \*\*(\d+)\*\* jobs'

  - id: all_jobs
    describe: jobs across ci.yml, codeql.yml and ruleset-audit.yml
    derive: all_jobs
    occurrences:
      - file: TESTS.md
        pattern: 'below — \*\*(\d+)\*\* jobs'
      - file: docs/LIMITATIONS.md
        pattern: 'one more — \*\*(\d+)\*\* across the three'
      - file: docs/ROADMAP.md
        pattern: '\((\d+) jobs, \d+ contexts'

  - id: contexts
    describe: status-check contexts those jobs produce
    derive: contexts
    occurrences:
      - file: README.md
        pattern: 'The intended set is \d+ of its (\d+) contexts'
      - file: TESTS.md
        pattern: '\*\*\d+\*\* jobs, \*\*(\d+)\*\* contexts'
      - file: docs/LIMITATIONS.md
        pattern: 'producing \*\*(\d+)\*\* status-check contexts'
      - file: docs/ROADMAP.md
        pattern: '\(\d+ jobs, (\d+) contexts'

  - id: required
    describe: contexts classified as merge-gating in .github/ci-gating.yml
    derive: required
    occurrences:
      - file: README.md
        pattern: 'The intended set is (\d+) of its \d+ contexts'
      - file: TESTS.md
        pattern: 'The intended set is \*\*(\d+) required contexts'
      - file: docs/LIMITATIONS.md
        pattern: 'That intended set is \*\*(\d+) required contexts'
      - file: docs/ROADMAP.md
        pattern: 'The intended set is \*\*(\d+) required, \d+ exempted\*\*'

  - id: advisory
    describe: contexts exempted with a written reason
    derive: advisory
    occurrences:
      - file: TESTS.md
        pattern: '\*\*\d+ required contexts and (\d+) reasoned exemptions\*\*'
      - file: docs/LIMITATIONS.md
        pattern: '\*\*\d+ required contexts and (\d+) reasoned exemptions\*\*'
      - file: docs/ROADMAP.md
        pattern: '\*\*\d+ required, (\d+) exempted\*\*'

  - id: smoke_targets
    describe: "smoke-* targets in the Makefile"
    derive: smoke_targets
    occurrences:
      - file: docs/ROADMAP.md
        pattern: '\| (\d+) `smoke-\*` targets'

  - id: control_arms
    describe: control-arm smoke targets that must reproduce a defect
    derive: control_arms
    occurrences:
      - file: docs/ROADMAP.md
        pattern: 'and (\d+) of them control arms'

  - id: syscalls_covered
    describe: "syscalls whose handler a tracked workload enters (.github/syscall-coverage.yml `covered`)"
    derive: syscalls_covered
    occurrences:
      - file: SECURITY.md
        pattern: 'Currently \*\*(\d+) of \d+\*\* — the property'
      - file: TESTS.md
        pattern: 'Currently \*\*(\d+) of \d+\*\* implemented syscalls'
      - file: docs/LIMITATIONS.md
        pattern: 'gated since: \*\*(\d+) of \d+\*\* implemented syscalls'
      - file: site/index.html
        pattern: '<strong>(\d+) of \d+</strong> system calls'

  # The DENOMINATOR of the four ratios above, which until 2026-08-22 was the
  # literal `76` inside each of their patterns -- so the number every one of
  # those sentences states was the one thing here that nothing checked. It was
  # wrong when it was noticed: three syscalls with real handlers sat in the
  # dispatch table as bare numeric literals (`[4]`, `[8]`, `[9]`), and the
  # derivation reads `[SYS_NAME] = { handler`, so it could not see them. A claim
  # whose denominator is hardcoded in its own checker is not a checked claim.
  - id: syscalls_implemented
    describe: dispatch-table entries with a real handler
    derive: syscalls_implemented
    occurrences:
      - file: SECURITY.md
        pattern: 'classifies all (\d+) implemented syscalls'
      - file: SECURITY.md
        pattern: 'Currently \*\*\d+ of (\d+)\*\* — the property'
      - file: TESTS.md
        pattern: 'Currently \*\*\d+ of (\d+)\*\* implemented syscalls'
      - file: docs/LIMITATIONS.md
        pattern: 'gated since: \*\*\d+ of (\d+)\*\* implemented syscalls'
      - file: site/index.html
        pattern: '<strong>\d+ of (\d+)</strong> system calls'

  - id: captest_checks
    describe: check() assertions in userspace/captest.c
    derive: captest_checks
    occurrences:
      - file: SECURITY.md
        pattern: '`make smoke-captest` \((\d+) checks\)'
      - file: TESTS.md
        pattern: '\| `smoke-captest` \| \*\*(\d+) checks\*\*'
      - file: docs/BUILDING.md
        pattern: 'are all refused \((\d+) checks'
      - file: TESTS.md
        pattern: 'Capability conformance \((\d+) checks'
      - file: site/index.html
        pattern: 'make smoke-captest\s+<span class="c"># (\d+) capability checks'

forbidden:
  - pattern: 'build twice from clean and diff'
    reason: >-
      make reproducible-build builds ONCE and records .build.sha. The
      double-build-and-diff is the `reproducible` CI job's. Corrected
      2026-08-19; it had been wrong since the target was written.

  - pattern: 'currently also \*commits\* a prebuilt'
    reason: >-
      No build artefact is tracked. kernel.elf and boot.iso are gitignored
      (.gitignore:10-11) and `git ls-files` lists neither. Corrected 2026-08-19.

  - pattern: 'that App does not exist yet|inert until (that|its read-only GitHub) App is created|stays open until the App is created'
    reason: >-
      The ruleset-audit GitHub App went live 2026-08-19; the scheduled run that
      morning read the ruleset and reported it matching. What remains of [C-6]
      is that syncing is manual and lags a merge.

  - pattern: 'pt_walk\(tasks\[cur\]\.cr3, v\) disagrees with the hardware walk|refuses a user address that ring 3 demonstrably has mapped'
    reason: >-
      Issue #176's original analysis, and it was wrong. The kernel's walk agreed
      with the hardware exactly (ucr3 == livecr3, measured); it was walking a
      DIFFERENT address, because sys_dmesg/sys_audit_digest truncated the
      caller's pointer to 32 bits. Corrected 2026-08-20 -- the fix is in
      include/syscall.h, not in paging.c.

  - pattern: '\*Open, page-table half fixed'
    reason: >-
      [G-10] closed 2026-08-18. Its header in ARCHITECTURE.md said open while
      its own body and six other files said closed. Corrected 2026-08-19.

  - pattern: 'cargo test .*\|\| true'
    reason: >-
      The `|| true` on `make test` was removed 2026-08-16; the exit status is
      real. Any document describing it as still swallowed is stale.

  - pattern: 'ROOT ONLY \(uid==0\)'
    reason: >-
      SYS_DMESG has been gated on CAP_KERNEL_LOG + READ since [I-1]; the
      dispatch table is the truth and docs/SYSCALLS.md already said so. This
      phrasing survived in include/syscall.h -- the header every userspace
      program includes -- as the last ambient-uid-0 claim in the tree,
      contradicting S18. Corrected 2026-08-22. No syscall in this system is
      authorised by the caller's uid.

  - pattern: 'demand 76 of 76|require 76 of 76|of 76\*\* implemented syscalls'
    reason: >-
      The implemented-syscall count was 76 only because three syscalls with real
      handlers were bare numeric literals in the dispatch table and the
      derivation could not see them. It is 81, and the denominator is a declared
      claim now rather than a constant inside its own checker. Corrected
      2026-08-22.

  - pattern: 'receive still polls an empty queue instead of blocking'
    reason: >-
      SYS_IPC_RECV_BLOCK landed with roadmap 1.3 and sleeps on an empty queue;
      smoke-recvblock proves it made exactly one receive syscall per message.
      site/index.html still called it Partial on that ground. Corrected
      2026-08-22.

  - pattern: 'host-side scratch code; built by no target and run by no workflow'
    reason: >-
      The repository layout table advertised tests/ as dead weight. Either it is
      wired to a target or it does not belong in the table. Corrected 2026-08-21.

  - pattern: 'This table is the complete list — if you'
    reason: >-
      docs/BUILDING.md asserted its defect-flag table was complete while three
      DEFECT_FLAGS members had no row (RESUME_RSP_INJECT, RESUME_RSP_INJECT_PRECLAIM,
      WAL_CRASHTEST). The claim is now derived by tools/check_defect_flags.py rather
      than asserted. Corrected 2026-08-21.

  - pattern: 'docs/AUDIT-2026-07(-27)?\.md|docs/proposals/console-server\.md'
    reason: >-
      The two audits were merged into docs/AUDIT.md (the July 2026 one is Appendix A)
      and the console-server document moved to docs/design/, since it describes what
      was built rather than a proposal. Corrected 2026-08-21.

  - pattern: '^\| after \| 30 \| \*\*0\*\* \|$'
    reason: >-
      TESTS.md presented "after: 30 runs / 0 failures" as establishing the
      scheduler claim fix. Thirty boots has ~26% power against a 1%-per-boot
      event, so it established only that the ~50% impersonation false positive
      had stopped. A sample size stated without its detection power is a claim
      about absence that the sample cannot support. Corrected 2026-08-21, when
      the invariant fired again in the default boot workload.

  - pattern: 'always a CPU that has gone idle while'
    reason: >-
      [G-9]'s signature was recorded as a claim held by an IDLE cpu. Every
      capture on 2026-08-21 shows the holder running another LIVE task, with no
      deferred debt and no impersonation -- which is what moved the search off
      the deferred-release machinery two fixes had already targeted. Corrected
      2026-08-21; the idle shape was one observation, not the definition.

  - pattern: 'S20 park path; ADVISORY'
    reason: >-
      smoke-kstack-park's job name carried "ADVISORY -- open finding G-9" in the
      status-check context itself. Both halves went false on 2026-08-21 when [G-9]
      closed and 2026-08-22 when the gate was promoted. Renamed in the one window
      where it was free: the context was not yet in the ruleset, so no
      demotion-then-promotion was needed. Corrected 2026-08-22.

