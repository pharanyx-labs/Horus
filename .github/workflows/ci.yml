  smoke-fs-wal-flush:
    name: QEMU journal durability gate (a failed FLUSH CACHE aborts the commit)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # blkdebug fails every flush_to_disk; a kernel with the [I-10] barriers must
      # issue FLUSH CACHE, see the error and refuse to commit. Under any ordinary
      # cache mode the emulator persists writes on its own, so this is the only
      # configuration in which the command's presence is observable at all.
      - name: Fail every FLUSH CACHE and assert the journal refuses to commit
        run: make smoke-fs-wal-flush
      # The falsification, run in CI rather than trusted from a commit message:
      # with the barriers compiled out the refusal must NOT appear.
      - name: Falsify it against WAL_NO_FLUSH=1
        run: make smoke-fs-wal-flush-control

  smoke-fs-wal-order:
    name: QEMU journal write-ahead ordering (barriers bracket the commit record)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Presence is not enough: a barrier placed after the commit header would
      # satisfy error injection identically while losing the write-ahead rule.
      # smoke_test.sh fails closed if this QEMU has no trace backend, so the
      # assertion cannot pass by observing nothing.
      - name: Trace IDE commands and assert 0x30 -> 0xe7 -> 0x30 -> 0xe7
        run: make smoke-fs-wal-order
      - name: Falsify it against WAL_NO_FLUSH=1
        run: make smoke-fs-wal-order-control

  smoke-fs-large:
    name: QEMU large-file (double-indirect) self-test (headless)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot BIGFILE_SELFTEST kernel and assert an inode maps through the double-indirect region
        run: make smoke-fs-large

  smoke-pipe:
    name: QEMU pipe self-test (round-trip / EOF / EPIPE / back-pressure)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot PIPE_SELFTEST kernel and assert the pipe object round-trips with correct EOF/EPIPE/back-pressure
        run: make smoke-pipe

  smoke-init-fs:
    name: QEMU delegated boot-through-init filesystem self-test (headless)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot INIT_FS_SELFTEST kernel and assert the fs_server works when init spawns and endows it
        run: make smoke-init-fs

  smoke-newlib-tamper:
    name: Supply-chain falsification (a tampered newlib tarball is refused)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The test itself needs no QEMU, no kernel build and no network -- the
      # negative control only needs the fetch to be skipped, which happens
      # whenever the tarball already exists. But the Makefile's cargo/rust-target
      # guard runs at PARSE time, so it fires for every target including this one;
      # the toolchain step is required to reach any recipe at all. Kept minimal:
      # no apt install of QEMU, which is the slow part of the other jobs.
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Assert the pinned newlib SHA-256 refuses tampered bytes, before unpacking
        run: make smoke-newlib-tamper

  smoke-newlib:
    name: QEMU newlib libc self-test (headless)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # newlib/ is gitignored, so unlike every other job this one has a
      # dependency the checkout does not carry. Cache the built libc across
      # runs; the key tracks the build script, which pins the newlib version.
      - name: Cache built newlib
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: newlib/install
          key: newlib-${{ runner.os }}-${{ hashFiles('tools/build_newlib.sh') }}
      - name: Build newlib (no-op on cache hit)
        run: tools/build_newlib.sh
      - name: Boot NEWLIB_SELFTEST kernel and assert the newlib libc port over the POSIX fd layer works
        run: make smoke-newlib
      # Roadmap 2.4's witness. The base gate above now asserts "." and ".." in
      # paths passed to open() -- the migration's whole point, since a libc
      # program never goes through the shell's string normaliser. These two arms
      # prove those assertions can fail, and fail SEPARATELY.
      - name: Control arm — posix.c's private walker resolved neither "." nor ".."
        run: make smoke-newlib-walk-control
      # Aimed at a branch that shipped dead in #195: ".." asked fs_server for a
      # ".." entry, and fs_server creates none. The pinned case returns before
      # the lookup, which is why the only existing ".." test passed over it.
      - name: Control arm — asking the server for ".." finds nothing, because nothing creates it
        run: make smoke-newlib-dotdot-control

  reproducible:
    name: Verify reproducible kernel build
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # reproducible-build now builds boot.iso as well, because recording a
      # hash for an artifact the target never built is what this commit fixes.
      - name: Install build toolchain
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The recording step used to be `sha256sum kernel.elf boot.iso >
      # .build.sha 2>/dev/null || true`, over a build that never produced
      # boot.iso -- so it hashed one artifact, hid the error naming the other,
      # swallowed the status, and announced success. These two steps are the
      # gate on that: an incomplete build must be refused, and the arm that
      # restores the old line must record an incomplete build and report
      # success. Host-side and sub-second; the budget below is for the builds.
      - name: The recording step must refuse an incomplete build
        run: make smoke-repro-sha
      - name: Restore the swallowed status and require the incomplete record
        run: make smoke-repro-sha-control
      - name: Build twice and compare kernel.elf hashes
        run: |
          make reproducible-build
          cp .build.sha first.sha
          make reproducible-build
          cp .build.sha second.sha
          # Completeness, end to end: smoke-repro-sha proves the step refuses a
          # short record, this proves a real build produces a full one.
          for f in first.sha second.sha; do
            n=$(wc -l < "$f")
            if [ "$n" -ne 2 ]; then
              echo "::error::$f records $n artifacts, expected 2 (kernel.elf, boot.iso)"
              cat "$f"; exit 1
            fi
          done
          # kernel.elf is the reproducible artifact and the one gated here.
          #
          # boot.iso is deliberately NOT compared, and the reason is measured
          # rather than assumed. grub-mkrescue stamps a marker named for the
          # wall-clock second -- /.disk/YYYY-MM-DD-HH-MM-SS-00.uuid -- into the
          # tree it hands to xorriso, and embeds that same UUID in the EFI
          # loaders it generates (efi.img, efi/boot/bootx64.efi,
          # System/Library/CoreServices/boot.efi). xorriso itself honours
          # SOURCE_DATE_EPOCH and says so in this log; the marker is not
          # xorriso's to date. Extract two ISOs of one build and diff them and
          # every Horus-authored file -- kernel.elf, every boot module,
          # grub.cfg -- is byte-identical, with only those four grub-generated
          # objects differing. Two builds inside one wall-clock second are
          # bit-identical; two seconds apart are not, which is also how a
          # too-quick first measurement of this called the ISO reproducible.
          # Gating on it would redden this required job on a clock, so the
          # limitation is documented (docs/LIMITATIONS.md 5.3a) rather than
          # gated into a flake. See CHANGES.md 2026-08-19.
          grep ' kernel\.elf$' first.sha  > first.kernel
          grep ' kernel\.elf$' second.sha > second.kernel
          if ! diff -u first.kernel second.kernel; then
            echo "::error::kernel.elf is not byte-for-byte reproducible"
            exit 1
          fi
          echo "kernel.elf is byte-for-byte reproducible across clean builds"

  # This job IS a required status check in the ruleset. What is advisory is its
  # FINDINGS, not the job: `make security` is advisory by design (four of its six
  # scanners already swallow failures), and it scans the workflow files and host
  # tooling with rulesets (incl. semgrep --config=auto) whose findings — e.g.
  # mutable action tags, curl|sh installs — are CI hygiene rather than kernel
  # defects, and whose registry-fetched rules can change with no code change. So
  # exactly one step carries continue-on-error (the scan itself), and the step
  # before it asserts every scanner is actually installed and fails if one is not.
  #
  # This comment used to read "Advisory job ... does NOT gate merges. The hard
  # gates are the other four jobs (rust, kernel, smoke, reproducible)", which was
  # simply false and contradicted the note 50 lines below in this same job. It is
  # recorded rather than silently deleted because the false comment is what made
  # the pre-#154 state — a required check on which every step swallowed failure —
  # look deliberate.
  security:
    name: Security scans + SBOM generation (Semgrep, Trivy, gitleaks, etc.)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # needed for gitleaks full history scan

      # Network installs are retried rather than tolerated. Every step in this
      # job used to be continue-on-error, so a failed install meant the scanners
      # were simply absent and the job went green having run nothing. Retrying
      # absorbs the transient failures that motivated the blanket tolerance --
      # the apt step in this repo's CI has flaked twice in one day -- so the
      # verification below can insist on the tools being present without the
      # gate becoming a coin flip.
      - name: Install security tools + Rust target (pinned where practical)
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 5; done; return 1; }
          # Same reason as .github/actions/apt: a vendor repository this project
          # does not use must not decide whether the build runs. This job keeps
          # its own inline installs because they are pinned by version and
          # checksum, but it needs the strip for the same reason every other job
          # does -- it was the retry here, added when "the apt step has flaked
          # twice in one day", that was never carried to the other 86.
          # By CONTENT, not by filename: on Ubuntu 24.04 the main archive is
          # ubuntu.sources in this same directory, and a blanket delete leaves the
          # runner with no repositories at all. See .github/actions/apt.
          for f in /etc/apt/sources.list.d/*; do
            [ -e "$f" ] || continue
            grep -qi 'ubuntu\.com' "$f" || sudo rm -f "$f"
          done
          retry sudo apt-get update
          retry sudo apt-get install -y cppcheck flawfinder
          retry sh -c 'pipx install semgrep || pip install semgrep'
          # Trivy — pinned release + checksum verification (avoids curl|sh)
          TRIVY_VERSION=0.72.0
          retry curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy && sudo mv trivy /usr/local/bin/ && rm trivy.tar.gz
          # gitleaks pinned. The module path is github.com/zricethezav/gitleaks/v8
          # -- NOT github.com/gitleaks/gitleaks, which is the repo path. `go install`
          # on the latter fails with "go.mod has post-v8 module path", and it had
          # done so on every run: the line ended in `|| true`, inside a job where
          # every step was continue-on-error, so the pinned install never once
          # succeeded and nothing said so. `make security` then fell back to its own
          # curl|tar of a DIFFERENT version (8.30.1) with no checksum -- the exact
          # pattern the trivy install above exists to avoid. Caught by the presence
          # check below on its first run.
          retry go install github.com/zricethezav/gitleaks/v8@v8.21.0
          # ...and put it somewhere PATH actually looks. `go install` writes to
          # $(go env GOPATH)/bin, which is NOT on PATH on GitHub runners, so even
          # a successful install left `command -v gitleaks` failing -- the second
          # layer of the same silent failure, hidden by the same `|| true`.
          sudo install -m 0755 "$(go env GOPATH)/bin/gitleaks" /usr/local/bin/gitleaks
          # Rust bare-metal target for cargo-audit and Makefile
          retry rustup target add x86_64-unknown-none
          retry cargo install cargo-audit

      # The VACUOUS guard, and the point of this job's existence as a REQUIRED
      # check. smoke-session-smp-soak already established the pattern: "a run
      # that exits 0 having proven nothing is reported VACUOUS and fails, so the
      # gate cannot go green on a test that stopped testing."
      #
      # This job was the same defect one level up. It is a required status check
      # in the ruleset, yet every step carried continue-on-error, so it could not
      # go red for any reason whatsoever -- including the scanners not being
      # installed at all. A required check that structurally cannot fail is worse
      # than no check: it reads as coverage while providing none.
      - name: Assert the scanners actually exist (else this job proves nothing)
        run: |
          set -uo pipefail
          missing=0
          for t in semgrep trivy gitleaks cppcheck flawfinder; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "present: $t"
            else
              echo "::error::$t is not installed -- this job would scan nothing and report success"
              missing=1
            fi
          done
          if ! cargo audit --version >/dev/null 2>&1; then
            echo "::error::cargo-audit is not installed -- Rust advisories would not be checked"
            missing=1
          fi
          exit $missing

      # FINDINGS stay advisory, deliberately, and this is the one continue-on-error
      # that remains. It is not tolerance for flake -- it is that `make security`
      # cannot currently gate on content:
      #
      #   semgrep      CAN fail (--error) but runs --config=auto, whose rules are
      #                fetched from a registry and change with no commit here, and
      #                which scans workflow files and host tooling for CI hygiene
      #                (mutable action tags, curl|sh) rather than kernel defects
      #   trivy        exits 0 on findings (no --exit-code)
      #   gitleaks     `|| true`
      #   cppcheck     `| head -80 || true` -- the pipe discards the status anyway
      #   flawfinder   `| head -60 || true` -- likewise
      #   cargo-audit  `|| echo ...`
      #
      # So five of six scanners swallow their result inside the Makefile, and the
      # sixth is the least reproducible. Gating on findings today would redden the
      # pipeline on upstream rule drift while adding no real coverage -- the exact
      # press-re-run reflex that let the smoke-console-smp deadlock survive months
      # of CI (docs/LIMITATIONS.md 5.2c). Pinning the rulesets is what unlocks
      # gating on content; until then this job gates on the scan having HAPPENED.
      - name: Run security checks (findings advisory -- see note above)
        continue-on-error: true
        run: make security

      # The SBOM is a deliverable, not an observation: if it cannot be produced
      # the artifact below is empty and [I-9]'s provenance story is worse than it
      # looks. Allowed to fail the job.
      - name: Generate SBOM (CycloneDX via Trivy)
        run: |
          set -euo pipefail
          trivy fs --format cyclonedx --output sbom.cyclonedx.json \
            --scanners vuln,secret,misconfig .
          test -s sbom.cyclonedx.json
          echo "SBOM generated: sbom.cyclonedx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: horus-sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

  # Advisory job: coverage-guided fuzzing of the pointer/scalar FFI predicates in
  # the Rust security core (rust/fuzz). Non-gating by design — it hunts panics/UB
  # on adversarial inputs, but a finding (or a flaky nightly/libFuzzer setup) must
  # not redden the pipeline. The hard gates stay the other four jobs (rust,
  # kernel, smoke, reproducible). Short per-target budget for CI; run longer
  # locally with `cargo +nightly fuzz run <target>`.
  fuzz:
    name: FFI fuzzing (cargo-fuzz, advisory)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install nightly toolchain + cargo-fuzz
        continue-on-error: true
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add --toolchain nightly rust-src
          cargo install cargo-fuzz || true

      - name: Build fuzz targets
        continue-on-error: true
        working-directory: rust
        run: cargo +nightly fuzz build

      - name: Run fuzz targets (short budget)
        continue-on-error: true
        working-directory: rust
        run: |
          for t in ct_eq validate_page_fault signal_handler_addr elf_validate_header elf_load_plan elf_i386_reloc elf_x86_64_reloc; do
            echo "== fuzzing $t =="
            cargo +nightly fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=4096 || true
          done

  miri:
    name: "Undefined-behaviour check of the security core (Miri)"
    runs-on: ubuntu-latest
    # Two minutes of interpreter time, measured. The bound is a backstop against
    # a test that has become pathological under Miri, not a budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install PyYAML
        run: pip install --user pyyaml
      # Source-only and instant, and it is the half that catches a NEW module
      # nobody classified -- so it runs before the toolchain install.
      - name: Every test module is run under Miri or excused with a reason
        run: python3 tools/check_miri_scope.py
      # A pinned nightly rather than a floating one: Miri ships as a rustup
      # component and is occasionally absent for a given date, so a floating
      # nightly turns "is there UB" into "did today's nightly build a component",
      # which is a different question and not one that should redden a merge.
      # This is the same nightly Kani pins, which keeps one toolchain in the
      # cache rather than two.
      - name: Install the pinned nightly and Miri
        run: |
          # One --component per component: `--component miri rust-src` reads
          # `rust-src` as a second TOOLCHAIN name and fails with "invalid
          # toolchain name". Reproduced locally after CI caught it, which is the
          # only reason this line is written the long way.
          rustup toolchain install nightly-2025-11-21 --profile minimal \
            --component miri --component rust-src
      # No continue-on-error. Miri is the only check in this tree that looks for
      # undefined behaviour, and the `unsafe` it exists for is the C FFI boundary
      # in the security core.
      #
      # The --skip flags come FROM the manifest, so the scope and the command
      # cannot drift apart: there is only one list.
      - name: Interpret the security core and check for UB
        working-directory: rust
        run: |
          set -euo pipefail
          skips=$(python3 ../tools/check_miri_scope.py --print-skip-args)
          echo "skipping: ${skips:-<nothing>}"
          # shellcheck disable=SC2086
          cargo +nightly-2025-11-21 miri test -- $skips

  kani-bounded:
    name: "Formal verification of the capability algebra (the proofs that finish)"
    runs-on: ubuntu-latest
    # Measured twice on 2026-08-23: 319 s for eleven harnesses cold, 196 s for
    # thirteen warm. More proofs in less time, because what dominates is the
    # rebuild each `cargo kani --harness` invocation may need rather than the
    # solving -- so neither figure alone is a budget. Solver time itself is about
    # three minutes, nearly all of it the two revocation proofs. The 45-minute
    # bound is a backstop against a harness that has become pathological.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install PyYAML
        run: pip install --user pyyaml
      # Cheap, no toolchain needed, and it is the half that catches a NEW proof
      # nobody wired up -- so it runs before the expensive install.
      - name: Every Kani proof is classified as gating or excused
        run: python3 tools/check_kani_harnesses.py
      # Cheap and source-only, so it rides along here rather than paying for its
      # own runner. The cspace slot map is written down twice -- kernel.h and
      # syscall.h -- and nothing compared them until a new CAPSLOT_DEBUG was
      # added as 18, which CAPSLOT_UNTYPED already was.
      - name: The cspace slot map is consistent across both headers
        run: python3 tools/check_capslots.py
      # Same shape, same file pair, same reason it rides along here. Seven structs
      # cross the ring-3 boundary and are written down in BOTH headers because
      # neither includes the other; nothing compared them. All seven agree today,
      # which is exactly when to gate it -- the kernel fills these and copies them
      # to a ring-3 buffer sized by the OTHER definition, and neither compiler
      # sees both files, so drift is silent until it is a write past the end of a
      # user buffer or a driver reading the wrong MMIO range.
      - name: Every ABI struct is identical in both headers
        run: python3 tools/check_abi_structs.py
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      # No continue-on-error, and that is the entire point of this job. The
      # `kani` job below has carried it on every step since it was written, so
      # thirteen proofs of the capability algebra could not have failed a build.
      - name: Verify the gating harnesses
        working-directory: rust
        run: |
          set -euo pipefail
          # Newline-separated and read line by line rather than $(...) word
          # splitting: the same loop written for a space-separated string is
          # correct in bash and silently passes ELEVEN NAMES AS ONE ARGUMENT in
          # zsh, which does not word-split unquoted expansions. It cost a
          # confusing local run on 2026-08-23; a CI step that only works in one
          # shell is a trap for whoever runs it by hand.
          python3 -c "import yaml;print('\n'.join(yaml.safe_load(open('../.github/kani-harnesses.yml'))['gating']))" > /tmp/gating.txt
          while IFS= read -r h; do
            [ -n "$h" ] || continue
            echo "== $h =="
            cargo kani --harness "$h"
          done < /tmp/gating.txt

  # Advisory job: Kani bounded model checking of the capability engine's
  # authority invariants (rust/src/capability.rs #[cfg(kani)] harnesses; see
  # rust/KANI.md). Non-gating by design — Kani is a heavy separate toolchain
  # (its own nightly + a ~140 MB CBMC bundle), so a slow or flaky setup must not
  # redden the pipeline. The hard gates stay rust, kernel, smoke, reproducible.
  #
  # MANUAL-ONLY for now: a full `cargo kani` (all harnesses, incl. the serial-keyed
  # lineage proofs that build a large SAT instance) now exceeds GitHub's 6-hour job
  # ceiling and stalls every pipeline. Gate it to `workflow_dispatch` so it no
  # longer runs on push/PR; run it on demand via "Run workflow". A `timeout-minutes`
  # bound stops even a manual run from hanging. Re-enable automatic runs once
  # trimmed to a bounded harness subset / per-harness time limit (see rust/KANI.md).
  kani:
    name: Formal verification (Kani, advisory)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Kani
        continue-on-error: true
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Verify capability-engine proofs
        continue-on-error: true
        working-directory: rust
        run: cargo kani
