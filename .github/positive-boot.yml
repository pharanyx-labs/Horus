# Census of SECURITY.md rows witnessed only by a positive boot. Roadmap 4.21.
#
# A row is on this list when its witness names at least one `make` target and
# names no control arm, no defect flag, and no host proof. The witness is the
# boot reaching its marker. This file does not add the arms, and it does not
# change a row. tools/check_positive_boot.py fails unless the set it derives
# from the table is exactly these ids. A row leaves the list only in the change
# that gives its witness an arm. A missing file, a line that is not an id, or
# a table the parser barely read is a failure.

