# Boot menu for INSTALL MEDIA: install, or run live and change nothing.
#
# The shipping image keeps grub.cfg -- one entry, no timeout, no menu -- because
# every gate boots it and because a machine that boots from its own disk has no
# choice to offer. This file is for the image somebody writes to a USB stick.
#
# ---------------------------------------------------------------------------
# THE MENU IS ON THE SCREEN, NOT JUST THE SERIAL LINE.
#
# grub.cfg sets `terminal_input serial` and `terminal_output serial` and nothing
# else, which is correct for a headless gate and useless on a laptop: with
# timeout=0 that never mattered, because there was no menu to miss. A menu shown
# only on a port the machine does not have is a machine that appears to hang for
# ten seconds and then does something the operator never chose. Both terminals
# are listed so the menu is visible and usable either way.
# ---------------------------------------------------------------------------
# The port is CONFIGURED BEFORE IT IS SELECTED, which is the order grub.cfg uses
# and the order that works: selecting a serial terminal GRUB has not been told
# the speed of leaves the menu undrawn on that terminal. Measured 2026-09-11 --
# with these two lines reversed the menu never reached the wire at all, and the
# boot looked like a machine that had silently taken the default.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

# ---------------------------------------------------------------------------
# THE EDITOR IS LOCKED, AND THIS IS THE LINE THAT DOES IT.
#
# A visible menu makes GRUB's `e` (edit this entry) and `c` (command line)
# reachable by anyone standing at the machine. That matters here specifically:
# the entries below differ ONLY by a word on the kernel command line, so editing
# one turns a live boot into an install -- exactly the transition this file
# exists to make deliberate.
#
# `set superusers=""` sets the superuser list to the empty string. GRUB then
# restricts editing and the command line to superusers, and no one can
# authenticate as one, so `e` and `c` are refused. `--unrestricted` on each
# entry keeps them bootable by anybody, which is what a boot menu is for.
#
# WHAT THIS IS NOT. It is not protection against an attacker with physical
# access, and it must not be read as one: anyone who can boot this media can
# boot their own instead. What it removes is the specific case of turning THIS
# media's live entry into an install with two keystrokes. The defence that
# actually holds is that the kernel command line is measured into PCR[8] since
# 2026-09-11 -- an edited command line cannot unseal a TPM-sealed volume, so
# confidentiality survives even when the boot does not. See docs/LIMITATIONS.md
# for what physical access still gets: destruction, which nothing here prevents.
# ---------------------------------------------------------------------------
set superusers=""

# LIVE IS THE DEFAULT AND IS FIRST, and that is the fail-closed direction rather
# than a preference. A timeout that expires unattended must land on the entry
# that changes nothing on the disk; an operator who wrote this stick to install
# is present by definition and can press Down. The cost of a wrong default in
# the other direction is an installer offered to a machine nobody chose to
# reinstall, which is the asymmetry machine_needs_install() already argues.
set default=0
set timeout=10

menuentry "Horus - live boot (changes nothing on disk)" --unrestricted {
    insmod multiboot2
    insmod all_video
    insmod part_msdos
    insmod part_gpt
    insmod iso9660
    insmod fat
    search --no-floppy --set=root --file /boot/kernel.elf
    # `horus.live` is a POSITIVE request, not the absence of the other word, and
    # this entry would otherwise be a lie: with no command line at all the kernel
    # behaves like the shipping image, which offers to install a disk carrying no
    # volume -- on the very machine somebody is most likely to boot this stick at.
    # The token is what makes "changes nothing on disk" true.
    multiboot2 /boot/kernel.elf horus.live
@HORUS_MODULES@
    boot
}

menuentry "Install Horus (erases a disk you choose)" --unrestricted {
    insmod multiboot2
    insmod all_video
    insmod part_msdos
    insmod part_gpt
    insmod iso9660
    insmod fat
    search --no-floppy --set=root --file /boot/kernel.elf
    # `horus.install` is the whole difference between the two entries. The kernel
    # matches it as a WHOLE WORD and measures the line it matched, so this entry
    # and the one above are distinguishable both to init and to the TPM.
    #
    # It does not skip anything: the installer still surveys the machine, shows
    # what will be destroyed, asks every question, shows them back, and requires
    # a typed word -- REPLACE rather than FORMAT when the disk is not empty.
    # Choosing this entry asks to be ASKED; it does not consent to anything.
    multiboot2 /boot/kernel.elf horus.install
@HORUS_MODULES@
    boot
}
