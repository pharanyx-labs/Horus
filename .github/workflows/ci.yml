    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Assert the kernel image is r-x/r--/rw- and sweep every leaf for W+X
        run: make smoke-wx

  smoke-wx-smp:
    name: QEMU kernel W^X self-test, SMP (per-CPU AP IST stack guards)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot multi-core and assert every AP IST fault stack sits above an unmapped guard
        run: make smoke-wx-smp

  # Roadmap 1.5 / finding [I-2]: the heap syscalls and the pager's region gate are
  # 64-bit clean. This target has existed, with a verified control arm, since the
  # fix landed (#145) -- and it has never run in CI, so the gate for a merged fix
  # was documented in TESTS.md and ROADMAP 1.5 while gating nothing. A witness
  # that is never executed is the same defect class as a witness that cannot be
  # heard; see G-8's floor guard.
  #
  # USER_HEAP_HIGH_BASE=1 places every heap at 8 GiB, which is what makes the
  # truncation REACHABLE rather than latent -- on the default base every heap sits
  # under 100 MiB and the 32-bit arithmetic never wraps.
  smoke-heap64:
    name: QEMU 64-bit heap self-test (heap above 4 GiB is reachable and pageable)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Place every heap at 8 GiB and assert sbrk/brk and demand paging still work
        run: make smoke-heap64

  smoke-captest:
    name: QEMU capability/syscall conformance self-test (refusals)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Assert unheld capabilities, post-revoke use and bad input are all refused
        run: make smoke-captest

  smoke-modules:
    name: QEMU boot-module transport (printf / tail provisioned into /bin, run from FS)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Ship printf/tail as GRUB modules, provision into /bin, run from the FS
        run: make smoke-modules

  smoke-modules-tamper:
    name: QEMU boot-module integrity gate (a tampered module payload is refused)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Corrupt one module payload in the ISO and assert the kernel refuses it
        run: make smoke-modules-tamper

  smoke-tpm:
    name: Measured boot (TPM PCRs match the reproducible manifest)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU + swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86 swtpm swtpm-tools python3
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot under an emulated TPM; assert PCR[8]/PCR[9] equal the host recomputation
        env:
          SWTPM_REQUIRED: "1"   # a missing swtpm must fail, not skip
        run: make smoke-tpm

  measured-boot-required:
    name: "Measured boot can be required, and then an unmeasured boot does not proceed"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU + swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86 swtpm swtpm-tools python3
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The policy must not break a machine that satisfies it. A gate that only
      # checked the refusal is passed by a kernel that halts on every boot.
      - name: A machine with a TPM still boots, and measures
        env:
          SWTPM_REQUIRED: "1"   # a missing swtpm must fail, not skip
        run: make smoke-measured-boot-required
      # The case docs/LIMITATIONS.md 2.9 described: no TPM, so PCRs are never
      # extended and the volume key is never sealed. It must halt.
      - name: Control arm — no TPM, and the boot does not proceed
        run: make smoke-measured-boot-required-control
      # The other half, and the one with the real downgrade in it: a volume that
      # was never sealed unlocks on the password alone. The ephemeral vdisk is
      # exempt by design, so this arm removes the exemption to reach the branch.
      - name: Control arm — an unsealed volume is refused, not silently accepted
        env:
          SWTPM_REQUIRED: "1"
        run: make smoke-measured-boot-required-volume-control

  smoke-tpm-tamper:
    name: Measured boot falsification (a tampered module diverges the PCRs)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU + swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86 swtpm swtpm-tools python3
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Corrupt one module payload; assert it is refused AND the measured PCRs diverge
        env:
          SWTPM_REQUIRED: "1"   # a missing swtpm must fail, not skip
        run: make smoke-tpm-tamper

  smoke-tpm-seal-roundtrip:
    name: TPM seal/unseal round-trip (PolicyPCR-bound secret)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU + swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86 swtpm swtpm-tools
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Seal a secret under PolicyPCR(8,9), unseal it, and prove it is denied after a PCR change
        env:
          SWTPM_REQUIRED: "1"   # a missing swtpm must fail, not skip
        run: make smoke-tpm-seal-roundtrip

  smoke-tpm-seal:
    name: TPM-sealed vdisk KEK (measured-good boot unlocks; changed PCR stays locked)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU + swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86 swtpm swtpm-tools
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Format the vdisk in TPM mode, unlock it, then require a changed PCR to leave it locked
        env:
          SWTPM_REQUIRED: "1"   # a missing swtpm must fail, not skip
        run: make smoke-tpm-seal

  smoke-coreutils-shell:
    name: QEMU GNU coreutils via the shell (head / wc / seq on real files)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
