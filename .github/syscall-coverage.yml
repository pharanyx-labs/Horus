# Which syscall HANDLER BODIES a tracked workload actually enters.
#
# Not "is the syscall named by a test" and not "does it return success" --
# entered. That distinction is the whole reason this file exists. `captest` is a
# REFUSAL suite by construction: its two checks naming SYS_DMESG and
# SYS_AUDIT_DIGEST both assert SYS_ERR_PERM, and the central capability gate
# returns before the handler runs. Both syscalls were "tested"; neither handler
# had ever executed; and issue #176 -- a pointer truncation in both wrappers,
# 100% reproducible for every static buffer in the system -- was invisible to
# all 100 checks.
#
# The tracked workloads are the three in `make smoke-syscall-coverage`: the full
# ring-3 session (tools/session_test.py), the capability conformance suite, and
# the boot-modules session (tools/modules_session.py), which is the only image
# with real programs in /bin and therefore the only one that can run a pipeline.
# Their union is MEASURED on every run by tools/check_syscall_coverage.py, which
# fails if:
#   - an implemented syscall is in neither list (an unanswered question, the
#     [C-6] failure mode applied to test coverage);
#   - a syscall listed `covered` is NOT entered (a test quietly stopped
#     exercising it);
#   - a syscall listed `uncovered` IS entered (the reason has gone stale and it
#     should be promoted).
#
# This does not demand every syscall be covered. It demands that the number be
# decided rather than drifting, and that every gap be written down.
#
# The `uncovered` reasons say why the TRACKED WORKLOADS do not reach each one.
#
# Ten of them used to name another build that supposedly would, as unmeasured
# hypotheses. All ten were measured on 2026-08-20 by booting those builds under
# SYSCALL_COVERAGE=1, and each now records what was OBSERVED rather than what was
# assumed. Six were confirmed; FOUR WERE WRONG -- SIGNAL_SELFTEST does not drive
# sigaction or sigreturn (it passes while entering only syscalls 0 and 11), and
# IRQ_POLICY_AUDIT does not drive SYS_IRQ_POLICY_INFO. Two more, SYS_EXEC and
# SYS_EXEC_IMAGE, are reached by no build known in this tree.
#
# The six confirmed are NOT promoted to `covered`, and the reason is a cost
# judgement rather than a doubt: `covered` means "a TRACKED arm enters it", and
# each of those builds is a full kernel build plus a boot. PROC_SELFTEST is the
# only one worth its cost (4 promotions, 21 syscalls entered) and it is the one
# that must not be added yet -- its workload still trips [G-9] on ~7% of boots,
# so it would make this gate intermittently red for a reason that is not about
# coverage. IRQ_SELFTEST buys one promotion for a full build and PREEMPT_SELFTEST
# buys exactly one. Promoting them is a follow-up to closing [G-9], and the
# measurements above are what that follow-up should start from.

# Compiled only under a flag, so no tracked workload can enter them and neither
# `covered` nor `uncovered` can describe them. Declaring them here is what keeps
# them countable: the checker requires every guarded entry to appear, with the
# flag that guards it, and fails if one becomes unconditional -- a syscall
# re-entering the shipped surface is a change in attack surface, not a
# documentation detail.
#
# Until 2026-08-23 the deriver read the table as flat TEXT, so all of these
# counted toward `implemented` and described a build nobody has ever booted. The
# note that recorded that blind spot lived next to SYS_OPEN and named the wrong
# three -- 15 and 16 were bare numeric entries the regex never matched at all, so
# the overstatement was SYS_OPEN, SYS_PREEMPT_TRACE and SYS_IRQ_POLICY_INFO. An
# unenforced note is worth exactly that much, which is why this is a rule now.
conditional:
  SYS_OPEN:
    flag: RAMFS_SLOT3_GATE
    reason: >-
      RETIRED 2026-08-22 ([H-3]). In the ship build the syscall fails closed at SYS_ERR_NOSYS; the entry comes back only under the defect arm, which is what makes `make smoke-passwd-probe-control` a measurement
  SYS_RAMFS_CREATE:
    flag: RAMFS_SLOT3_GATE
    reason: >-
      RETIRED 2026-08-22 ([H-3]), syscall 15. One of the four doors gated on cspace slot 3 with SC_ANYTYPE, which the legacy CAP_FRAME satisfies. Named 2026-08-23; it was a bare `[15]` and invisible to this manifest
  SYS_RAMFS_LIST:
    flag: RAMFS_SLOT3_GATE
    reason: >-
      RETIRED 2026-08-22 ([H-3]), syscall 16. As SYS_RAMFS_CREATE -- it enumerated the store the user database was written into. Named 2026-08-23
  SYS_EXEC_LEGACY:
    flag: LEGACY_SYSCALLS_PRESENT
    reason: >-
      RETIRED 2026-08-23. Syscall 14 created a TASK, authorised on cspace slot 3 with SC_ANYTYPE -- the legacy CAP_FRAME every task is born holding, which is [H-3]'s shape on a door that sweep could not see, because the entry was written `[14]` and matched none of the `[SYS_NAME]` patterns. Measured before removal: passwdprobe, uid 1000 with no delegated capability, called it and was handed task id 2. create_task assigns no uid, so the task it made had no identity of its own
  SYS_CLEAR:
    flag: LEGACY_SYSCALLS_PRESENT
    reason: >-
      RETIRED 2026-08-23. Syscall 5 cleared the kernel VGA text buffer, which console_server has owned since it took the framebuffer. No userspace wrapper existed anywhere in the tree
  SYS_SYSINFO:
    flag: LEGACY_SYSCALLS_PRESENT
    reason: >-
      RETIRED 2026-08-23. Syscall 6 returned a version string, with no userspace wrapper anywhere in the tree -- reachable only by issuing the raw number
  SYS_DEBUG_EXEC:
    flag: DEBUG_SHELL || LEGACY_SYSCALLS_PRESENT
    reason: >-
      Syscall 7 hands 127 ring-3 bytes to the in-kernel debug shell with SC_NONE, no capability at all. That is the extra surface a DEBUG_SHELL build is documented to carry, so since 2026-08-23 the ENTRY exists only in such a build; before that it was unconditional and only the handler body was guarded, so the ship kernel dispatched it, copied from the user, and returned -1
  SYS_PREEMPT_TRACE:
    flag: PREEMPT_SELFTEST
    reason: >-
      MEASURED 2026-08-20: entered by a PREEMPT_SELFTEST=1 boot, which enters exactly 1 syscall -- the worst ratio on this list. Test-only trace hook, absent from the ship kernel
  SYS_IRQ_POLICY_INFO:
    flag: IRQ_POLICY_AUDIT
    reason: >-
      MEASURED 2026-08-20: NOT entered even by an IRQ_POLICY_AUDIT=1 boot, which an earlier entry claimed would reach it. Nothing in that image calls it

covered:
  # Entered by captest since 2026-08-24, and the reason is the distinction this
  # whole file rests on: the handler is ENTERED, not satisfied. SYS_GET_LINE's
  # dispatch entry is SC_NONE, so the central gate admits every caller and the
  # authority test lives inside h_get_line -- which means captest's check that a
  # task holding no CAP_CONSOLE is REFUSED still runs the handler body. A
  # syscall can be covered by a test that proves it says no.
  - SYS_GET_LINE
  - SYS_CLOCK_GETTIME      # roadmap 2.2; entered by captest's clock checks
  - SYS_CAP_ENUMERATE      # roadmap 3.6; entered by `capview` in the scripted session
  - SYS_YIELD              # measured 2026-08-23 in all three workloads; was a bare `[0]`
  - SYS_EXIT
  - SYS_SBRK
  - SYS_WRITE
  - SYS_WAIT
  - SYS_GET_TASK_INFO
  - SYS_GETPID
  - SYS_IPC_SEND
  - SYS_IPC_RECV
  - SYS_IPC_CALL
  - SYS_NOTIFY
  - SYS_WAIT_NOTIFY
  - SYS_SPAWN
  - SYS_GETUID
  - SYS_AUTH
  - SYS_SUDO
  - SYS_USERADD
  - SYS_USERDEL
  - SYS_PASSWD
  - SYS_REGISTER_FS_SERVER
  - SYS_CONNECT_FS_SERVER
  - SYS_CAP_REVOKE
  - SYS_FS_INODE_ALLOC
  - SYS_FBLOCK_READ
  - SYS_FBLOCK_WRITE
  - SYS_FS_STAT
  - SYS_FS_SET_SIZE
  - SYS_KILL
  - SYS_CAP_GRANT
  - SYS_SIGNAL
  - SYS_SIGMASK
  - SYS_GET_ARGV
  - SYS_SPAWN_IMAGE
  - SYS_SIGALTSTACK
  - SYS_IPC_SENDER
  - SYS_FS_SET_META
  - SYS_IPC_REPLY_TO
  - SYS_BOOT_MODULE_INFO
  - SYS_BOOT_MODULE_READ
  - SYS_MAP_PHYS
  - SYS_IOPORT_GRANT
  - SYS_CONSOLE_OWNED
  - SYS_PIPE
  - SYS_PIPE_READ
  - SYS_PIPE_WRITE
  - SYS_PIPE_CLOSE
  - SYS_STDIO_INFO
  - SYS_DMESG
  - SYS_TASK_RESUME
  - SYS_RETYPE
  - SYS_UNTYPED_INFO
  - SYS_IPC_RECV_BLOCK

uncovered:
  # ---- The five added on 2026-08-22 (roadmap 2.1) -------------------------
  #
  # Three of these are not new syscalls. SYS_CAP_MINT, SYS_CAP_TRANSFER and
  # SYS_CAP_MOVE have had handlers since the beginning, but their dispatch-table
  # entries were bare numeric literals -- `[4]`, `[8]`, `[9]` -- and this file's
  # checker derives "implemented" from `[SYS_NAME] = { handler`. So all three
  # were invisible to it: handlers nothing classified, nothing measured, and no
  # question this file could fail on. That is the [C-6] shape applied to itself,
  # and it is why the implemented count moved 76 -> 81 in a change that added two
  # syscalls. Naming them in the table is what made them countable.
  SYS_CAP_MINT: >-
    MEASURED 2026-08-22: not entered by any tracked workload. Narrowing a capability's rights before delegating it was unreachable from ring 3 until roadmap 2.1 named this syscall in include/syscall.h, so no program in a tracked image calls it yet; FRAME_SELFTEST does, via frametest's READ-only mint (make smoke-frame)
  SYS_CAP_TRANSFER: >-
    MEASURED 2026-08-22: not entered by any tracked workload, and by no build known in this tree. Delegation between tasks goes through SYS_CAP_GRANT, which is capability-authorised on the target; nothing calls this one
  SYS_CAP_MOVE: >-
    MEASURED 2026-08-22: not entered by any tracked workload, and by no build known in this tree. Same reason as SYS_CAP_TRANSFER
  SYS_MAP_FRAME: >-
    MEASURED 2026-08-22: not entered by the tracked workloads -- no program in a tracked image holds a CAP_UNTYPED to retype a frame from. Entered by FRAME_SELFTEST, which is its gate (make smoke-frame, plus both control arms). Not promoted to `covered` for the same cost reason as the six confirmed above: `covered` means a TRACKED arm enters it, and adding a fourth workload here is a full kernel build plus a boot on every run
  SYS_UNMAP_FRAME: >-
    MEASURED 2026-08-22: not entered by the tracked workloads, for the same reason as SYS_MAP_FRAME. Entered by FRAME_SELFTEST, where framepeer withdraws its own mapping and is then refused the second attempt
  SYS_MAP_REGION: >-
    MEASURED 2026-08-27: not entered by the tracked workloads, for the same reason as SYS_MAP_FRAME -- no program in a tracked image holds a CAP_UNTYPED to retype the run from. Entered by FRAME_SELFTEST, which is its gate (make smoke-frame, plus both control arms: smoke-frame-region-control and smoke-frame-region-wide-control). Not promoted to `covered` for the same cost reason as its neighbours: `covered` means a TRACKED arm enters it
  SYS_READ: >-
    fd 0 refuses under console_hw_owned() for the same reason as SYS_GET_LINE, and neither workload drives an fd>=3 ramfs read
  SYS_EXEC: >-
    MEASURED 2026-08-20: NOT entered by any of PROC_SELFTEST, SIGNAL_SELFTEST, PREEMPT_SELFTEST, IRQ_SELFTEST or IRQ_POLICY_AUDIT. No build in this tree is known to reach it
  SYS_IPC_REPLY: >-
    servers in this tree reply through the reply-capability path, not this call
  SYS_RECEIVE_PROGRAM: >-
    receives a program image over IPC; no tracked workload provisions a program this way
  SYS_GET_PASS: >-
    the same kernel-side console-input path; login reads the password through console_server, not through the kernel
  SYS_ROTATE_KEYS: >-
    rotates the audit-chain keys and needs CAP_AUDIT, which captest does not hold -- it asserts the refusal, which returns before the handler
  SYS_READ_AUDIT: >-
    needs CAP_AUDIT; captest holds none and asserts the REFUSAL, which returns before the handler -- exactly the shape that hid issue #176
  SYS_REGISTER_STORAGE_BACKEND: >-
    fs_server storage wiring; runs during provisioning boots, not these
  SYS_BLOCK_READ: >-
    a raw block read through the storage backend; the tracked workloads reach storage through fs_server's higher-level calls instead
  SYS_BLOCK_WRITE: >-
    a raw block write through the storage backend; the tracked workloads reach storage through fs_server's higher-level calls instead
  SYS_AUDIT_DIGEST: >-
    as SYS_READ_AUDIT, and one of the two wrappers issue #176 was about
  SYS_SIGACTION: >-
    MEASURED 2026-08-20: entered by a PROC_SELFTEST=1 boot -- NOT by SIGNAL_SELFTEST=1, which this entry previously claimed. That build passes while entering only syscalls 0 and 11, so it never drives sigaction at all
  SYS_SIGRETURN: >-
    MEASURED 2026-08-20: NOT entered by a SIGNAL_SELFTEST=1 boot, which this entry previously claimed. That build passes while entering only syscalls 0 and 11
  SYS_FS_INODE_FREE: >-
    fs_server inode teardown; not reached by either workload's file operations
  SYS_BRK: >-
    newlib's allocator uses SYS_SBRK (17), which IS covered; brk is the unused half of the pair
  SYS_EXEC_NAMED: >-
    MEASURED 2026-08-20: entered by a PROC_SELFTEST=1 boot. Not promoted to `covered` because that build is not a tracked arm -- see the note on measured-but-untracked below
  SYS_SPAWN_ARG: >-
    MEASURED 2026-08-20: entered by a PROC_SELFTEST=1 boot. Not a tracked arm
  SYS_EXEC_IMAGE: >-
    MEASURED 2026-08-20: NOT entered by any of the five selftest builds tried. No build in this tree is known to reach it
  SYS_FS_INODE_LINK: >-
    links an inode into a directory; neither workload creates a hard link
  SYS_IRQ_REGISTER: >-
    MEASURED 2026-08-20: entered by an IRQ_SELFTEST=1 boot. Not a tracked arm; that build enters 4 syscalls in total, so it buys one promotion for a full build
  SYS_TASK_EXIT_INFO: >-
    MEASURED 2026-08-20: entered by a PROC_SELFTEST=1 boot. Not a tracked arm
