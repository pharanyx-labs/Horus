[package]
name = "horus_shell"
version = "0.1.0"
edition = "2021"
description = "Security-critical components for the Horus microkernel (no_std staticlib)"

[lib]
# staticlib: linked into the C kernel. rlib: lets the rust/fuzz harness depend on
# the crate as a normal Rust library (the kernel build uses only the staticlib).
crate-type = ["staticlib", "rlib"]
# No doctests: with the rlib crate-type, `cargo test` would otherwise build a
# non-test no_std rlib under the harness's forced panic=unwind, which cannot link.
doctest = false

[features]
# Built by rust/fuzz only: turns the crate into an rlib dependency of a std
# libFuzzer harness. Gates off the #[panic_handler] (std provides one there) so
# the two do not collide. Off for the kernel build and the gating `rust` job.
fuzzing = []

# CONTROL ARM for [I-3] (roadmap 1.6). Restores the pre-2026-08-16 revocation
# closure: a fixed 256-entry worklist of revoked serials, falling back to nulling
# every capability that merely shares the root object when a subtree overflows it.
# That fallback is reachable from ring 3 and destroys unrelated peers' authority.
#
#     cargo test --manifest-path rust/Cargo.toml --release \
#         --features revoke_legacy_bounded
#
# The [I-3] regression tests MUST FAIL under it. Never enable it for a kernel
# build; the Makefile does not pass it and nothing but the falsification does.
revoke_legacy_bounded = []

# CONTROL ARM for the CSPRNG seed gate (S30). Compiles the `!self.seeded` check
# out of `RngState::fill`, restoring the pre-2026-08-23 pool: asked for output
# before `entropy_init()` it emits ChaCha20 keystream under the hardcoded
# startup key, and the caller cannot tell that from randomness.
#
#     cargo test --manifest-path rust/Cargo.toml --release \
#         --features rng_unseeded_legacy
#
# `rng_refuses_before_seeding` MUST FAIL under it. The kernel-side arm is
# `make smoke-rng-seed-control`, which sets RNG_UNSEEDED_LEGACY=1 to pass this
# feature down; no ordinary build passes it.
rng_unseeded_legacy = []

# CONTROL ARM for S114 (make smoke-gpt-volume-control). Skips the GPT entry
# array's CRC32 check in gpt.rs, so an entry edited on the disk without
# resealing the array is believed, and the kernel mounts wherever it now points.
gpt_entries_crc_unchecked = []

# CONTROL ARM for S60, the Rust half of CAP_LOOKUP_TYPE_UNCHECKED=1 (ROADMAP
# 3.5): `rust_cap_lookup_typed` returns whatever the slot holds and checks no
# type. The Makefile sets it with the C define, so one switch disarms the whole
# typed resolver. Never in a shipped build.
cap_lookup_type_unchecked = []

# CONTROL ARM for LIMITATIONS 2.23 (make smoke-captest-hashed-revoke-control).
# Puts back a revocation record kept in a 4096-cell table indexed by a hash of
# the serial and consulted on every lookup, so revoking one capability makes a
# live one whose serial lands in the same cell unusable. `captest` check 16b must
# go red under it. The kernel-side arm sets REVOKE_HASHED_BACKSTOP=1 to pass it.
revoke_hashed_backstop = []

[lints.rust]
# `#[cfg(kani)]` gates the formal-verification harnesses in capability.rs. Kani
# sets this cfg; every other build (kernel, cargo test, clippy -D warnings) does
# not, so declare it as known or the unexpected_cfgs lint would fail the gating
# `rust` job. The harnesses compile to nothing outside `cargo kani`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
