  find: '    if count >= MAX_AUTH_FAILS {'
  replace: '    if count > MAX_AUTH_FAILS {'
- id: gpt-volume-unbounded
  harness: gpt_volume_is_inside_the_device
  file: rust/src/gpt.rs
  defect: a partition is accepted however far past the device it runs
  find: '    if count == 0 || base.checked_add(count)? > device_blocks {'
  replace: '    if count == 0 {'
