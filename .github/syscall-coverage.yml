# Which syscall HANDLER BODIES a tracked workload actually enters.
#
# Not "is the syscall named by a test" and not "does it return success" --
# entered. That distinction is the whole reason this file exists. `captest` is a
# REFUSAL suite by construction: its two checks naming SYS_DMESG and
# SYS_AUDIT_DIGEST both assert SYS_ERR_PERM, and the central capability gate
# returns before the handler runs. Both syscalls were "tested"; neither handler
# had ever executed; and issue #176 -- a pointer truncation in both wrappers,
# 100% reproducible for every static buffer in the system -- was invisible to
# all 100 checks.
#
# The tracked workloads are the three in `make smoke-syscall-coverage`: the full
# ring-3 session (tools/session_test.py), the capability conformance suite, and
# the boot-modules session (tools/modules_session.py), which is the only image
# with real programs in /bin and therefore the only one that can run a pipeline.
# Their union is MEASURED on every run by tools/check_syscall_coverage.py, which
# fails if:
#   - an implemented syscall is in neither list (an unanswered question, the
#     [C-6] failure mode applied to test coverage);
#   - a syscall listed `covered` is NOT entered (a test quietly stopped
#     exercising it);
#   - a syscall listed `uncovered` IS entered (the reason has gone stale and it
#     should be promoted).
#
# This does not demand 76 of 76. It demands that the number be decided rather
# than drifting, and that every gap be written down.
#
# The `uncovered` reasons say why the TRACKED WORKLOADS do not reach each one.
#
# Ten of them used to name another build that supposedly would, as unmeasured
# hypotheses. All ten were measured on 2026-08-20 by booting those builds under
# SYSCALL_COVERAGE=1, and each now records what was OBSERVED rather than what was
# assumed. Six were confirmed; FOUR WERE WRONG -- SIGNAL_SELFTEST does not drive
# sigaction or sigreturn (it passes while entering only syscalls 0 and 11), and
# IRQ_POLICY_AUDIT does not drive SYS_IRQ_POLICY_INFO. Two more, SYS_EXEC and
# SYS_EXEC_IMAGE, are reached by no build known in this tree.
#
# The six confirmed are NOT promoted to `covered`, and the reason is a cost
# judgement rather than a doubt: `covered` means "a TRACKED arm enters it", and
# each of those builds is a full kernel build plus a boot. PROC_SELFTEST is the
# only one worth its cost (4 promotions, 21 syscalls entered) and it is the one
# that must not be added yet -- its workload still trips [G-9] on ~7% of boots,
# so it would make this gate intermittently red for a reason that is not about
# coverage. IRQ_SELFTEST buys one promotion for a full build and PREEMPT_SELFTEST
# buys exactly one. Promoting them is a follow-up to closing [G-9], and the
# measurements above are what that follow-up should start from.

covered:
  - SYS_EXIT
  - SYS_SBRK
  - SYS_WRITE
  - SYS_WAIT
  - SYS_GET_TASK_INFO
  - SYS_GETPID
  - SYS_IPC_SEND
  - SYS_IPC_RECV
  - SYS_IPC_CALL
  - SYS_NOTIFY
  - SYS_WAIT_NOTIFY
  - SYS_SPAWN
  - SYS_GETUID
  - SYS_AUTH
  - SYS_SUDO
  - SYS_USERADD
  - SYS_USERDEL
  - SYS_PASSWD
  - SYS_REGISTER_FS_SERVER
  - SYS_CONNECT_FS_SERVER
  - SYS_CAP_REVOKE
  - SYS_FS_INODE_ALLOC
  - SYS_FBLOCK_READ
  - SYS_FBLOCK_WRITE
  - SYS_FS_STAT
  - SYS_FS_SET_SIZE
  - SYS_KILL
  - SYS_CAP_GRANT
  - SYS_SIGNAL
  - SYS_SIGMASK
  - SYS_GET_ARGV
  - SYS_SPAWN_IMAGE
  - SYS_SIGALTSTACK
  - SYS_IPC_SENDER
  - SYS_FS_SET_META
  - SYS_IPC_REPLY_TO
  - SYS_BOOT_MODULE_INFO
  - SYS_BOOT_MODULE_READ
  - SYS_MAP_PHYS
  - SYS_IOPORT_GRANT
  - SYS_CONSOLE_OWNED
  - SYS_PIPE
  - SYS_PIPE_READ
  - SYS_PIPE_WRITE
  - SYS_PIPE_CLOSE
  - SYS_STDIO_INFO
  - SYS_DMESG
  - SYS_TASK_RESUME
  - SYS_RETYPE
  - SYS_UNTYPED_INFO
  - SYS_IPC_RECV_BLOCK

uncovered:
  SYS_GET_LINE: >-
    kernel-side console input; fails closed once console_server owns the UART, so a live session never reaches it
  SYS_READ: >-
    fd 0 refuses under console_hw_owned() for the same reason as SYS_GET_LINE, and neither workload drives an fd>=3 ramfs read
  SYS_OPEN: >-
    ramfs open; the shell uses the fs_server IPC path instead
  SYS_EXEC: >-
    MEASURED 2026-08-20: NOT entered by any of PROC_SELFTEST, SIGNAL_SELFTEST, PREEMPT_SELFTEST, IRQ_SELFTEST or IRQ_POLICY_AUDIT. No build in this tree is known to reach it
  SYS_IPC_REPLY: >-
    servers in this tree reply through the reply-capability path, not this call
  SYS_RECEIVE_PROGRAM: >-
    receives a program image over IPC; no tracked workload provisions a program this way
  SYS_GET_PASS: >-
    the same kernel-side console-input path; login reads the password through console_server, not through the kernel
  SYS_ROTATE_KEYS: >-
    rotates the audit-chain keys and needs CAP_AUDIT, which captest does not hold -- it asserts the refusal, which returns before the handler
  SYS_READ_AUDIT: >-
    needs CAP_AUDIT; captest holds none and asserts the REFUSAL, which returns before the handler -- exactly the shape that hid issue #176
  SYS_REGISTER_STORAGE_BACKEND: >-
    fs_server storage wiring; runs during provisioning boots, not these
  SYS_BLOCK_READ: >-
    a raw block read through the storage backend; the tracked workloads reach storage through fs_server's higher-level calls instead
  SYS_BLOCK_WRITE: >-
    a raw block write through the storage backend; the tracked workloads reach storage through fs_server's higher-level calls instead
  SYS_AUDIT_DIGEST: >-
    as SYS_READ_AUDIT, and one of the two wrappers issue #176 was about
  SYS_PREEMPT_TRACE: >-
    MEASURED 2026-08-20: entered by a PREEMPT_SELFTEST=1 boot. Not a tracked arm; that build enters exactly 1 syscall, the worst ratio on this list
  SYS_SIGACTION: >-
    MEASURED 2026-08-20: entered by a PROC_SELFTEST=1 boot -- NOT by SIGNAL_SELFTEST=1, which this entry previously claimed. That build passes while entering only syscalls 0 and 11, so it never drives sigaction at all
  SYS_SIGRETURN: >-
    MEASURED 2026-08-20: NOT entered by a SIGNAL_SELFTEST=1 boot, which this entry previously claimed. That build passes while entering only syscalls 0 and 11
  SYS_FS_INODE_FREE: >-
    fs_server inode teardown; not reached by either workload's file operations
  SYS_BRK: >-
    newlib's allocator uses SYS_SBRK (17), which IS covered; brk is the unused half of the pair
  SYS_EXEC_NAMED: >-
    MEASURED 2026-08-20: entered by a PROC_SELFTEST=1 boot. Not promoted to `covered` because that build is not a tracked arm -- see the note on measured-but-untracked below
  SYS_SPAWN_ARG: >-
    MEASURED 2026-08-20: entered by a PROC_SELFTEST=1 boot. Not a tracked arm
  SYS_EXEC_IMAGE: >-
    MEASURED 2026-08-20: NOT entered by any of the five selftest builds tried. No build in this tree is known to reach it
  SYS_FS_INODE_LINK: >-
    links an inode into a directory; neither workload creates a hard link
  SYS_IRQ_REGISTER: >-
    MEASURED 2026-08-20: entered by an IRQ_SELFTEST=1 boot. Not a tracked arm; that build enters 4 syscalls in total, so it buys one promotion for a full build
  SYS_IRQ_POLICY_INFO: >-
    MEASURED 2026-08-20: NOT entered by an IRQ_POLICY_AUDIT=1 boot, which this entry previously claimed would reach it. Nothing in that image calls it
  SYS_TASK_EXIT_INFO: >-
    MEASURED 2026-08-20: entered by a PROC_SELFTEST=1 boot. Not a tracked arm
