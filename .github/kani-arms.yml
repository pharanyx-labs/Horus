- id: revoke-tally-unbounded
  harness: revoke_counts_exactly_the_pipe_ends_it_removes
  file: rust/src/capability.rs
  defect: an end naming a pipe past the tally's length is counted past its end
  find: |2-
            if index >= pipes {
                return;
