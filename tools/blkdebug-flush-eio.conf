# blkdebug: fail every FLUSH CACHE the guest issues, with EIO.
#
# This is the witness for [I-10]. Under every ordinary QEMU cache mode the
# emulator persists guest writes on its own, so a kernel that issues no FLUSH
# CACHE at all is indistinguishable from one that flushes correctly — which is
# how the missing flush survived in a tree that had a required crash-recovery
# gate. Making the flush FAIL inverts that: the command's presence becomes
# observable through the kernel's own reaction to the error.
#
# A kernel with the durability barriers must issue the flush, see EIO, and abort
# the transaction with a message on serial. The WAL_NO_FLUSH=1 control arm never
# issues the command, so nothing here ever fires and the message never appears —
# which is exactly what makes `make smoke-fs-wal-flush` falsifiable.
#
# No `once` and no `sector`: every flush fails, for as long as the guest runs.
# The gate asserts the first refusal, and leaving it armed means a kernel that
# retried the commit without re-flushing could not slip through on a later
# attempt.
[inject-error]
event = "flush_to_disk"
errno = "5"
