# /etc/shell.conf - settings for the Horus shell.         See shell.conf(5).
#
# Read by the shell after every successful login. Change a line, then log out
# and in again to see it. Delete a line, or this whole file, and the shell's
# compiled default comes back.
#
# FORMAT. One setting per line, written `key = value`. A '#' starts a comment,
# to the end of the line, and blank lines are ignored. At most 4096 bytes, and
# 128 characters a line.
#
# WHAT THIS FILE CANNOT DO. Nothing here touches what any program may do:
# authority comes from capabilities, and a file is not one (capabilities(7)).
# These are presentation settings, each checked before it is used. A line
# that does not parse, an unknown key, or a value out of range is IGNORED,
# with one message naming the line, and the default stands. A broken file
# never stops you logging in.
#
# This file is root's (mode 0644): any login can read it, only the
# administrator can change it. Horus wrote it once, on the first boot that
# found no /etc/shell.conf, and will never overwrite it.

# hostname - the machine's name in the prompt, as in root@horus#
#   Default: horus
#   Allowed: 1 to 32 characters from a-z, 0-9 and '-', not starting with '-'.
#   Capital letters, spaces and every other byte are refused, because the
#   prompt is drawn on the console before everything you type, and a name
#   carrying control bytes could draw over it.
hostname = horus

# motd - show the message of the day after each login
#   Default: yes
#   Allowed: yes, no
#   The message is the file /etc/motd, if there is one (Horus ships none).
#   It is printed as plain text: any byte that is not printable ASCII, a tab
#   or a newline is shown as '?', so the file cannot drive the console.
motd = yes
