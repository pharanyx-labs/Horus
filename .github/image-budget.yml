# The kernel image's static footprint, and the line it must stay below.
#
# WHY THIS FILE EXISTS (audit F2, 2026-09-19). linker64.ld asserts that the image
# ends below USER_PHYS_BASE (16 MiB), because the physical page pool starts there.
# That assert fails LOUDLY, but only when the line is crossed, and everything
# before that is silent: each routine bump to MAX_TASKS, BLOCKS_PER_DISK or the
# argon2 cost spends headroom that nothing reports. And the headroom is not idle:
# GRUB stages the boot modules in it, upward from the end of the image.
#
# So growth has to be a decision somebody writes down, the same rule
# .github/ring0-classification.yml applies to ring-0 code.
#
# THE BUDGET IS ON .bss, NOT ON THE END OF THE IMAGE, and that is measured rather
# than preferred. The same tree built on 2026-09-19 ended the image at 0x8B4000
# on CI (Ubuntu) and at 0x8B7000 on Void (GCC 14.2, binutils 2.44): .text and
# .rodata differ by 12 KiB between the two compilers. .bss was 0x6E3000 bytes on
# both, because it is static arrays sized by constants. An exact budget on the
# end of the image would have been red on the maintainer's machine and green on
# CI, which is the hazard that cost #400. .bss is also where every term F2 names
# lives: argon2_scratch is 4096 KiB of it, and the rest is tables sized by
# MAX_TASKS and friends.
#
# EXACT, IN BOTH DIRECTIONS. tools/check_image_budget.py fails when .bss is larger
# than this AND when it is smaller. Larger: raise it here and say why in the
# commit. Smaller: lower it, so the room is banked in the number rather than left
# as slack that the next growth absorbs without anybody deciding.
#
# The code, text and read-only data are not budgeted here. Code growth is what
# the ring-0 budget counts, and a byte budget on it would move with the compiler.
#
# History:
# 2026-09-19: 7,221,248 bytes (0x6E3000, 7,052 KiB), the measured value at
#   06dbf07. argon2_scratch 4,096 KiB, referenced.2 and free_page_stack 512 KiB
#   each, endpoints 335 KiB, ap_idle_stacks 272 KiB, page_refcounts 256 KiB.
# 2026-09-21: 7,630,848 bytes (0x747000, +400 KiB), MAX_CPUS 4 -> 8. Every
#   supported CPU is reserved whether present or not: ap_idle_stacks 272 -> 544
#   KiB (a guard page and 64 KiB of stack each), ap_ist 84 -> 192 KiB (three
#   IST fault stacks per AP), ap_tss 28 -> 65 KiB (a TSS with its 8 KiB I/O
#   bitmap per AP), plus apic_to_cpu[256], cpu_to_apic[8] and the MADT id buffer
#   (520 bytes). See docs/LIMITATIONS.md 3.3 for why the ceiling is eight.
# 2026-09-22: 7,647,232 bytes (+16,384), for S102 (HORUS-20260919-01):
#   page_on_loan in src/kernel/paging.c, one bit for each of USER_PHYS_PAGES
#   frames, so free_user_physical_page can refuse a frame that is not out on
#   loan. Chosen over a sentinel value in page_refcounts, which costs no bytes
#   but overloads a table the Kani proofs in rust/src/memory.rs reason about.
#   The 4-byte refusal counter beside it fitted in existing padding.
# 2026-09-22: 7,659,520 bytes (+12,288), IODEV_MAX 16 -> 64. iodev_table grows
#   3,712 -> 14,848 bytes (232 per entry) and iommu.c's domains[] 256 -> 1,024
#   (16 per entry), 11,904 bytes that the section's page rounding makes 12 KiB.
#   A Gemini Lake laptop has twenty-odd PCI functions on bus 0 and a 16-entry
#   table dropped its eMMC controller, the only disk it has, in silence.
# 2026-09-25: 7,712,768 bytes (+53,248), for S105, capability tokens
#   (docs/design/filesystem.md §5.1). endpoints 343,040 -> 394,240 (+51,200):
#   each of the 320 static endpoints gains a 32-byte invoker record on every one
#   of its 4 queue slots and one `last_invoker`, 160 bytes each, because the
#   token and rights a server authorises on have to travel with the message they
#   describe. root_cnode 8,192 -> 10,240 (+2,048), 256 slots of 32 -> 40 bytes.
#   Measured with nm against the build without the change.
# 2026-10-08: 7,733,248 bytes (+20,480), for S114: the GPT scan buffer in
#   src/kernel/storage.c (storage_volume_on), five 4 KiB blocks, which is the
#   least that holds a standard table (128 entries from LBA 2 end at byte
#   17,408). Static because the kernel has no allocator and 20 KiB is too much
#   for a kernel stack frame; it is read once per boot per disk.
# 2026-10-08: 6,950,912 bytes (-782,336), the 4 GiB pool: the page pool's three
#   per-frame tables (free_page_stack 512 KiB, page_refcounts 256 KiB,
#   page_on_loan 16 KiB, sized for a 512 MiB pool) left .bss for the top of RAM,
#   sized at boot for the pool's span up to 4 GiB; three page directories for
#   the PHYS_KVA window over [1, 4) GiB (12 KiB) came in, because they must exist
#   before the allocator whose tables they map.
# 2026-10-11: 6,934,528 bytes (-16,384), the hashed generation table
#   (LINEAGE_GEN, 4096 four-byte cells) removed with LIMITATIONS 2.23.
# 2026-10-12: 6,946,816 bytes (+12,288), for LIMITATIONS 1.32: every queued
#   message records its sender's slot_gen, and each endpoint the generation of
#   the sender it last dequeued, so a reply or SYS_IPC_SENDER cannot name a task
#   that reused a dead client's slot. endpoints 394,240 -> 409,600 (+15,360):
#   320 static endpoints, 4 queue slots of +8 and a last_sender_gen of +8 with
#   its padding, 48 bytes each; the section's page rounding makes it 12 KiB.
#   Measured with nm against the build without the change. 48 bits of
#   generation, as CAP_TCB has, rather than 32 that a busy slot could wrap.
# 2026-10-16: 6,971,392 bytes (+24,576), for roadmap 2.1: the frame table is
#   sized from the arena, MAX_DYN_FRAMES = UNTYPED_ARENA_PAGES = 1664 instead of
#   256, so no frame is refused while the arena could hold it. dyn_frames 4,096 ->
#   26,624 (16 bytes a slot) and gc_fr_marks 256 -> 1,664, +23,936, which the
#   section's page rounding makes 24 KiB. Measured with nm against the build
#   without the change.
# 2026-10-17: 6,979,584 bytes (+8,192), for ROADMAP 1.8 step 4a, scheduling
#   contexts: dyn_scs 4,096 (the index table of carved contexts, 16 bytes a
#   slot, MAX_TASKS of them), sc_roots 448 (one root per CPU), gc_sc_marks 256,
#   and the per-CPU accounting stamps sc_stamp_us 64, sc_stamp_idx 32 and
#   sc_cpu_up 8, +4,904, which the section's page rounding makes 8 KiB. The
#   contexts themselves are untyped memory. Measured with nm.
# 2026-10-20: 6,983,680 bytes (+4,096), for LIMITATIONS 1.33 (S3): a death gives
#   its capabilities' children their grandparents. g_reparent_scratch, 4,096
#   (the dying cspace's serial and parent, 2 x 8 bytes for each of CNODE_SIZE
#   256 slots), held under cap_lock and shared by every death. Not on the stack,
#   where teardown already runs deep on a 32 KiB kernel stack, and not dropped
#   for an unsorted search, which would make every death a pass over every
#   capability per dying slot. Measured with check_image_budget.
bss_bytes: 6983680
