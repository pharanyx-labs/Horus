# Which CI jobs gate a merge, which do not, and why.
#
# EVERY job in ci.yml must appear in exactly one of the two lists below.
# `tools/check_ci_gating.py` fails the build if any job is in neither, or in
# both, so adding a job to ci.yml forces the gating question at review time
# instead of silently answering it. There is no default: an exemption is a
# decision, and it gets written down.
#
# This inverts the maintenance burden that produced finding [C-6]. The live
# required list lives in branch ruleset 21815299, which no commit touches, so
# every job added to ci.yml landed in the advisory set BY DEFAULT and nothing
# asked whether it should have. That is how the ratio drifted from 21-of-30 to
# 22-of-66 without a decision ever being taken — twice costing a security gate:
# `smoke-captest`, the named witness for eight of SECURITY.md's S-properties,
# sat advisory until 2026-08-15, and the two [I-10] durability gates landed
# advisory on 2026-08-16 in the very commit that fixed the defect they witness.
#
# An entry naming a job that no longer exists is also an error, so this file
# cannot rot into a list of things that are not there.
#
# After changing this file, sync the ruleset — CI cannot do it, because reading
# a ruleset needs Administration permissions the workflow GITHUB_TOKEN does not
# have and cannot be granted:
#
#     tools/check_ci_gating.py --sync-ruleset       # write it
#     tools/check_ci_gating.py --check-ruleset      # verify it took
#
# NEVER REQUIRE A CONTEXT THE BASE BRANCH CANNOT PRODUCE. A required context whose
# job does not exist on `main` never reports, so every pull request is blocked on
# it indefinitely — and it presents as an ordinary red check rather than as a
# misconfiguration. Promotion therefore LAGS the job landing by one merge: add the
# job here in the PR that introduces it, and re-run --sync-ruleset only after that
# PR has merged. Syncing from a feature branch froze the repository on 2026-08-16;
# `tools/prune_unsatisfiable_checks.py` recovers from that and encodes the rule.
#
# DEMOTION IS THE MIRROR IMAGE, AND MUST LEAD THE MERGE. Moving a job from
# `required` to `advisory` here changes nothing in the ruleset, so the context is
# still required and a failing one blocks the very pull request that demotes it.
# That deadlocked #167 on 2026-08-17: the job it was demoting was red, which was
# the whole reason for the demotion. Run --sync-ruleset BEFORE merging a demotion.
# It is the safe direction — removing a requirement cannot freeze anything, where
# adding one can — and it leaves `main` disagreeing with the ruleset for exactly
# one merge, the same one-merge window promotion leaves in the other direction.
#
#   promote:  merge first, then --sync-ruleset   (adding a requirement)
#   demote:   --sync-ruleset first, then merge   (removing one)
#
# So the checked-in classification is the decision record, CI enforces that it
# is COMPLETE, and reconciling the ruleset to it stays a visible manual step.

# Merge-gating. Any of these can block a pull request.
required:
  # codeql.yml. The static-analysis gate; roadmap 4.2 named it as still to
  # promote, and this mechanism caught it sitting unclassified on first run.
  - analyze

  # ci.yml
  - altconfigs
  - ci-gating
  # Gating rather than advisory on purpose. It checks the documentation against
  # the tree, and documentation that lies is how [G-2] survived nineteen days
  # after three files said the property was retired. An advisory doc check is a
  # doc check nobody reads, which is the state this job exists to leave.
  - doc-claims
  - kernel
  - reproducible
  - rust
  - security
  - smoke
  - smoke-aslr
  - smoke-aspace
  - smoke-captest
  - smoke-console
  - smoke-console-isolation
  - smoke-console-smp
  - smoke-coreutils-shell
  - smoke-cow
  - smoke-cpu
  - smoke-e820
  - smoke-elf
  - smoke-elf64
  - smoke-flush
  - smoke-fs
  - smoke-fs-conc
  - smoke-fs-large
  - smoke-fs-perms
  - smoke-fs-persist
  - smoke-fs-wal
  - smoke-fs-wal-flush
  - smoke-fs-wal-order
  - smoke-heap64
  - smoke-init-fs
  - smoke-cr3-reclaim
  - smoke-exec-reenter
  - smoke-spawn-owner
  - smoke-klog-forge
  - syscall-abi
  - gate-pairs
  # Gating for the reason doc-claims is. The table it checks is the only
  # index of the control arms, and an arm nobody can find is one nobody
  # re-runs -- so a silent omission there quietly retires a falsification.
  - defect-flags-documented
  # Gating. Every freestanding userspace program links libhorus, so this is
  # the one gate that covers all four servers' shared runtime at once -- and
  # it carries the only executable witness for the IPC refusal contract.
  - libhorus
  # Gating. It carries S26 and S27, and the arm that matters is not the feature
  # but the trap: CAP_FRAME existed as a decoy in slot 3 of every task long
  # before it meant anything, and it is the same capability that made [C-1]
  # reachable. This is the check that it maps nothing.
  - frame
  # Gating. It carries S43: hardware authority names a device. CAP_IO_DEVICE was
  # a type with no object — one primordial capability whose `object` was 0 and
  # never read, against three syscalls that resolved the console from compiled-in
  # constants — so it is [C-1]'s shape one layer down, and it is required for the
  # same reason [C-1]'s witness is: the defect stood because no negative
  # conformance test asked the question. Roadmap 2.6 and 2.7 both sit on it, and
  # a second ring-3 driver cannot exist until it holds.
  - devcap
  # Gating. It carries S44 and roadmap 2.6's first half: a network driver in ring
  # 3 whose whole authority is one device capability and one untyped region,
  # proved by a real ARP exchange rather than by a register read. It is also the
  # first caller of SYS_DEVICE_ENABLE and SYS_DMA_ADDR, which is why they landed
  # with it -- a DMA mechanism with no driver is authority added for nobody.
  - net
  # Gating. It carries S49 and roadmap 2.5's mechanism: one library, many
  # executors, no writer. The property is not the memory saving -- it is that the
  # saving does not come at the price of a code-injection primitive between every
  # task that shares the library, which is what sharing it writably would be.
  - shlib
  # Gating. Roadmap 2.5's remainder: newlib, its port glue and libhorus linked
  # into one shared object the kernel's loader can accept. Programs do not link
  # against it yet, so what this gates is that the OBJECT stays loadable -- and
  # it gates rather than advises because all three ways of breaking it are
  # SILENT. Dropping a glue object leaves undefined symbols and JUMP_SLOTs;
  # dropping -Bsymbolic turns intra-library references into GLOB_DAT; and a
  # single weak-undefined symbol emits a GLOB_DAT on its own. None is a link
  # error, and the kernel's refusal to load names nothing -- the library is
  # simply absent and the first symptom is a fault on a call into nothing.
  - shared-objects
  # Gating. It carries S39 and S40. The memory half is the one a fork gets wrong
  # by accident -- "share the page tables" reads like "copy the memory" and is
  # one process with two contexts -- and the object half is the caller
  # cow_break_pte's arena guard was written for before it existed: fork is what
  # makes a frame's page reachable as a COW PTE at all.
  - fork
  # Gating. It carries S42, and it is the pairing rather than either half: fork
  # and exec were each gated, and the SEQUENCE -- the only one a shell performs --
  # was not. The property is written as the ABSENCE of a step (exec touches no
  # capability), which is the hardest kind to hold: nothing can be pointed at, so
  # nothing goes stale visibly. It also carries the one memory claim smoke-fork
  # cannot reach, because task_teardown does not free an address space and an
  # exec does: this is the only path in the tree that reclaims a copy-on-write
  # clone while its parent is still running.
  - forkexec
  # Gating. It carries S16 — which had NO witness at all until 2026-08-28, the
  # exact [C-1] shape this project exists to avoid: a property stated in
  # SECURITY.md, enforced by real code, and bound to nothing. Roadmap 4.12's
  # invariant registry is what stops that recurring; this is the first thing it
  # would have caught.
  - fpu
  # Gating. Roadmap 4.12 / [F-4.1]: it asks the question nobody had asked
  # mechanically — which security properties have no witness at all. S16 had
  # none for the life of the project, against real enforcing code, and no
  # ambient-authority sweep found it because every sweep looked for gates that
  # were ABSENT or VACUOUS rather than for claims that were UNBOUND. Its own six
  # rules are falsified one arm each in the same job.
  - invariants
  # Gating, and for invariants' reason one layer down. CLAUDE.md section 7 has
  # always required a `# Safety` clause on every `unsafe`, and nothing enforced
  # it: 29 of 49 production sites had none, worst in the two modules the kernel
  # trusts most. These are all called from C, and C cannot uphold an obligation
  # nobody wrote down -- rust_cap_revoke_global needs EVERY cspace in its array
  # or a revoke misses a derived copy, and neither that nor rust_page_ref_inc's
  # lock requirement is visible from the signature. The check proves only that an
  # obligation is written, never that it is true; Miri and Kani test the code
  # beneath it, and its own three arms are falsified in the same job.
  # Gating. main went red on 2026-08-30 because packages.microsoft.com answered
  # 403 and `apt-get update` exits non-zero when any configured repository fails,
  # including vendor lists this project has never used. 87 of 101 jobs ran a bare
  # apt-get, so the run reddened at 1-(1-p)^87 rather than p. The retry that would
  # have absorbed it existed in ONE job, added when "the apt step has flaked twice
  # in one day", and was never carried to the other 86. This gate is what stops an
  # eighty-eighth job reintroducing the fragility by copying an older one.
  - apt-hardening
  - unsafe-safety
  # Gating. It carries S28: a gate satisfied by a capability every task already
  # holds is not a gate. [H-3] was four of them, on the path to the user
  # database, and they survived two prior ambient-authority sweeps because both
  # looked for gates that were ABSENT rather than vacuous.
  - passwd-probe
  # Gating. It carries S29 -- reaching a mounted subtree takes the capability
  # for that mount, not the path -- and the routing half, where the failure mode
  # is the WRONG SERVER ANSWERING rather than an error.
  - vfs
  # Gating. It carries S30. The property it guards was true only by boot
  # ordering for four months -- entropy_init happens to run before the first
  # consumer -- and an ordering fact is exactly what a refactor moves. This is
  # the check that asks the RNG itself.
  - rng-seed
  # Gating. S11/S12 are claims about a measurement, and until 2026-08-23 a boot
  # that took no measurement said so in a log line and carried on. This job
  # checks the opt-in policy that makes it fatal -- including that a machine
  # WITH a TPM still boots under it, which is the half a refusal-only gate
  # cannot distinguish from a kernel that halts always.
  - measured-boot-required
  # Gating, and the first Kani job that can fail anything. The `kani` job below
  # stays advisory and manual: it is workflow_dispatch-only AND carries
  # continue-on-error on both steps, so for as long as it has existed none of
  # the capability-algebra proofs could have reddened a build. This one runs the
  # subset that finishes -- eleven harnesses, about three minutes of solver --
  # with no continue-on-error, and refuses a proof that is in neither list.
  - kani-bounded
  # Gating. The only check in this tree that looks for undefined behaviour, and
  # the unsafe it exists for is the C FFI boundary in the security core -- 80
  # unsafe blocks, every one of them where the kernel hands in a pointer. Its
  # first run found UB in three places (all of them in the tests, which had been
  # modelling their own caller wrongly), which is the argument for running it on
  # every PR rather than by hand.
  - miri
  # Gating. It guards the class that produced [G-9]: a claim orphaned because a
  # path reached ring 3 without paying its deferred release. The periodic audit
  # structurally cannot catch that, so this is the only check that can.
  - claim-release
  # Gating. It witnesses the [G-9] root cause found 2026-08-21: a switch committed
  # before its resume value was validated, so a refusal parked the CPU and left
  # the task it had claimed unschedulable forever.
  - switch-commit
  # Gating. It witnesses the last component of [G-9]: the claim auditor's own
  # exemption was dropped before the release it exempts, so the checker accused a
  # release that was in flight. The natural event is ~4.5% with variance too wide
  # to gate on; the widened pair is deterministic.
  - defer-exemption
  # PROMOTED 2026-08-22, one merge after [G-9] closed -- which is the shape its own
  # exemption asked for: "Promote it in the same commit that closes [G-9], and
  # quote a rate." The rate: the PROC_SELFTEST -smp 4 workload it boots ran 0
  # failures in 200 boots after the fix (95% upper bound 1.49%), against ~45% before
  # [G-9]'s exec and page-table components and ~7% after them. The gate itself passed
  # 5 of 5 in its exact form -- weak alone at a 7% rate (~70% power), which is why the
  # 200-boot figure is the evidence and this is the corroboration.
  #
  # It could not be promoted in the closing commit itself: a required context must
  # exist on `main` before the ruleset can name it, so promotion lags a merge by one
  # ([C-6]). This is that merge.
  - smoke-kstack-park
  - syscall-coverage
  - ksp-guard
  - defect-flags
  - smoke-ioport
  - smoke-irq
  - smoke-irq-policy
  - smoke-kfault
  - smoke-kstack-race
  - smoke-mapphys
  - smoke-modules
  - smoke-modules-tamper
  - smoke-newlib
  - smoke-newlib-tamper
  - smoke-notify
  - smoke-nzcow
  - smoke-percpu
  - smoke-pipe
  - smoke-preempt
  - smoke-proc
  - smoke-recvblock
  - smoke-recvblock-smp
  - smoke-resume-guard
  - smoke-sched-invariants
  - smoke-session
  - smoke-session-smp
  - smoke-session-smp-soak
  - smoke-signal
  - smoke-smp
  - smoke-smt
  - smoke-stackguard
  - smoke-tcc
  - smoke-term
  - smoke-tpm
  - smoke-tpm-seal
  - smoke-tpm-seal-roundtrip
  - smoke-tpm-tamper
  - smoke-tsd
  - smoke-wx
  - smoke-wx-smp

# Exempt, each with the reason it cannot or should not gate a merge.
advisory:
  fuzz: >-
    Advisory by design. cargo-fuzz runs each target for a fixed 30-second
    budget, so a green result means "no crash found in 30 seconds", not "no
    crash exists". Time-boxed search is evidence of effort, not of absence, and
    gating on it would convert a scheduling hiccup into a merge block while
    adding no assurance. A crash it does find is a finding to triage, not a
    check to re-run.

  ruleset-audit: >-
    Schedule-only (daily cron plus workflow_dispatch), so it never runs on a
    pull request and has no conclusion to gate one with. It is listed here
    rather than excluded from the checker so that deleting it trips ci-gating:
    it is the job that verifies this file against the live ruleset, which is
    the last open half of [C-6], and a control that can be removed silently is
    the defect that finding describes. It fails loudly if its GitHub App
    credential is unconfigured rather than skipping.

  kani: >-
    Manual-only and skipped on ordinary runs (see its `if:` guard), so it has no
    conclusion to gate on. The proofs it runs are real assurance but too slow
    for every push; they are exercised deliberately rather than continuously.
