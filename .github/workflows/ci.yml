  smoke-resume-guard:
    name: The resume-%rsp floor guard fires and is heard (and both control arms are not)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Return a bogus resume rsp on purpose and require the guard's PANIC line on serial
        run: make smoke-resume-guard SMOKE_TIMEOUT=180
      # The state another CPU's FATAL exception leaves behind. This is the arm
      # that would have caught G-8's mute guard: before the fix, the report was
      # bracketed fatal=1, lost the permanent claim, and halted without printing.
      - name: Hold the permanent panic claim first and require the report ANYWAY
        run: make smoke-resume-guard-preclaim SMOKE_TIMEOUT=180
      # Both control arms, in the same job. Without them a green run above is
      # consistent with the gate measuring the existence of the injection rather
      # than whether the guard reported it.
      - name: Restore the pre-fix fatal bracket and require the report to be INAUDIBLE
        run: make smoke-resume-guard-legacy SMOKE_TIMEOUT=180
      - name: Compile the guard out and require the report to be INAUDIBLE
        run: make smoke-resume-guard-nofloor SMOKE_TIMEOUT=180
      # The guard's OTHER half. Everything above injects 4, which is below the
      # floor; -7 is 0xFFFFFFFFFFFFFFF9 and sits ABOVE it, so a floor-only test
      # missed the whole negative class. A real boot produced exactly -7.
      - name: Return a NEGATIVE bogus resume rsp and require the guard's PANIC line
        run: make smoke-resume-guard-negative SMOKE_TIMEOUT=180
      - name: Restore the floor-only predicate and require the report to be INAUDIBLE
        run: make smoke-resume-guard-negative-control SMOKE_TIMEOUT=180
      # FALSE POSITIVES. Every arm above injects a bogus value and asks whether
      # the report APPEARS, so a predicate that rejected the entire address space
      # would pass all of them -- and one that rejected the IST stacks did. The
      # ceiling shipped bounded to .bss on the premise that every kernel stack is
      # a .bss array; the IST stacks are in .data, IST1 takes #PF, and the guard
      # halts on rejection, so the kernel died on the first ring-3 page fault of
      # any workload. Ten gates went red and this job stayed green.
      - name: Require the guard to stay SILENT on a legal IST resume rsp
        run: make smoke-resume-guard-ist SMOKE_TIMEOUT=180
      - name: Restore the bss-only bound and require the FALSE rejection to appear
        run: make smoke-resume-guard-ist-control SMOKE_TIMEOUT=180

  smoke-kstack-race:
    name: A task's kernel stack is executed by at most one CPU (S20; and the control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds and two widened sessions. The widening slows every task
    # switch on purpose, so the fixed arm runs a full ~5-minute session here and
    # longer on a runner; the control arm halts as soon as it reproduces and is
    # quick. Budgeted well above measured so a slow runner is not a red gate --
    # a required check that reddens for timing teaches the re-run reflex.
    #
    # Raised to 90 with the three task-ceiling steps below: each is a clean
    # build plus a boot, and the boots are short (the witness runs at
    # scheduler_init and the two arms halt on their marker), so the added cost is
    # three builds rather than three sessions.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The window between handing a task to another CPU and leaving that task's
      # kernel stack -- finding G-8. Widened with a spin so the race is entered on
      # essentially every switch instead of at ~2-3% per boot, which is what made
      # this cost two 150-boot arms to observe once.
      - name: Widen the window and require the session to complete anyway
        run: make smoke-kstack-race
      # The load-bearing arm. Without it, the step above is consistent with
      # "a kernel with a spin in it still boots". With it, the SAME widened window
      # is fatal at the pre-fix release site and harmless at the shipped one.
      - name: Restore the pre-fix release site and require the race to REPRODUCE
        run: make smoke-kstack-race-control
      # S20 AT THE NEW WIDTH. MAX_TASKS went 64 -> 256 on 2026-08-30, and both
      # things this job rests on were sized for 64: the per-task kernel stacks
      # (a static .bss array, one slot per task) and g_kstack_inflight (ONE
      # uint64_t, bit t per task, whose `1ULL << t` silently aliases task 255
      # onto task 191 above the old bound). A boot uses about six tasks, all
      # below 64, so neither defect is reachable by anything else in this job --
      # which is why the ceiling needs a witness of its own rather than trusting
      # the sessions above.
      #
      # THREE STEPS IN THIS JOB RATHER THAN A JOB OF THEIR OWN: a new job is a
      # new required context, and the ruleset that decides required contexts is
      # synced by hand after the merge ([C-6]), so a new gating job would leave
      # the ruleset one context behind until someone ran --sync-ruleset.
      - name: An alias pair (t, t-64) has distinct stacks, cspaces and inflight bits
        run: make smoke-task-ceiling
      - name: Restore the single-word mask and require the witness to ALIAS
        run: make smoke-task-ceiling-control
      - name: Truncate the stack slot index and require the pair to SHARE a stack
        run: make smoke-task-ceiling-stack-control

  smoke-cr3-reclaim:
    name: A slot's page tables are not recycled while a CPU is on them (G-10; control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds plus CR3_RECLAIM_RUNS boots and 3 control boots. The
    # control arm halts as soon as it reproduces, which is every boot.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # create_user_pagedir freed the previous occupant's address space on a
      # uniprocessor argument. A CPU parked in kernel_idle never reloads CR3, and
      # SYS_KILL marks a task dead while it still runs in ring 3 elsewhere, so the
      # frames were recycled under a live core. Finding G-10.
      - name: Require no recycled page table to fault
        run: make smoke-cr3-reclaim
      # The load-bearing arm. Without it the step above is consistent with "this
      # runner never reused a slot".
      - name: Remove the guard and require the free-in-use to REPRODUCE
        run: make smoke-cr3-reclaim-control

  smoke-exec-reenter:
    name: An exec re-entry is consumed by the CPU that armed it (G-9; control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds and 2 x EXEC_REENTER_RUNS boots. Passing boots exit on
    # their marker in ~25s; the control arm halts as soon as it reproduces. The
    # cost driver is the rest of [G-9], which stalls 2 boots in 30 to the 180s budget, so
    # this is sized well above measured rather than tightly.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # g_exec_reenter_task was ONE global consumed on the exit of every syscall
      # on every CPU. An exec armed on one core was taken by another, which
      # claimed the exec'ing task and resumed the frame the exec tail had just
      # built -- while the core that ran the exec was still on it. Finding G-9.
      - name: Require no CPU to take another CPU's exec re-entry
        run: make smoke-exec-reenter
      # The load-bearing arm. Without it, the step above is consistent with
      # "the workload did not happen to exec concurrently on this runner".
      - name: Restore the shared hand-off and require the theft to REPRODUCE
        run: make smoke-exec-reenter-control

  smoke-spawn-owner:
    name: A staged image is spawnable only by the task that armed it (G-11; control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds and two single boots. Both arms are deterministic and
    # exit on their marker in ~25s, so this is the cheapest security gate in the
    # file; the budget is for the builds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The staged image was ambient state: nothing recorded which task armed
      # it, and SYS_SUDO spawns whatever is armed AS UID 0 in a different
      # syscall from the arm -- so a correct password could elevate another
      # task's program. Finding G-11, property S21. The self-test forges a
      # foreign owner, requires the refusal, then re-arms honestly and requires
      # the spawn to succeed: a check that refuses everything is not a check.
      - name: Require a foreign staged image to be refused (and your own accepted)
        run: make smoke-spawn-owner
      # The load-bearing arm. Without it, the step above is consistent with a
      # kernel that never reached the check at all.
      - name: Remove the owner check and require the foreign image to be SPAWNED
        run: make smoke-spawn-owner-control

  defect-flags:
    name: "Every boot states which defect flags built it (and a flag change forces a rebuild)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # A clean kernel must say so POSITIVELY. An absent line is ambiguous
      # between "clean", "the reporting was removed" and "the boot died early".
      - name: A clean build reports no defect flags
        run: make smoke-defect-flags
      # Without this, the gate above is satisfied by a kernel that prints "none"
      # unconditionally.
      - name: An injected build names the flag it carries
        run: make smoke-defect-flags-control
      # THE FOOTGUN: build with an injection, rebuild WITHOUT clean and without
      # the flag. On 2026-08-20 that sequence produced a kernel still carrying
      # KSP_GUARD_INJECT and a false [G-9] "reproduction" at 2 boots in 3.
      - name: A flagless rebuild after an injected one comes out clean
        run: make smoke-defect-flags-rebuild
      # And the arm that proves the stamp is what does it.
      - name: Drop the stamp dependency and require the stale flag to SURVIVE
        run: make smoke-defect-flags-rebuild-control

  ksp-guard:
    name: "A bogus resume %rsp is refused where it is produced (G-9)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # All four switch functions end in the same three lines and every selection
      # loop only required saved_ksp to be NON-ZERO -- and -7 is non-zero. The
      # guard refuses an implausible value and NAMES the producer, so the next
      # reproduction of G-9's residue is a fact rather than a mystery. This is the
      # arm that proves the guard can fire at all.
      # The FALSE-POSITIVE direction, and the one whose absence is a known way to
      # ship a regression: on an ordinary boot every resume value is legal and
      # the guard must stay SILENT. Without this, a predicate that rejected every
      # stack pointer would satisfy the injection arm below perfectly -- which is
      # exactly how the resume-%rsp guard once shipped a bound that rejected the
      # IST stacks and reddened ten gates at once.
      - name: Require the guard to stay silent on a healthy boot
        run: make smoke-ksp-guard
      - name: Forge -7 and require the guard to name task_exit_switch
        run: make smoke-ksp-guard-control

  syscall-coverage:
    name: "Which syscall handlers a test actually enters is decided, not drifting"
    runs-on: ubuntu-latest
    # SIX clean builds and six full workloads: three per arm (a scripted ring-3
    # session, the conformance suite, and the boot-modules session), and the
    # control arm rebuilds all three. The sessions are the long pole. This said
    # "two clean builds and two full workloads" until 2026-08-30, when the target
    # had run three since the modules session was added.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # captest is a REFUSAL suite: its checks for SYS_DMESG and SYS_AUDIT_DIGEST
      # both assert SYS_ERR_PERM, and the capability gate returns before the
      # handler runs. Both syscalls were named by the suite, neither handler had
      # ever executed, and issue #176 -- reproducible for every static buffer in
      # the system -- was invisible to all 100 checks. This measures which
      # handler bodies actually run and fails on drift in EITHER direction.
      - name: Measure handler entry and diff against the manifest
        run: make smoke-syscall-coverage
      # The falsifying arm for the 2026-08-30 SC_NONE promotions. Without it, a
      # promotion captest's probes EARNED is indistinguishable from one that was
      # free all along, and deleting the probes would leave this gate green.
      #
      # A STEP IN THIS JOB RATHER THAN A JOB OF ITS OWN, deliberately: a new job
      # is a new required context, and the ruleset that decides required contexts
      # is synced by hand after the merge ([C-6]), so a new gating job leaves the
      # ruleset one context behind until someone runs --sync-ruleset. A step adds
      # the check without adding that lag.
      - name: Remove the probes and require the gate to name exactly its twelve
        run: make smoke-syscall-coverage-control

  gate-pairs:
    name: "Every control arm has a base gate, and every gate runs"
    runs-on: ubuntu-latest
    # Source analysis only -- no build, no QEMU. Seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The control-arm discipline is this repo's answer to "would this gate fail
      # if the property broke", and nothing checked that the pairs stayed intact.
      # smoke-ksp-guard-control was found on 2026-08-21 with no positive
      # counterpart: an arm proving the guard COULD fire, with nothing asking
      # whether it stayed silent on a legal value -- the same missing direction
      # that once let the resume-%rsp guard reject the IST stacks.
      - name: Refuse an orphan control arm, or a gate nobody runs
        run: python3 tools/check_gate_pairs.py
      # Five rules, and until 2026-08-30 rule 1 inferred the classification from
      # the target NAME, which was wrong for four arms and made two published
      # counts wrong with it. Seven arms: one per rule, one for a manifest entry
      # whose target is gone, and one asserting an unmutated tree PASSES, since
      # six "is it caught" arms are satisfied by a checker that rejects everything.
      - name: Falsify every rule of the checker
        run: ./tools/test_check_gate_pairs.sh

  defer-exemption:
    name: "The claim audit's exemption outlives the release it exempts (G-9; control arm proves it)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # percpu_deferred_release[] IS the auditor's exemption. Clearing it before
      # the lock that drops the claim leaves a window in which the task is
      # claimed, un-exempt and mid-release -- and an audit landing there reports a
      # leak that is not one. The window is widened in BOTH arms so the pair is
      # deterministic rather than a soak.
      - name: The widened window is silent with the exemption held
        run: make smoke-defer-exemption
      - name: Control arm — clear the exemption early and the audit accuses
        run: make smoke-defer-exemption-control

  switch-commit:
    name: "A refused switch leaves no claim behind (G-9 root cause; control arm proves it)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # ksp_refuse() returns 0, which is also task_exit_switch's legal "nothing
      # runnable" return. Committing the switch before validating therefore
      # orphaned the claim on a task the caller then parked away from.
      - name: A refused resume value orphans no claim
        run: make smoke-switch-commit
      - name: Control arm — commit first and the claim is orphaned
        run: make smoke-switch-commit-control

  claim-release:
    name: "A CPU in ring 3 owes no deferred release (G-9 class; control arm proves it)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The claim audit cannot see an unpaid deferred release: it exempts exactly
      # that state as a legitimate mid-handover. So the debt is checked where it
      # is provably settled instead -- at ring 3.
      - name: The invariant holds on a clean build
        run: make smoke-claim-release
      - name: Control arm — strip the release and it must fire
        run: make smoke-claim-release-control

  libhorus:
    name: "The shared userspace runtime keeps its bounds, and refuses rather than spins"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Sharing a runtime concentrates risk: a bug in libhorus now breaks init,
      # shell, fs_server and console_server at once, where a bug in one private
      # copy used to break one program. The shared copy is held to a standard the
      # seven private copies never were.
      - name: libhorus conformance from ring 3
        run: make smoke-libhorus
      # The security half. Without this arm the gate above passes identically
      # against a library that spins on every refusal -- G-8 signature C, where a
      # capability denial is indistinguishable from a hang.
      - name: Control arm — a permanent refusal must not be retried
        run: make smoke-libhorus-retry-control
      # The termination half: strncpy's semantics leave the buffer unterminated
      # exactly when the source did not fit.
      - name: Control arm — ustrncpy must always terminate
        run: make smoke-libhorus-strncpy-control

  vfs:
    name: "Two filesystem servers, two mounts, one namespace (2.4)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Both directions in one target: reads zeros through /dev/zero and keeps
      # /bin on the root mount, and asserts a mount needs a capability.
      - name: The VFS mount table from ring 3
        run: make smoke-vfs
      # Routing. Under first-match /dev/zero reaches the root filesystem, which
      # has an inode 0 of its own -- so it ANSWERS about a different object
      # rather than failing, which is why the check is which server replied.
      - name: Control arm — longest prefix must win
        run: make smoke-vfs-prefix-control
      # The mount gate: a prefix string alone must not install a mount.
      - name: Control arm — a mount needs a capability, not a name
        run: make smoke-vfs-mount-control

  passwd-probe:
    name: "The in-kernel ramfs is unreachable from ring 3 (H-3)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Four doors, one probe: an ordinary uid-1000 task with no delegated
      # capability must not open the user-database file, read any ramfs fd,
      # create a file, or list the store.
      - name: An unprivileged task is refused the in-kernel ramfs
        run: make smoke-passwd-probe
      # Restores the four slot-3 gates. Without this arm the gate above passes
      # identically against a kernel that never had the syscalls at all, which
      # is not the property being claimed.
      - name: Control arm — slot-3 gated, the store is readable
        run: make smoke-passwd-probe-control
      # The fifth door, found 2026-08-23. SYS_EXEC_LEGACY (14) creates a TASK on
      # the same slot-3 authority, and the [H-3] sweep could not see it because
      # the dispatch entry was a bare `[14]`. Under this arm the uid-1000 probe
      # calls it and is handed a task id, which is what it did against the tree
      # as it then stood.
      - name: Control arm — the retired legacy syscalls, including the one that spawns a task
        run: make smoke-passwd-probe-legacy-control

  frame:
    name: "A frame capability names an object, and a delegate maps only what it holds"
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Both directions in one target: one task retypes a frame out of its
      # CAP_UNTYPED, maps it and asserts every refusal the map path owes, then
      # delegates a READ-only copy; the other sees the shared bytes and cannot
      # obtain a writable mapping. A gate that only refuses is satisfied by a
      # kernel that refuses everything.
      - name: Frame capabilities from ring 3
        run: make smoke-frame
      # The one the whole design turns on. Every task is born holding a CAP_FRAME
      # in slot 3 -- the capability that made [C-1] reachable -- so if the object
      # were a physical address rather than a table index, any task would map
      # physical 0x400000 into ring 3 on the first boot.
      - name: Control arm — the legacy slot-3 CAP_FRAME must map nothing
        run: make smoke-frame-index-control
      # Delegation must reduce. Aimed at the cap_lookup rights floor rather than
      # at the have & want intersection, because given the floor the intersection
      # is redundant and an arm against it could not fail.
      - name: Control arm — a READ-only delegate must not obtain a writable mapping
        run: make smoke-frame-rights-control
      # The partial-failure policy for multi-page regions (roadmap 2.1). Without
      # the unwind, a run that fails part-way keeps the pages it already mapped
      # -- the caller is told it got no region and holds two pages of one. A PTE
      # is authority, so that is a fail-OPEN, and it is the policy SYS_RETYPE
      # uses deliberately, which is why it needs an arm rather than an argument.
      - name: Control arm — a failed region map must leave no page mapped
        run: make smoke-frame-region-control
      # ...and the same policy from the other side. An unwind that clears the
      # whole requested range answers a refused request by destroying the
      # mapping that refused it -- reachable from ring 3 by asking to map a
      # region across an address you want gone.
      - name: Control arm — the unwind must not eat the mapping that refused it
        run: make smoke-frame-region-wide-control
      # The length a frame carries (roadmap 2.1's region object). A loop that
      # advances the virtual cursor and not the physical one hands back a buffer
      # that silently aliases itself: present, writable, correctly righted, and
      # storing one page's worth. Nothing reports it, so a test has to.
      - name: Control arm — a sized frame's pages must not alias each other
        run: make smoke-frame-pages-control
      # SYS_FRAME_PAGES' authority. Read its argument as a frame index rather
      # than a cspace slot and it stops being a lookup and becomes an oracle: a
      # task holding nothing walks indices and learns which frames are live, and
      # how large, across every task in the system.
      - name: Control arm — a frame's size must be readable only by a holder
        run: make smoke-frame-info-control
      # SYS_DMA_ADDR's second capability (S44). It answers with a physical
      # address, disclosed nowhere else in this ABI, and is gated on a device
      # capability as well as the frame: a bus-mastering device already reaches
      # all of memory, so the disclosure adds nothing to THAT caller, while
      # handing it to anyone who retyped a page gives out the layout for free.
      - name: Control arm — a bus address readable without a device capability
        run: make smoke-frame-dma-control

  devcap:
    name: "A device capability names one device, and reaches only that device"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # CAP_IO_DEVICE was a type with no object: SYS_MAP_PHYS tested a compiled-in
      # VGA allowlist, SYS_IOPORT_GRANT loaded one compiled-in console port set,
      # and SYS_IRQ_REGISTER took a hardcoded pair of lines -- so holding ANY
      # device capability was holding the console. This boots with a NIC on the
      # bus and a probe holding two device capabilities, and requires each to
      # reach its own device's frames, ports and IRQ and be refused the other's.
      - name: Device-capability isolation from ring 3
        run: make smoke-devcap
      # The [C-1]-shaped defect itself: ignore the capability's object and the NIC
      # capability maps the console's framebuffer.
      - name: Control arm — an unconsulted object reaches the console's frames
        run: make smoke-devcap-object-control
      # The port half. One global TSS bitmap, loaded for every grant regardless of
      # which device was named.
      - name: Control arm — a port grant that ignores the device it named
        run: make smoke-devcap-ports-control
      # The interrupt half. An IRQ line belongs to a device, not to a type.
      - name: Control arm — an IRQ registered against the wrong device
        run: make smoke-devcap-irq-control

  net:
    name: "A network driver in ring 3, holding one device capability"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Roadmap 2.6's first half. netd brings up virtio-net over the legacy I/O
      # BAR and completes an ARP exchange with QEMU's user-mode gateway. Its
      # whole authority is a CAP_IO_DEVICE naming the NIC plus one untyped
      # region -- no console, no filesystem, no ambient anything.
      - name: A ring-3 driver completes an exchange on the wire, over MSI
        run: make smoke-net
      # The INTx fallback, on a device model with no MSI capability. Same driver,
      # same code, different device -- which is what keeps the wire path a tested
      # one rather than an assumption, and is where S46's masking applies.
      - name: The same driver over a legacy interrupt line
        run: make smoke-net-intx
      # S53. SYS_DMA_ADDR installs an IOMMU translation for a frame, and nothing
      # removed it when the frame died: frame_map_refcount counts CPU mappings
      # only, so a device mapping neither kept the frame alive nor was torn down,
      # and destroy_dyn_frame scrubbed the run and returned it to the arena with
      # the device still able to reach it. A device-side use-after-free.
      #
      # In-kernel rather than a DMA on purpose: proving it with a packet means
      # pointing a live device at a page the arena has already handed out, which
      # is committing the bug to observe the fix.
      - name: A device translation does not outlive the frame it named
        run: make smoke-iommu-teardown
      - name: Control arm — a destroyed frame the device can still reach
        run: make smoke-iommu-teardown-control
      # S47. An MSI's data word IS the vector, so a driver able to choose one
      # could raise the timer's, another driver's, or an exception gate. This arm
      # honours a caller-supplied vector and netd asks for 13 (#GP).
      - name: Control arm — a driver choosing its own interrupt vector
        run: make smoke-net-msi-vector-control
      # S48. An MSI-X vector table lives in a BAR, not in configuration space, so
      # S47's mechanism does not transfer -- a driver could map it like any other
      # register page and write its own vector with no syscall involved. The
      # refusal is what makes S47 hold for MSI-X too.
      - name: Control arm — a driver mapping its own MSI-X vector table
        run: make smoke-net-msix-table-control
      # SYS_DEVICE_ENABLE writes the only configuration-space register ring 3 can
      # reach. Clear all three decode bits and the device stops answering its own
      # I/O BAR -- which is what shows the write lands rather than returning 0.
      #
      # This is NOT the bus-master arm it started as: measured, QEMU does not
      # enforce PCI bus-master enable for virtio-net, so that arm cannot fail
      # here and a control arm that cannot fail cannot gate.
      - name: Control arm — a device asked to decode nothing answers nothing
        run: make smoke-net-decode-control
      # SYS_DMA_ADDR returns the address the DEVICE uses. Program the driver's own
      # virtual address instead and every register write still succeeds, the
      # device accepts both queues, and not one descriptor is ever found.
      # S45. The IOMMU is only a property if the mappings are load-bearing: same
      # driver, same device, every capability check still run and every address
      # still correct -- only the device MAPPINGS withheld -- and the device
      # cannot read its own descriptor ring.
      - name: Control arm — a device address space with nothing mapped into it
        run: make smoke-net-iommu-control
      # S46. A level-triggered PCI line left unmasked when it fires re-delivers
      # forever: ring 3 never runs, the driver never clears the device, and the
      # machine stops making progress. Asserts a STALL, because that is what a
      # livelock looks like -- the DMA property still holds and only the
      # interrupt half never completes.
      # S46's mask, tested directly rather than through a livelock. Only possible
      # since SYS_POLL_NOTIFY: a caller can now observe that a notification did
      # NOT arrive, so "no interrupt while masked" is a deterministic marker
      # instead of a stall -- and it fails on the I/O APIC path, where the storm
      # arm below cannot.
      - name: Control arm — a notification arriving while its line is masked
        run: make smoke-net-mask-control
      # The livelock, kept on the 8259 path where QEMU still produces one. Keeps
      # the fallback controller exercised as well as the property.
      - name: Control arm — an unmasked level-triggered line livelocks the machine
        run: make smoke-net-irq-storm-control

  shared-objects:
    name: "Every shared object is one the kernel's loader would accept"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make texinfo
      # Required even though nothing here builds Rust: the Makefile's cargo and
      # rust-target guards are $(error) at PARSE time, so they fire for every
      # target and no recipe is reachable without this. Same reason
      # smoke-newlib-tamper carries it.
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # newlib/ is gitignored, so the checkout does not carry it. Same cache and
      # key as the other newlib jobs -- the key tracks the build script, which
      # pins both the newlib version and the target flags.
      - name: Cache built newlib
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: newlib/install
          key: newlib-${{ runner.os }}-${{ hashFiles('tools/build_newlib.sh') }}
      - name: Build newlib (no-op on cache hit)
        run: tools/build_newlib.sh
      # Roadmap 2.5's remainder: newlib, its port glue and libhorus linked into
      # one shared object the kernel can load. Programs do not link against it
      # yet — what is gated here is that the object stays loadable, because the
      # three ways of producing one the kernel refuses are all silent (no link
      # error): a missing glue object, a missing -Bsymbolic, and a single
      # weak-undefined symbol. Static, because the properties are decidable by
      # reading the object and a boot-time refusal names nothing.
      - name: Build the shared libc and check what the loader requires
        run: make check-shared-objects

  shlib:
    name: "Shared library text is executed by many tasks and writable by none"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make texinfo xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # smoke-shlibc builds the REAL shared libc, so this job needs newlib —
      # which it did not until that step was added, and adding a step whose
      # toolchain the job does not set up is how it first went red. Same cache
      # and key as every other newlib job.
      - name: Cache built newlib
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: newlib/install
          key: newlib-${{ runner.os }}-${{ hashFiles('tools/build_newlib.sh') }}
      - name: Build newlib (no-op on cache hit)
        run: tools/build_newlib.sh
      # Roadmap 2.5's mechanism. Sharing a library is a memory optimisation;
      # sharing it writably is a code-injection primitive between every task that
      # maps it, which is worse than the static copies it replaces. Two tasks map
      # the same frames, execute them, and neither can write them.
      - name: Two tasks execute one library; neither can write it
        run: make smoke-shlib
      # The attack, not a stand-in: the capability carries WRITE, one task patches
      # a function through a writable alias, and the PEER runs the patch.
      - name: Control arm — writable shared text is cross-task code injection
        run: make smoke-shlib-writable-control
      # S50, the half a libc needs. Of the 59 newlib symbols the shipped
      # coreutils reference, three are writable — _impure_ptr (errno, stdio
      # buffers, atexit, rand), optarg and optind — so a library cannot be
      # shared until it can carry data that is private per task.
      - name: Control arm — a shared library's writable data is one task's errno in another's hands
        run: make smoke-shlib-data-shared-control
      # Loss rather than disclosure, and a separate flag: private but never
      # initialised is a libc whose _impure_ptr is NULL. It does not leak, it
      # just does not work, and that is a different defect.
      - name: Control arm — a private copy that was never initialised from the image
        run: make smoke-shlib-data-init-control
      # S51. Two boots, because the property is not observable from inside one:
      # a single run sees an address either way and cannot tell a random base
      # from a fixed one. This matters most for what comes next — when newlib
      # moves onto this mechanism it is ~135 KiB of executable code in every
      # task, and a compiled-in base would be a regression against a program's
      # static libc, which already lives inside its ASLR'd PIE image.
      - name: The library loads at a different address every boot
        run: make smoke-shlib-aslr
      - name: Control arm — a compiled-in base loads at the same address twice
        run: make smoke-shlib-aslr-control
      # The base is the address of code every task executes, so it is answered
      # only to a caller holding a capability over the library's own text.
      - name: Control arm — an ungated SYS_SHLIB_INFO tells whoever asks
        run: make smoke-shlib-info-control
      # Separate rule, separate arm: with only the arm above, "the capability
      # must name a library TEXT frame" has never been shown to fire.
      - name: Control arm — any frame capability answers, including the task's own data page
        run: make smoke-shlib-info-object-control
      # Roadmap 2.5's remaining claim: not the mechanism's properties on a
      # purpose-built demo, but the mechanism running the REAL libc. newlib has
      # writable state, calls back into the port's syscall glue, and allocates —
      # none of which an object whose whole data segment was one int could
      # exercise. The target also checks statically that libctest defines none
      # of the symbols it calls, so the calls cannot resolve locally.
      - name: A ring-3 task calls newlib out of the shared library
        run: make smoke-shlibc
      # The other half, and the one roadmap 2.5 was for: a program written in
      # ordinary C — calling printf by name — linking no libc at all, only the
      # generated stub archive. Same source linked statically is 106,392 bytes;
      # linked this way, 13,088. The target checks before booting that every
      # libc symbol the program defines is a 14-byte thunk rather than an
      # implementation, because a statically-linked build would print exactly
      # the same thing and prove nothing.
      - name: A program links against the shared libc and carries none of it
        run: make smoke-shlibc-link

  fpu:
    name: "A task cannot read another's XMM register file"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # S16's witness column was an em-dash until 2026-08-28: the property was
      # stated, fpu_save/fpu_restore were real code called from the ring
      # transition, and nothing exercised them. Both halves in one target -- one
      # task's sentinel survives 64 switches, and the other task never sees it.
      - name: XMM register-file isolation from ring 3
        run: make smoke-fpu
      # The disclosure, which is what S16 actually says. Drop the fxrstor and a
      # task inherits whatever the previously-running task left in the physical
      # registers.
      - name: Control arm — an unrestored register file leaks to the next task
        run: make smoke-fpu-leak-control
      # The other half, which is loss rather than disclosure. Separable on
      # purpose: under this arm the leak check still passes, and under the arm
      # above the integrity check still passes, so neither is one gate wearing
      # two names.
      - name: Control arm — an unsaved register file is lost to its own task
        run: make smoke-fpu-save-control

  fork:
    name: "A forked child's memory is a copy, and a kernel object is never forked"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Both directions in one target. The child must see the bytes that existed
      # at the fork and neither side's later writes; and a task with a CAP_FRAME
      # mapped must be refused, then succeed once it unmaps -- so the refusal is
      # about the frame rather than about fork being broken. A gate that only
      # refuses is satisfied by a kernel whose fork never works.
      - name: fork from ring 3
        run: make smoke-fork
      # The copy. Leave both trees' leaves writable and a fork is not a fork: it
      # is one process with two schedulable contexts, and the child's write to
      # its own page lands in its parent's.
      - name: Control arm — an unmarked clone shares its parent's pages
        run: make smoke-fork-share-control
      # The kernel object. Clone a PTE whose frame belongs to the untyped arena
      # and the child holds a live mapping of an object NO capability of its own
      # names: revoking the parent's CAP_FRAME sweeps the parent's PTE and leaves
      # the child's behind. Sibling of smoke-nzcow-arena-control, one layer up --
      # that one asks what a COW break does, this one asks whether the mapping
      # should have been cloned at all.
      - name: Control arm — a mapped kernel object must refuse the fork
        run: make smoke-fork-arena-control
      # The derivation, and the two ways to get it wrong. A verbatim copy gives
      # two capabilities one serial, and the sweep nulls by serial across every
      # cspace -- so the child revoking its own slot would destroy the parent's,
      # a cross-task revocation primitive available to every task that can fork.
      - name: Control arm — a forked capability must not share its parent's serial
        run: make smoke-fork-cspace-flat-control
      # ...and the converse, which is the one the change exists for. A fresh
      # serial with no parent edge is a second ROOT of the capability graph
      # holding the parent's authority: revoking the parent's leaves the child's
      # working. Finding 3.3's shape applied to a whole cspace at once.
      - name: Control arm — a forked capability must be derived from its parent's
        run: make smoke-fork-cspace-orphan-control

  forkexec:
    name: "An exec replaces the image, not the authority"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # fork and exec were each gated; the two in SEQUENCE were not, and that is
      # the only sequence a shell ever performs. The driver forks, the child
      # replaces its image, and the driver then reads the child's cspace out of
      # the derivation graph: same capability, same serial, same badge, and the
      # driver's revoke still reaches it three generations down. It also re-reads
      # its own page -- the exec RECLAIMS the cloned address space, and nothing
      # else in the tree frees a cloned space while its parent is still running.
      - name: fork then exec, from ring 3
        run: make smoke-forkexec
      # The exec discards. "Give the new image a clean slate" leaves the task
      # holding only its birth endowment, so a shell that forks, endows and execs
      # hands its child nothing.
      - name: Control arm — an exec must not discard what the task was given
        run: make smoke-forkexec-reset-control
      # The exec launders, and the one the property exists for. Keep every
      # capability but re-mint it as a root: the authority is identical and every
      # functional check passes, so only the derivation graph can see it -- and
      # the parent's revoke no longer reaches the child's copy. Finding 3.3's
      # shape, one syscall over from smoke-fork-cspace-orphan-control.
      - name: Control arm — an exec must not re-root what it keeps
        run: make smoke-forkexec-root-control

  rng-seed:
    name: "The CSPRNG refuses to emit keystream before it is seeded"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Both directions in one boot: the probe asks the pool for output before
      # entropy_init() and must be refused, AND the boot must still reach the
      # ring-3 shell banner afterwards. Without the second half the gate is
      # passed by a fill() that refuses everything -- which is not hypothetical,
      # it is what `if true` in place of `if !self.seeded` produces, and that
      # mutation was run against this target and does go red (kernel PANIC from
      # stack_protector_init).
      - name: An unseeded pool is refused, and a seeded one still serves
        run: make smoke-rng-seed
      # The falsifying arm: the cargo feature compiles the check out, the same
      # probe receives ChaCha20 keystream under the published startup key, and
      # the base gate above goes red against this build.
      - name: Control arm — without the check, the unseeded pool serves keystream
        run: make smoke-rng-seed-control

  defect-flags-documented:
    name: "Every defect flag has a row in the table that claims to list them all"
    runs-on: ubuntu-latest
    # Source analysis only -- no build, no QEMU. Seconds. Deliberately NOT a step
    # in the `defect-flags` job, which boots QEMU and takes 45 minutes: a check
    # this cheap should not wait on one that expensive to tell you a doc is wrong.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # docs/BUILDING.md asserts its defect-flag table is "the complete list".
      # That sentence was false when it was written: RESUME_RSP_INJECT,
      # RESUME_RSP_INJECT_PRECLAIM and WAL_CRASHTEST were all DEFECT_FLAGS
      # members with no row, and one of them appeared nowhere in the file. A
      # control arm nobody can find is one nobody will re-run, which makes an
      # undocumented arm indistinguishable from a deleted one.
      - name: Refuse an undocumented defect flag, or a row no build can produce
        run: python3 tools/check_defect_flags.py

  syscall-abi:
    name: "Every user pointer reaches the kernel full-width (issue #176)"
    runs-on: ubuntu-latest
    # Source analysis only -- no build, no QEMU. Seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # sys_dmesg() and sys_audit_digest() passed their buffer as
      # (uint32_t)(unsigned long)ptr, handing the kernel the low 32 bits of an
      # address the caller never named. A runtime gate only covers the syscalls
      # some probe happens to call; this covers every wrapper in the header,
      # including ones nothing calls yet, because it is a property of the source.
      - name: Refuse any syscall wrapper that narrows a pointer
        run: python3 tools/check_syscall_abi.py

  smoke-klog-forge:
    name: A ring-3 task cannot forge into or evict from the kernel log (H-2/S23; control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds and two single boots, both deterministic and both exiting
    # on their marker in ~25s. The budget is for the builds, not the boots.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # SYS_DMESG -- the READ side of the kernel message ring -- has required
      # CAP_KERNEL_LOG since I-1. The WRITE side required nothing: h_write called
      # print(), which appended every byte to klog before it tested console
      # ownership, so any task could forge dmesg lines and flood the 16 KiB ring
      # to evict genuine ones. Finding H-2, property S23. The probe is ENDOWED
      # with CAP_KERNEL_LOG (READ only -- root_cnode[15] mints no other right) so
      # that it reads the ring back and is still refused the write direction: a
      # bare task would prove a weaker claim than the finding makes.
      - name: Require a ring-3 flood to reach the console and NOT the kernel log
        run: make smoke-klog-forge
      # The load-bearing arm. Without it, the step above is consistent with a
      # kernel whose klog simply stopped recording anything at all.
      - name: Remove the gate and require the forgery AND the eviction to REPRODUCE
        run: make smoke-klog-forge-control
      # The probe's buffer is a STATIC, so it lives above 4 GiB
      # (USER_IMAGE_ASLR_BASE is 16 GiB) and exercises the full-width pointer ABI
      # as a side effect of reading the log back. SYSCALL_PTR_TRUNC32=1 restores
      # the wrappers that truncated it to 32 bits (issue #176); the probe must
      # then be unable to read the log at all. Without this arm, nothing notices
      # if the buffer ever goes back to the stack and the ABI half stops being
      # tested.
      - name: Restore the 32-bit pointer truncation and require the probe to FAIL
        run: make smoke-klog-forge-abi-control

  smoke-kstack-park:
    name: A dying task's CPU parks on its own kernel stack (S20 park path)
    runs-on: ubuntu-latest
    # Backstop, not a budget. The control arm may boot up to
    # KSTACK_PARK_CONTROL_ATTEMPTS (24) times when KSTACK0_PARK_TRACE keeps killing
    # the workload (~40% of boots, and it is the instrument doing it -- see the
    # Makefile); boots that die are the fast ones (~6s on the runner that reddened
    # 9476799), but a run of mostly-conclusive boots is not.
    timeout-minutes: 105
    # MERGE-GATING since #190, and able to say so since this comment was written.
    #
    # It carried `continue-on-error: true` while it was advisory ([G-9], now
    # closed). #190 promoted it by editing .github/ci-gating.yml and the ruleset,
    # and touched no workflow; #191 rewrote the job NAME one line above to delete
    # the word ADVISORY from the published context, and left the line below it
    # alone. So for the whole of that window GitHub required a context that
    # reported SUCCESS however the steps exited, and the ruleset audit -- which
    # compares NAMES -- had nothing to notice.
    #
    # It was not idle. This job failed on `main` at 9476799 (the control arm did
    # not reproduce in 8 boots) inside a run GitHub reported green, and on
    # a59667ab before that. `tools/check_ci_gating.py` now refuses the
    # combination outright, so a required job cannot be made unfailable again.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        uses: ./.github/actions/apt
        with:
          packages: build-essential binutils make xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The three fault/exit fallbacks in idt.c used to park every CPU on
      # tasks[0].kernel_stack_top -- one stack. The workload is the process
      # self-test at -smp 4 because it kills tasks on purpose: a HEALTHY session
      # never enters the path at all (0 parks in 3 boots), so gating on the
      # session would have been a green check over a code path nobody ran.
      - name: Kill tasks on four CPUs and require every park to be on its own stack
        run: make smoke-kstack-park
      # Without this arm the step above is consistent with "the park path is
      # unreachable", which is exactly what it looked like before the workload
      # was chosen to kill tasks.
      - name: Restore the shared park and require it to REPRODUCE
        run: make smoke-kstack-park-control

