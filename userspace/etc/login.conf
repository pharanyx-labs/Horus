# /etc/login.conf - settings for the login prompt.          See login.conf(5).
#
# Read by the shell before every login prompt. A change takes effect at the
# next prompt.
#
# WHEN THIS FILE APPLIES. On an installed system the disk is sealed from power
# on until the first login of the boot unlocks it, and nothing on it, this
# file included, can be read before then. So the compiled defaults below hold
# for the first login after each boot, and this file for every login after.
# On a live boot it applies from the first prompt.
#
# FORMAT. One setting per line, written `key = value`. A '#' starts a comment,
# and blank lines are ignored. At most 4096 bytes, and 128 characters a line.
#
# ONLY STRICTER. A setting here can make logging in slower or stricter than
# the compiled default, never faster or looser. The kernel's own protection,
# which locks an account after repeated wrong passwords and which you cannot
# configure, applies whatever this file says. A value outside its range is
# REFUSED, not rounded to the nearest allowed one, with a message naming the
# line; the default then stands.
#
# This file is root's (mode 0644): any login can read it, only the
# administrator can change it. Horus wrote it once, on the first boot that
# found no /etc/login.conf, and will never overwrite it.

# failure_delay - seconds to wait after each wrong password
#   Default: 0 (no extra wait)
#   Allowed: whole seconds from 0 to 30
#   Slows guessing at this console. It adds to the kernel's lockout and never
#   replaces it. Example, two seconds:  failure_delay = 2
failure_delay = 0
