# Boot config for an INSTALLED DISK: the EFI system partition the installer
# writes (docs/design/installed-system.md section 6, SECURITY.md S115).
#
# It lives in the memdisk INSIDE BOOTX64.EFI, beside the kernel's pinned hash,
# exactly as grub.cfg does on the install media: UEFI firmware measures the
# binary it loads into PCR[4], so this config and the pin are measured with it,
# and a disk whose kernel was replaced refuses to boot it (S92).
#
# ONE ENTRY, NO MENU. A machine starting from its own disk has no choice to
# offer, and the token-free command line is what makes the kernel come up as the
# installed system: not live (which opens no disk, S110) and not the installer.
#
# Both terminals, for the reason grub-menu.cfg gives: the laptop has no serial
# port, and a refusal shown only on a port the machine lacks is a machine that
# appears to hang.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial
set timeout=0
set default=0

insmod hashsum
insmod gcry_sha256
insmod regexp

# THE ROOT IS THE PARTITION THIS GRUB WAS LOADED FROM, read off $cmdpath, and
# not a search. `search --file /boot/kernel.elf` would accept the first device
# carrying that file, which on a machine with the install stick still plugged in
# may be the stick; the pin would still refuse a kernel that differs, but the
# disk would be booting somebody else's modules beside its own kernel. The ESP
# this binary came from is the only right answer, and the firmware already said
# which one that is.
regexp --set=1:root '^\((.*)\)' "$cmdpath"

function horus_verify_kernel {
    hashsum --hash sha256 --check (memdisk)/boot/grub/kernel.sha256 --prefix ($root)/boot
}

menuentry "Horus" {
    insmod multiboot2
    insmod all_video
    insmod part_gpt
    insmod fat
    if horus_verify_kernel ; then
        multiboot2 /boot/kernel.elf
@HORUS_MODULES@
        boot
    else
        echo "HORUS: REFUSED -- /boot/kernel.elf does not match the hash pinned in the measured boot image."
        echo "HORUS: the kernel on this disk is not the kernel this disk was installed to boot."
        sleep 10
        halt
    fi
}
