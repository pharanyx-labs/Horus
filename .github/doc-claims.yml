# Claims the documentation makes that a machine can check.
#
# Every number in this repository's docs has gone stale within days at least
# once. The 2026-08-19 audit found nine of them wrong across five files while
# two other files carried the same numbers correctly -- which is the only reason
# the drift was visible at all. Writing "re-derive every number you cite" into
# CLAUDE.md did not stop it, because a rule that only a reader enforces is a
# rule that fails silently.
#
# So the derivable claims are checked instead. `tools/check_doc_claims.py`
# computes each value from the source of truth and requires every declared
# occurrence to agree, and the `doc-claims` CI job fails the build when one does
# not. Adding a claim here is how you make a number in a document load-bearing.
#
# Two kinds of entry:
#
#   counts:    a value derived from the tree, plus every place that states it.
#              A file that is declared to state a claim and does not is an
#              error too -- otherwise rewording a sentence would silently
#              delete the check along with the claim.
#
#   forbidden: text that was true once and is not any more. When you correct a
#              fact, put its old phrasing here so it cannot come back. This is a
#              ratchet: it costs one line per correction and it is the only part
#              of this file that catches prose rather than digits.

counts:
  - id: ci_jobs
    describe: jobs defined in .github/workflows/ci.yml
    derive: ci_jobs
    occurrences:
      - file: README.md
        pattern: '`\.github/workflows/ci\.yml` runs (\d+) jobs'
      - file: README.md
        pattern: "the bulk of CI's (\\d+) jobs"
      - file: TESTS.md
        pattern: '`\.github/workflows/ci\.yml` defines \*\*(\d+)\*\* jobs'
      - file: docs/LIMITATIONS.md
        pattern: '`\.github/workflows/ci\.yml` defines \*\*(\d+)\*\* jobs'

  - id: all_jobs
    describe: jobs across ci.yml, codeql.yml and ruleset-audit.yml
    derive: all_jobs
    occurrences:
      - file: TESTS.md
        pattern: 'below — \*\*(\d+)\*\* jobs'
      - file: docs/LIMITATIONS.md
        pattern: 'one more — \*\*(\d+)\*\* across the three'
      - file: docs/ROADMAP.md
        pattern: '\((\d+) jobs, \d+ contexts'

  - id: contexts
    describe: status-check contexts those jobs produce
    derive: contexts
    occurrences:
      - file: README.md
        pattern: 'The intended set is \d+ of its (\d+) contexts'
      - file: TESTS.md
        pattern: '\*\*\d+\*\* jobs, \*\*(\d+)\*\* contexts'
      - file: docs/LIMITATIONS.md
        pattern: 'producing \*\*(\d+)\*\* status-check contexts'
      - file: docs/ROADMAP.md
        pattern: '\(\d+ jobs, (\d+) contexts'

  - id: required
    describe: contexts classified as merge-gating in .github/ci-gating.yml
    derive: required
    occurrences:
      - file: README.md
        pattern: 'The intended set is (\d+) of its \d+ contexts'
      - file: TESTS.md
        pattern: 'The intended set is \*\*(\d+) required contexts'
      - file: docs/LIMITATIONS.md
        pattern: 'That intended set is \*\*(\d+) required contexts'
      - file: docs/ROADMAP.md
        pattern: 'The intended set is \*\*(\d+) required, \d+ exempted\*\*'
      # site/index.html said 73 here for as long as the count had been 89. It was
      # the only statement of this number that nothing derived, which is exactly
      # why it was the one that rotted -- and it is the PUBLIC one.
      - file: site/index.html
        pattern: 'intended set is (\d+) gating and \d+ exempted'

  - id: advisory
    describe: contexts exempted with a written reason
    derive: advisory
    occurrences:
      - file: TESTS.md
        pattern: '\*\*\d+ required contexts and (\d+) reasoned exemptions\*\*'
      - file: docs/LIMITATIONS.md
        pattern: '\*\*\d+ required contexts and (\d+) reasoned exemptions\*\*'
      - file: docs/ROADMAP.md
        pattern: '\*\*\d+ required, (\d+) exempted\*\*'
      - file: site/index.html
        pattern: 'intended set is \d+ gating and (\d+) exempted'


  - id: smoke_targets
    describe: "smoke-* targets in the Makefile"
    derive: smoke_targets
    occurrences:
      - file: docs/ROADMAP.md
        pattern: '\| (\d+) `smoke-\*` targets'

      - file: site/index.html
        pattern: 'every one of the (\d+) test targets'
  - id: syscall_numbers
    describe: SYS_* numbers the ABI defines, implemented or not
    derive: syscall_numbers
    occurrences:
      - file: site/index.html
        pattern: 'defines <strong>(\d+) syscall numbers'
  - id: framepeer_checks
    describe: check() calls in userspace/framepeer.c (the delegate's side)
    derive: framepeer_checks
    occurrences:
      - file: SECURITY.md
        pattern: '55 parent checks \+ (\d+) peer checks'
      - file: TESTS.md
        pattern: '\+ (\d+) peer checks'
  - id: security_properties
    describe: S-numbered rows in SECURITY.md's property table
    derive: security_properties
    occurrences:
      - file: .github/invariants.yml
        pattern: 'All (\d+) properties in SECURITY\.md'
      - file: TESTS.md
        pattern: 'currently \*\*empty\*\*: all (\d+) properties'
      - file: docs/ROADMAP.md
        pattern: '\*\*empty\*\* — all (\d+) properties name a witness'
  - id: gates
    describe: base gates — smoke-* targets that are not control arms
    derive: gates
    occurrences:
      - file: site/index.html
        pattern: '(\d+) QEMU integration targets'
  - id: control_arms
    describe: control-arm smoke targets that must reproduce a defect
    derive: control_arms
    occurrences:
      - file: docs/ROADMAP.md
        pattern: 'and (\d+) of them control arms'

  - id: syscalls_covered
    describe: "syscalls whose handler a tracked workload enters (.github/syscall-coverage.yml `covered`)"
    derive: syscalls_covered
    occurrences:
      - file: SECURITY.md
        pattern: 'Currently \*\*(\d+) of \d+\*\* — the property'
      - file: TESTS.md
        pattern: 'Currently \*\*(\d+) of \d+\*\* implemented syscalls'
      - file: docs/LIMITATIONS.md
        pattern: 'gated since: \*\*(\d+) of \d+\*\* implemented syscalls'
      - file: site/index.html
        pattern: '<strong>(\d+) of \d+</strong> system calls'

  # The other half of those four ratios. Declared 2026-08-27, because it had
  # drifted in a way the numerator could not: the four sentences above were
  # gated and correct, and the sentences immediately after them said 25, 25 and
  # 33 for one quantity whose live value was 27. Gating a numerator and leaving
  # its remainder to be typed is gating half a claim.
  - id: syscalls_uncovered
    describe: "syscalls with a written reason for no handler-entry coverage (.github/syscall-coverage.yml `uncovered`)"
    derive: syscalls_uncovered
    occurrences:
      - file: docs/LIMITATIONS.md
        pattern: 'The other (\d+) are listed in `\.github/syscall-coverage\.yml`'
      - file: docs/LIMITATIONS.md
        pattern: 'a defect in any of those (\d+) handlers'
      - file: docs/LIMITATIONS.md
        pattern: '\*\*Two of the (\d+) are cheap'
      - file: site/index.html
        pattern: 'The other (\d+) are each'

  # The DENOMINATOR of the four ratios above, which until 2026-08-22 was the
  # literal `76` inside each of their patterns -- so the number every one of
  # those sentences states was the one thing here that nothing checked. It was
  # wrong when it was noticed: three syscalls with real handlers sat in the
  # dispatch table as bare numeric literals (`[4]`, `[8]`, `[9]`), and the
  # derivation reads `[SYS_NAME] = { handler`, so it could not see them. A claim
  # whose denominator is hardcoded in its own checker is not a checked claim.
  - id: syscalls_implemented
    describe: dispatch-table entries with a real handler
    derive: syscalls_implemented
    occurrences:
      - file: SECURITY.md
        pattern: 'classifies all (\d+) implemented syscalls'
      - file: SECURITY.md
        pattern: 'Currently \*\*\d+ of (\d+)\*\* — the property'
      - file: TESTS.md
        pattern: 'Currently \*\*\d+ of (\d+)\*\* implemented syscalls'
      - file: docs/LIMITATIONS.md
        pattern: 'gated since: \*\*\d+ of (\d+)\*\* implemented syscalls'
      - file: site/index.html
        pattern: '<strong>\d+ of (\d+)</strong> system calls'

  # frametest's parent-side checks, declared 2026-08-27 for the reason the entry
  # above it exists: TESTS.md carried 17 while the wire said 31, and the number
  # is quoted in SECURITY.md as the witness for S35. Read it off the wire
  # (`FRAMETEST: parent OK <n> checks`) -- this only proves the documents agree
  # with the source, not that the source ran.
      - file: site/index.html
        pattern: 'installs <strong>(\d+)'
  - id: frametest_checks
    describe: parent-side check() assertions in userspace/frametest.c
    derive: frametest_checks
    occurrences:
      - file: TESTS.md
        pattern: '\*\*(\d+) parent checks\*\*'
      - file: SECURITY.md
        pattern: '`make smoke-frame` \((\d+) parent checks\)'

  - id: captest_checks
    describe: check() assertions in userspace/captest.c
    derive: captest_checks
    occurrences:
      - file: SECURITY.md
        pattern: '`make smoke-captest` \((\d+) checks\)'
      - file: TESTS.md
        pattern: '\| `smoke-captest` \| \*\*(\d+) checks\*\*'
      - file: docs/BUILDING.md
        pattern: 'are all refused \((\d+) checks'
      - file: TESTS.md
        pattern: 'Capability conformance \((\d+) checks'
      - file: site/index.html
        pattern: 'make smoke-captest\s+<span class="c"># (\d+) capability checks'

forbidden:
  - pattern: 'every one of the 53 test targets'
    reason: >-
      site/index.html said 53 against a live 134 on 2026-08-28 -- undeclared, so
      nothing compared it. Derived now (`smoke_targets`).
  - pattern: 'defines <strong>86 syscall numbers'
    reason: >-
      site/index.html said 86 against a live 102 on 2026-08-28, in the same
      sentence as a handler count that said 75 against 84. Both halves are
      derived now, because the DIFFERENCE between them is the fail-closed claim
      the paragraph makes -- a sentence can drift and still read as consistent
      when only one half is checked.
  - pattern: '55 parent checks \+ 8 peer checks'
    reason: >-
      SECURITY.md said 8 peer checks and TESTS.md said 5, against a live 9, on
      2026-08-28. Two documents disagreeing with each other and both with the
      tree is what an underived count does once the test it describes grows.
      Derived now (`framepeer_checks`).
  - pattern: 'There is\s+no `fork` — the only COW producer is the demand pager'
    reason: >-
      docs/LIMITATIONS.md 2.4 said this for a day after SYS_FORK landed (#220), and
      2.4 is the section a reader consults to find out whether COW has a second
      producer. Corrected 2026-08-28; the sentence survives only as a quotation of
      what it used to say.
  - pattern: '\*\*`fork`\.\*\* `SYS_SPAWN` and `SYS_EXEC_\*` exist; POSIX `fork` does not'
    reason: >-
      docs/LIMITATIONS.md 4 listed `fork` under "functionality that does not exist"
      for a day after it landed. Replaced 2026-08-28 with what a shell actually
      still cannot do -- process groups, job control, /proc.
  - pattern: 'All 43 properties in SECURITY.md'
    reason: >-
      The invariants.yml header, TESTS.md and ROADMAP.md each stated this count and
      none of them was compared to the table, so adding S42 made all three wrong at
      once -- the same shape as the framepeer count one commit earlier. Derived now
      (`security_properties`), with the deriver mirroring
      tools/check_invariants.py's own row regex so the two cannot disagree about
      what a property is.
  - pattern: '68 QEMU integration targets'
    reason: >-
      site/index.html carried this from whenever the gate count was 68 until
      2026-08-28, when it was 88 -- undeclared, so nothing compared it to the
      tree. It is a derived claim now (`gates`), which is the only reason it will
      not drift again. Found while auditing the public page for numbers that no
      checker owned; the lesson is that adding a checker does not retrofit
      coverage over claims nobody declared to it.
  - pattern: 'the capability space a child inherits is not'
    reason: >-
      site/index.html said this in the Track 2 summary for one day, between the
      fork memory clone (#220, 2026-08-28) and the cspace clone the same day. A
      forked child now inherits its parent's capabilities as DERIVED copies
      (S41): own serial, badge naming the parent's capability, so revoking the
      parent's sweeps the child's. docs/LIMITATIONS.md 2.11 records the closure.
  - pattern: 'is NOT a copy of the caller''s cspace'
    reason: >-
      include/syscall.h's sys_fork() comment and docs/SYSCALLS.md both said this
      while the memory clone shipped without the cspace clone (2026-08-28, one
      day). Superseded by S41. The accurate residue is narrower and is stated
      per-slot instead: slots 0-3, slot 4 and CAP_REPLY are not inherited,
      because copying those would be impersonation rather than delegation.
  - pattern: 'there is no real <code>fork</code>'
    reason: >-
      site/index.html carried this in the virtual-memory row until 2026-08-28,
      when SYS_FORK landed with a copy-on-write address-space clone (S39, S40;
      make smoke-fork). It is the public face, so a retired negative claim there
      is the most expensive kind of drift. What is still absent is narrower and
      is stated in its own row: a forked child does not inherit its parent's
      cspace (docs/LIMITATIONS.md 2.11).
  - pattern: '`fork` is the function that would change it'
    reason: >-
      docs/ARCHITECTURE.md 14 and TESTS.md both said this of S38's arena guard,
      which was written in #215 before any caller existed. fork landed the next
      day (2026-08-28) and does mark present user PTEs copy-on-write -- but it
      refuses to clone an arena page at all (S40), so the guard is still reached
      by nothing and is now defended by a stated property rather than by two
      circumstances. Both files say that instead.
  - pattern: 'overstates the ship build by three'
    reason: >-
      The 2026-08-22 note beside SYS_OPEN named SYS_OPEN, 15 and 16, but 15 and
      16 were bare numeric entries the deriver never matched at all -- so the
      overstatement was SYS_OPEN, SYS_PREEMPT_TRACE and SYS_IRQ_POLICY_INFO, and
      the deriver was UNDERcounting five others at the same time. Fixed
      2026-08-23: scan_table evaluates the preprocessor and refuses a bare
      numeric index, so neither direction can recur.

  - pattern: '`RngState::fill\(\)` does not test'
    reason: >-
      Since 2026-08-23 it does: fill() returns false and zeroes the caller's
      buffer while the pool is unseeded (S30, witness make smoke-rng-seed).
      docs/LIMITATIONS.md §2.8 is closed and CHANGES.md restates it in the past
      tense. Asserting it in the present tense again would be one finding with
      two statuses in two files.

  - pattern: 'build twice from clean and diff'
    reason: >-
      make reproducible-build builds ONCE and records .build.sha. The
      double-build-and-diff is the `reproducible` CI job's. Corrected
      2026-08-19; it had been wrong since the target was written.

  - pattern: 'currently also \*commits\* a prebuilt'
    reason: >-
      No build artefact is tracked. kernel.elf and boot.iso are gitignored
      (.gitignore:10-11) and `git ls-files` lists neither. Corrected 2026-08-19.

  - pattern: 'that App does not exist yet|inert until (that|its read-only GitHub) App is created|stays open until the App is created'
    reason: >-
      The ruleset-audit GitHub App went live 2026-08-19; the scheduled run that
      morning read the ruleset and reported it matching. What remains of [C-6]
      is that syncing is manual and lags a merge.

  - pattern: 'pt_walk\(tasks\[cur\]\.cr3, v\) disagrees with the hardware walk|refuses a user address that ring 3 demonstrably has mapped'
    reason: >-
      Issue #176's original analysis, and it was wrong. The kernel's walk agreed
      with the hardware exactly (ucr3 == livecr3, measured); it was walking a
      DIFFERENT address, because sys_dmesg/sys_audit_digest truncated the
      caller's pointer to 32 bits. Corrected 2026-08-20 -- the fix is in
      include/syscall.h, not in paging.c.

  - pattern: '\*Open, page-table half fixed'
    reason: >-
      [G-10] closed 2026-08-18. Its header in ARCHITECTURE.md said open while
      its own body and six other files said closed. Corrected 2026-08-19.

  - pattern: 'cargo test .*\|\| true'
    reason: >-
      The `|| true` on `make test` was removed 2026-08-16; the exit status is
      real. Any document describing it as still swallowed is stale.

  - pattern: 'The complete residual list, so that nobody has to take the absolute phrasing on trust'
    reason: >-
      That table listed four paths gated on NOTHING and missed four gated on a
      capability equivalent to nothing -- SYS_OPEN, ramfs create/list and
      SYS_READ fd>=3, all on cspace slot 3 with SC_ANYTYPE ([H-3], 2026-08-22).
      A list that calls itself complete must have been derived from the dispatch
      table, not read off it by eye. Reworded rather than re-asserted.

  - pattern: 'ROOT ONLY \(uid==0\)'
    reason: >-
      SYS_DMESG has been gated on CAP_KERNEL_LOG + READ since [I-1]; the
      dispatch table is the truth and docs/SYSCALLS.md already said so. This
      phrasing survived in include/syscall.h -- the header every userspace
      program includes -- as the last ambient-uid-0 claim in the tree,
      contradicting S18. Corrected 2026-08-22. No syscall in this system is
      authorised by the caller's uid.

  - pattern: 'demand 76 of 76|require 76 of 76|of 76\*\* implemented syscalls'
    reason: >-
      The implemented-syscall count was 76 only because three syscalls with real
      handlers were bare numeric literals in the dispatch table and the
      derivation could not see them. It is 81, and the denominator is a declared
      claim now rather than a constant inside its own checker. Corrected
      2026-08-22.

  - pattern: 'receive still polls an empty queue instead of blocking'
    reason: >-
      SYS_IPC_RECV_BLOCK landed with roadmap 1.3 and sleeps on an empty queue;
      smoke-recvblock proves it made exactly one receive syscall per message.
      site/index.html still called it Partial on that ground. Corrected
      2026-08-22.

  - pattern: 'host-side scratch code; built by no target and run by no workflow'
    reason: >-
      The repository layout table advertised tests/ as dead weight. Either it is
      wired to a target or it does not belong in the table. Corrected 2026-08-21.

  - pattern: 'This table is the complete list — if you'
    reason: >-
      docs/BUILDING.md asserted its defect-flag table was complete while three
      DEFECT_FLAGS members had no row (RESUME_RSP_INJECT, RESUME_RSP_INJECT_PRECLAIM,
      WAL_CRASHTEST). The claim is now derived by tools/check_defect_flags.py rather
      than asserted. Corrected 2026-08-21.

  - pattern: 'docs/AUDIT-2026-07(-27)?\.md|docs/proposals/console-server\.md'
    reason: >-
      The two audits were merged into docs/AUDIT.md (the July 2026 one is Appendix A)
      and the console-server document moved to docs/design/, since it describes what
      was built rather than a proposal. Corrected 2026-08-21.

  - pattern: '^\| after \| 30 \| \*\*0\*\* \|$'
    reason: >-
      TESTS.md presented "after: 30 runs / 0 failures" as establishing the
      scheduler claim fix. Thirty boots has ~26% power against a 1%-per-boot
      event, so it established only that the ~50% impersonation false positive
      had stopped. A sample size stated without its detection power is a claim
      about absence that the sample cannot support. Corrected 2026-08-21, when
      the invariant fired again in the default boot workload.

  - pattern: 'always a CPU that has gone idle while'
    reason: >-
      [G-9]'s signature was recorded as a claim held by an IDLE cpu. Every
      capture on 2026-08-21 shows the holder running another LIVE task, with no
      deferred debt and no impersonation -- which is what moved the search off
      the deferred-release machinery two fixes had already targeted. Corrected
      2026-08-21; the idle shape was one observation, not the definition.

  - pattern: 'S20 park path; ADVISORY'
    reason: >-
      smoke-kstack-park's job name carried "ADVISORY -- open finding G-9" in the
      status-check context itself. Both halves went false on 2026-08-21 when [G-9]
      closed and 2026-08-22 when the gate was promoted. Renamed in the one window
      where it was free: the context was not yet in the ruleset, so no
      demotion-then-promotion was needed. Corrected 2026-08-22.

  - pattern: 'ADVISORY, NOT GATING'
    reason: >-
      smoke-kstack-park's job in ci.yml carried this header, and a job-level
      continue-on-error under it, for the whole window after #190 promoted the job
      to required -- so GitHub required a context that reported SUCCESS however the
      steps exited. Corrected 2026-08-22; tools/check_ci_gating.py now refuses the
      combination, so the phrasing cannot come back attached to a required job.

  - pattern: 'the collision was impossible there'
    reason: >-
      How #193 read the control arm's misses: one park in the boot, so two CPUs
      could not have shared a stack. Those boots had DIED -- KERNEL FATAL EXCEPTION
      and PROC_SELFTEST: FAIL -- so the path was never exercised to the end. The
      difference matters because "impossible" invited treating the boots as
      independent draws. Corrected 2026-08-22.

  - pattern: 'run in 65000'
    reason: >-
      The independence argument built on the reading above: at 75% per boot a clean
      sweep of 8 is 0.25^8. The misses share a cause whose rate is set by the host's
      timing, so they are not independent -- the same arm went 8 for 8 on a CI
      runner. Withdrawn 2026-08-22; a bigger N cannot fix a biased sample.

  - pattern: 'two workloads this project tracks'
    reason: >-
      site/index.html described the syscall-coverage measurement as running over
      two workloads. It has run over three since the boot-modules session was
      added -- the number the measurement is taken from, stated wrong on the one
      page a reader outside the repository sees. It went unnoticed because the
      figure beside it, "54 of 81", WAS gated and WAS right: a checked number
      lends its credibility to the unchecked sentence around it. Corrected
      2026-08-27, and the remainder it introduces is now derived (syscalls_uncovered).

  - pattern: 'slot 8 READ, else slot 3 READ'
    reason: >-
      docs/SYSCALLS.md stated SYS_GET_LINE's authorisation this way, and it was
      accurate until 2026-08-24 -- an untyped cap_lookup on the legacy CAP_FRAME
      every task is born holding, as a fallback for CAP_CONSOLE, on console INPUT
      ([H-3]'s sixth door, S28). The handler was fixed that day and this row was
      not, so for three days the ABI reference published the retired authority as
      current. Corrected 2026-08-27.
