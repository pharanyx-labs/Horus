- id: revoke-tally-direction
  harness: revoke_counts_exactly_the_pipe_ends_it_removes
  file: rust/src/capability.rs
  defect: the direction is read from the READ right, so a writer end with READ is counted as a reader
  find: '        let writer = usize::from(c.rights & CAP_RIGHT_WRITE != 0);'
  replace: '        let writer = usize::from(c.rights & CAP_RIGHT_READ == 0);'
- id: revoke-tally-generation-unmixed
  harness: revoke_counts_exactly_the_pipe_ends_it_removes
  file: rust/src/capability.rs
  defect: ends of two generations of one pipe slot are recorded as the first one's, so the C side would subtract a dead pipe's ends from the live one (S139)
  find: '            *seen = PIPE_TALLY_GEN_MIXED;'
  replace: '            let _ = PIPE_TALLY_GEN_MIXED;'

- id: lookup-typed-ignores-type
  harness: lookup_typed_returns_only_what_was_asked
  file: rust/src/capability.rs
  defect: the typed resolver returns the capability whatever its type, so a frame answers a request for an endpoint
  find: '    if expected_type != CAP_ANYTYPE && (*p).typ != expected_type {'
  replace: '    if false && (*p).typ != expected_type {'
- id: ipc-index-unbounded
