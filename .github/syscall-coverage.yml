# Which syscall HANDLER BODIES a tracked workload actually enters.
#
# Not "is the syscall named by a test" and not "does it return success" --
# entered. That distinction is the whole reason this file exists. `captest` is a
# REFUSAL suite by construction: its two checks naming SYS_DMESG and
# SYS_AUDIT_DIGEST both assert SYS_ERR_PERM, and the central capability gate
# returns before the handler runs. Both syscalls were "tested"; neither handler
# had ever executed; and issue #176 -- a pointer truncation in both wrappers,
# 100% reproducible for every static buffer in the system -- was invisible to
# all 100 checks.
#
# The tracked workloads are the three in `make smoke-syscall-coverage`: the full
# ring-3 session (tools/session_test.py), the capability conformance suite, and
# the boot-modules session (tools/modules_session.py), which is the only image
# with real programs in /bin and therefore the only one that can run a pipeline.
# Their union is MEASURED on every run by tools/check_syscall_coverage.py, which
# fails if:
#   - an implemented syscall is in neither list (an unanswered question, the
#     [C-6] failure mode applied to test coverage);
#   - a syscall listed `covered` is NOT entered (a test quietly stopped
#     exercising it);
#   - a syscall listed `uncovered` IS entered (the reason has gone stale and it
#     should be promoted).
#
# This does not demand every syscall be covered. It demands that the number be
# decided rather than drifting, and that every gap be written down.
#
# The `uncovered` reasons say why the TRACKED WORKLOADS do not reach each one.
#
# Ten of them used to name another build that supposedly would, as unmeasured
# hypotheses. All ten were measured on 2026-08-20 by booting those builds under
# SYSCALL_COVERAGE=1, and each now records what was OBSERVED rather than what was
# assumed. Six were confirmed; FOUR WERE WRONG -- SIGNAL_SELFTEST does not drive
# sigaction or sigreturn (it passes while entering only syscalls 0 and 11), and
# IRQ_POLICY_AUDIT does not drive SYS_IRQ_POLICY_INFO. Two more, SYS_EXEC and
# SYS_EXEC_IMAGE, are reached by no build known in this tree.
#
# The confirmed ones are NOT promoted to `covered`, and the reason is a cost
# judgement rather than a doubt: `covered` means "a TRACKED arm enters it", and
# each of those builds is a full kernel build plus a boot on every run.
#
# WHAT ADDING ONE WOULD BUY IS NOW ALMOST NOTHING, and that is the 2026-08-30
# sweep's doing rather than a change of mind. PROC_SELFTEST was the one worth its
# cost at 4 promotions; three of its four (SYS_SIGACTION, SYS_SPAWN_ARG,
# SYS_TASK_EXIT_INFO) are SC_NONE and were promoted that day from captest for the
# price of a probe, leaving it SYS_EXEC_NAMED alone. IRQ_SELFTEST is at zero --
# both syscalls it was cited for were promoted on 2026-08-28 when the device gate
# moved into the handlers. FORK_SELFTEST and SHLIB_SELFTEST would buy one each.
# Read those numbers off the `uncovered` entries below, which name the build for
# each; do not copy them from this paragraph, which has been wrong before.
#
# PROC_SELFTEST additionally must not be added yet: its workload still trips
# [G-9] on ~7% of boots, so it would make this gate intermittently red for a
# reason that is not about coverage.

# Compiled only under a flag, so no tracked workload can enter them and neither
# `covered` nor `uncovered` can describe them. Declaring them here is what keeps
# them countable: the checker requires every guarded entry to appear, with the
# flag that guards it, and fails if one becomes unconditional -- a syscall
# re-entering the shipped surface is a change in attack surface, not a
# documentation detail.
#
# Until 2026-08-23 the deriver read the table as flat TEXT, so all of these
# counted toward `implemented` and described a build nobody has ever booted. The
# note that recorded that blind spot lived next to SYS_OPEN and named the wrong
# three -- 15 and 16 were bare numeric entries the regex never matched at all, so
# the overstatement was SYS_OPEN, SYS_PREEMPT_TRACE and SYS_IRQ_POLICY_INFO. An
# unenforced note is worth exactly that much, which is why this is a rule now.
conditional:
  SYS_OPEN:
    flag: RAMFS_SLOT3_GATE
    reason: >-
      RETIRED 2026-08-22 ([H-3]). In the ship build the syscall fails closed at SYS_ERR_NOSYS; the entry comes back only under the defect arm, which is what makes `make smoke-passwd-probe-control` a measurement
  SYS_RAMFS_CREATE:
    flag: RAMFS_SLOT3_GATE
    reason: >-
      RETIRED 2026-08-22 ([H-3]), syscall 15. One of the four doors gated on cspace slot 3 with SC_ANYTYPE, which the legacy CAP_FRAME satisfies. Named 2026-08-23; it was a bare `[15]` and invisible to this manifest
  SYS_RAMFS_LIST:
    flag: RAMFS_SLOT3_GATE
    reason: >-
      RETIRED 2026-08-22 ([H-3]), syscall 16. As SYS_RAMFS_CREATE -- it enumerated the store the user database was written into. Named 2026-08-23
  SYS_EXEC_LEGACY:
    flag: LEGACY_SYSCALLS_PRESENT
    reason: >-
      RETIRED 2026-08-23. Syscall 14 created a TASK, authorised on cspace slot 3 with SC_ANYTYPE -- the legacy CAP_FRAME every task is born holding, which is [H-3]'s shape on a door that sweep could not see, because the entry was written `[14]` and matched none of the `[SYS_NAME]` patterns. Measured before removal: passwdprobe, uid 1000 with no delegated capability, called it and was handed task id 2. create_task assigns no uid, so the task it made had no identity of its own
  SYS_CLEAR:
    flag: LEGACY_SYSCALLS_PRESENT
    reason: >-
      RETIRED 2026-08-23. Syscall 5 cleared the kernel VGA text buffer, which console_server has owned since it took the framebuffer. No userspace wrapper existed anywhere in the tree
  SYS_SYSINFO:
    flag: LEGACY_SYSCALLS_PRESENT
    reason: >-
      RETIRED 2026-08-23. Syscall 6 returned a version string, with no userspace wrapper anywhere in the tree -- reachable only by issuing the raw number
  SYS_DEBUG_EXEC:
    flag: DEBUG_SHELL || LEGACY_SYSCALLS_PRESENT
    reason: >-
      Syscall 7 hands 127 ring-3 bytes to the in-kernel debug shell with SC_NONE, no capability at all. That is the extra surface a DEBUG_SHELL build is documented to carry, so since 2026-08-23 the ENTRY exists only in such a build; before that it was unconditional and only the handler body was guarded, so the ship kernel dispatched it, copied from the user, and returned -1
  SYS_PREEMPT_TRACE:
    flag: PREEMPT_SELFTEST
    reason: >-
      MEASURED 2026-08-20: entered by a PREEMPT_SELFTEST=1 boot, which enters exactly 1 syscall -- the worst ratio on this list. Test-only trace hook, absent from the ship kernel
  SYS_IRQ_POLICY_INFO:
    flag: IRQ_POLICY_AUDIT
    reason: >-
      MEASURED 2026-08-20: NOT entered even by an IRQ_POLICY_AUDIT=1 boot, which an earlier entry claimed would reach it. Nothing in that image calls it

covered:
  # Promoted 2026-08-30. All twelve are `SC_NONE` dispatch rows, and that single
  # structural fact is the whole reason they could be promoted at once: an
  # SC_NONE row means the central check in syscall_handler admits every caller
  # and whatever authority the call needs is tested INSIDE the handler. So the
  # handler body is reachable from ring 3 by a task holding nothing, and a
  # captest probe that proves the call says no is a probe that ran the body.
  #
  # That is not a new argument here. It is the one that carried SYS_GET_LINE in
  # 2026-08-24, the device family in 2026-08-28, and S52's cap trio in
  # 2026-08-29 -- three promotions in a row, each written up below as "the same
  # structural reason". What had not happened was ASKING THE QUESTION OF THE
  # WHOLE LIST. Of the 26 syscalls sitting in `uncovered`, fourteen were SC_NONE,
  # and their reasons had all been written about the SUCCESS path instead: no
  # CAP_UNTYPED to retype a frame from, no pipeline in the session, login reads
  # its password elsewhere. Every one of those sentences is true and none of
  # them is about whether the body runs -- which is the distinction the header
  # of this file says the file exists to preserve. It had drifted in its own
  # reasons while enforcing itself perfectly on its numbers.
  #
  # Two of the fourteen are NOT promoted, and they are why this was measured
  # rather than argued:
  #   - SYS_GET_PASS blocks. See its entry below; the first draft of the probe
  #     hung the gate.
  #   - SYS_SHLIB_INFO would enter a body that returns at its first line,
  #     because shlib_active() is false in every tracked image. Entering it
  #     would raise this file's number without running the gate the syscall is
  #     interesting for. See its entry below.
  # Those two are the boundary of the technique, and stating it is the point:
  # "the body was entered" stops being coverage when the body is one branch of
  # a feature that is compiled out.
  #
  # Witness: captest section 13. Falsified by SYSCOV_PROBES_ABSENT=1, which
  # compiles that section out and must turn this gate red naming these twelve --
  # without which a promotion that was free all along would look identical to
  # one the probes earned.
  - SYS_READ                 # fd 3 (the retired [H-3] ramfs door) and fd 1
  - SYS_BRK                  # brk(0), the query form, which does not move it
  - SYS_SIGACTION            # a handler address outside the caller's own image
  - SYS_SIGRETURN            # the table stub: a resume with nothing to resume to
  - SYS_SPAWN_ARG            # answers about the caller; read twice for stability
  - SYS_TASK_EXIT_INFO       # likewise
  - SYS_IPC_REPLY            # empty slot and wrong-type slot, both refused
  - SYS_MAP_FRAME            # empty slot, the legacy slot-3 decoy, and W^X
  - SYS_UNMAP_FRAME          # empty slot
  - SYS_MAP_REGION           # a zero-length run, and an empty slot
  - SYS_FRAME_PAGES          # empty slot, and the legacy slot-3 decoy
  - SYS_REGISTER_STORAGE_BACKEND  # retired syscall 46; must still fail closed

  # Promoted 2026-08-30, and by a different route from the twelve above: this one
  # was never a question of authority. Its reason said "fs_server inode teardown;
  # not reached by either workload's file operations", which was true and was a
  # gap in THE SCENARIO. fs_server holds the CAP_ENCRYPTED_STORAGE the syscall is
  # gated on and calls it on the unlink path, so the handler was one shell command
  # away from running on every session boot -- the scenario created files (mkdir,
  # echo >, cp, mv) and never destroyed one. tools/session_test.py now runs `rm`
  # and asserts with `stat` that the name stops resolving.
  #
  # This is the shape LIMITATIONS.md 1.8 meant by "a gap in the workload, not the
  # kernel". SYS_FS_INODE_LINK is the same shape and is NOT done, because no shell
  # command makes a hard link; it needs a new command, not a new line in a test.
  - SYS_FS_INODE_FREE
  # Promoted 2026-09-01, and they are the two this whole file was written about.
  # SYS_DMESG and SYS_AUDIT_DIGEST are the pair issue #176 truncated; SYS_DMESG
  # has been `covered` since the manifest existed and its sibling had never run.
  #
  # Neither moved on an argument. Both carry { slot 7, READ, CAP_AUDIT } in the
  # dispatch table, so the central gate refuses captest first and no reading of
  # the table could promote them -- what they needed was a task that HOLDS the
  # capability, which the entry below said in as many words and nobody had
  # written. userspace/auditprobe.c is that task: a SECOND task in the
  # CAPTEST_SELFTEST image, uid 1000, holding one CAP_AUDIT at slot 7 and nothing
  # else. captest's own cspace is untouched, because endowing the one task whose
  # job is to hold nothing would have traded the property for the number.
  #
  # ENTERING THEM FOUND A DEFECT ON THE FIRST BOOT, which is what LIMITATIONS.md
  # 1.8 stopped calling a hypothetical on 2026-08-29 and is now the second time
  # it has been right. `struct audit_event` was declared twice -- 256 bytes in
  # the kernel, 72 in ring 3, one name -- and h_read_audit copied the kernel's
  # size at the kernel's stride into an array sized with the other, misreading
  # every field and writing 184 bytes past the array per record. Fixed by
  # include/audit_abi.h, one declaration both rings compile.
  #
  # Witness: make smoke-auditprobe. Falsified by AUDIT_ABI_LEGACY=1 (the defect,
  # both halves) and SYSCALL_PTR_TRUNC32=1 (#176 itself, whose runtime arm had
  # only ever reached SYS_DMESG).
  - SYS_AUDIT_DIGEST
  - SYS_READ_AUDIT
  # Promoted 2026-08-29 with S52, and the promotion is the point rather than a
  # side effect. All three were listed below as "not entered by any tracked
  # workload, and by no build known in this tree" -- and all three reached a
  # helper that spun forever on a NULL capability lookup while holding cap_lock
  # with interrupts masked. The defect survived because nothing ran the handlers,
  # so the fix is not finished until something does. captest's section 12 hands
  # each of them a source slot it does not hold and requires the refusal to come
  # back, which enters all three bodies.
  - SYS_CAP_MINT
  - SYS_CAP_TRANSFER
  - SYS_CAP_MOVE
  # Entered by captest since 2026-08-24, and the reason is the distinction this
  # whole file rests on: the handler is ENTERED, not satisfied. SYS_GET_LINE's
  # dispatch entry is SC_NONE, so the central gate admits every caller and the
  # authority test lives inside h_get_line -- which means captest's check that a
  # task holding no CAP_CONSOLE is REFUSED still runs the handler body. A
  # syscall can be covered by a test that proves it says no.
  - SYS_GET_LINE
  # Promoted 2026-08-28, and for exactly SYS_GET_LINE's reason one syscall over.
  # The device syscalls lost their fixed dispatch-table slots when a CAP_IO_DEVICE
  # started naming a device (S43), so the central gate admits every caller and the
  # authority test lives inside the handler -- which means captest's checks that a
  # task holding NO device capability is refused now run these handler bodies.
  # Their `uncovered` reasons named IRQ_SELFTEST as an untracked build that would
  # reach them; that reason went stale in the same commit that moved the gate, and
  # this file is what noticed.
  - SYS_IRQ_REGISTER
  - SYS_DEVICE_INFO
  # Same story again, one commit later, and for the same structural reason: these
  # two are SC_NONE like the rest of the device family, so captest's checks that a
  # task holding no CAP_IO_DEVICE is refused run their handler bodies. Covered
  # from the day they landed rather than after a promotion, which is what this
  # file is for -- SYS_DEVICE_ENABLE especially, since it is the call that turns a
  # device into a bus master (S44) and the one whose gate is worth exercising on
  # every run.
  - SYS_DEVICE_ENABLE
  - SYS_DMA_ADDR
  # Same reason a third time: SC_NONE, so captest's checks that a task holding no
  # CAP_IO_DEVICE cannot re-enable an interrupt line run the handler body. Worth
  # having on every run rather than only in the NET_SELFTEST build -- this is the
  # call that decides a device may interrupt the machine again (S46).
  - SYS_IRQ_ACK
  # Entered by captest's three poll checks -- two refusals and, importantly, one
  # POSITIVE: a notification the task does hold answers IPC_AGAIN rather than
  # blocking. That last one is why this is covered by the handler body doing its
  # job rather than only by it saying no.
  - SYS_POLL_NOTIFY
  # Entered by captest's refusals: a task holding no device capability is turned
  # away before anything is programmed. Worth exercising on every run rather than
  # only in NET_SELFTEST, because this is the call that decides which interrupt a
  # device raises (S47).
  - SYS_MSI_REGISTER
  - SYS_CLOCK_GETTIME      # roadmap 2.2; entered by captest's clock checks
  - SYS_CAP_ENUMERATE      # roadmap 3.6; entered by `capview` in the scripted session
  - SYS_YIELD              # measured 2026-08-23 in all three workloads; was a bare `[0]`
  - SYS_EXIT
  - SYS_SBRK
  - SYS_WRITE
  - SYS_WAIT
  - SYS_GET_TASK_INFO
  - SYS_GETPID
  - SYS_IPC_SEND
  - SYS_IPC_RECV
  - SYS_IPC_CALL
  - SYS_NOTIFY
  - SYS_WAIT_NOTIFY
  - SYS_SPAWN
  - SYS_GETUID
  - SYS_AUTH
  - SYS_SUDO
  - SYS_USERADD
  - SYS_USERDEL
  - SYS_PASSWD
  - SYS_REGISTER_FS_SERVER
  - SYS_CONNECT_FS_SERVER
  - SYS_CAP_REVOKE
  - SYS_FS_INODE_ALLOC
  - SYS_FBLOCK_READ
  - SYS_FBLOCK_WRITE
  - SYS_FS_STAT
  - SYS_FS_SET_SIZE
  - SYS_KILL
  - SYS_CAP_GRANT
  - SYS_SIGNAL
  - SYS_SIGMASK
  - SYS_GET_ARGV
  - SYS_SPAWN_IMAGE
  - SYS_SIGALTSTACK
  - SYS_IPC_SENDER
  - SYS_FS_SET_META
  - SYS_IPC_REPLY_TO
  - SYS_BOOT_MODULE_INFO
  - SYS_BOOT_MODULE_READ
  - SYS_MAP_PHYS
  - SYS_IOPORT_GRANT
  - SYS_CONSOLE_OWNED
  - SYS_PIPE
  - SYS_PIPE_READ
  - SYS_PIPE_WRITE
  - SYS_PIPE_CLOSE
  - SYS_STDIO_INFO
  - SYS_DMESG
  - SYS_TASK_RESUME
  - SYS_RETYPE
  - SYS_UNTYPED_INFO
  # Added 2026-08-30 with SYS_UNTYPED_SPLIT itself. captest section 14 splits a
  # sub-region off its own CAP_UNTYPED, retypes from the child, and checks the
  # parent was charged -- so the handler is entered on the SUCCESS path as well
  # as by its four refusals, which is the stronger form of covered.
  - SYS_UNTYPED_SPLIT
  - SYS_IPC_RECV_BLOCK

uncovered:
  # Eleven left, and after the 2026-08-30 sweep they fall into exactly three
  # groups. The grouping is the useful part: it says what each one would COST to
  # cover, which is the question this file is asked when somebody wants the
  # number to go up.
  #
  # (1) THE CENTRAL GATE RETURNS FIRST. These have a real capability in their
  # dispatch row -- a slot, a rights floor and a type -- so syscall_handler
  # refuses an unauthorised caller before the handler body runs. That is issue
  # #176's shape exactly, and it is the group where "captest asserts the refusal"
  # is worth nothing: the refusal is the table's, not the handler's. Covering one
  # means a task that HOLDS the capability calling it, and captest deliberately
  # holds neither CAP_AUDIT nor CAP_ENCRYPTED_STORAGE. Endowing it with them to
  # raise this number would widen the authority of the one task in this tree whose
  # job is to hold as little as possible, so none of these moves without a
  # separate probe task that holds exactly one of them.
  #
  # THE PRESCRIPTION WAS FOLLOWED ON 2026-09-01 and this group is four rather than
  # six. auditprobe holds one CAP_AUDIT and nothing else, so SYS_READ_AUDIT and
  # SYS_AUDIT_DIGEST are `covered` above -- and the first entry into either found
  # a defect. The remaining four are the CAP_ENCRYPTED_STORAGE half; the same
  # prescription applies, and the cost is now known to be one small task rather
  # than a widened captest.
  SYS_ROTATE_KEYS: >-
    dispatch row (slot 8, READ, CAP_CONSOLE), and that row is only the first of two checks -- do_rotate_keys additionally requires CAP_ENCRYPTED_STORAGE before it does anything. captest holds neither
  SYS_BLOCK_READ: >-
    dispatch row (CAPSLOT_AUDIT, READ|WRITE, CAP_ENCRYPTED_STORAGE). A raw block read beneath the filesystem; the tracked workloads reach storage through fs_server's higher-level calls, and fs_server itself has no reason to bypass its own layer
  SYS_BLOCK_WRITE: >-
    dispatch row (CAPSLOT_AUDIT, READ|WRITE, CAP_ENCRYPTED_STORAGE), as SYS_BLOCK_READ
  SYS_FS_INODE_LINK: >-
    dispatch row (CAPSLOT_AUDIT, READ|WRITE, CAP_ENCRYPTED_STORAGE). fs_server HOLDS that capability, so unlike its neighbours in this group the gate would pass -- the gap is that nothing asks it to make a hard link. Its sibling SYS_FS_INODE_FREE was in this position until 2026-08-30 and moved for the price of one `rm` in the session; this one needs a shell command that does not exist, which is a feature rather than a test

  # (2) THE GATE IS THE [C-1] DECOY, AND THE CALL WOULD SUCCEED. These carry
  # (slot 3, WRITE|EXEC, SC_ANYTYPE) -- the legacy CAP_FRAME every task is born
  # holding, which is not a gate at all (docs/LIMITATIONS.md 1.6b, and the
  # 2026-08-30 audit's finding 4.1). So captest PASSES the table check on all
  # five. What stops a probe is the opposite of the group above: not that the
  # call would be refused, but that it would WORK -- replacing the caller's image
  # or duplicating the caller -- and a conformance suite that execs itself away
  # has no section 14. They are covered by their own selftest builds instead,
  # which are full kernel builds plus a boot and are therefore not tracked arms.
  SYS_FORK: >-
    MEASURED 2026-08-28: not entered by the tracked workloads -- nothing in a tracked image forks, because fork's only client so far is its own witness. Entered by FORK_SELFTEST, which is its gate (make smoke-fork, plus four control arms). A captest probe would pass the slot-3 check and then actually fork captest
  SYS_EXEC_NAMED: >-
    MEASURED 2026-08-20: entered by a PROC_SELFTEST=1 boot, which is not a tracked arm. Also gated by make smoke-forkexec since 2026-08-28 (S42). A probe would replace captest's image
  SYS_EXEC: >-
    MEASURED 2026-08-20: NOT entered by any of PROC_SELFTEST, SIGNAL_SELFTEST, PREEMPT_SELFTEST, IRQ_SELFTEST or IRQ_POLICY_AUDIT. No build in this tree is known to reach it, and it has no userspace wrapper -- a live handler with no caller, which is the state SYS_EXEC_LEGACY, SYS_CLEAR and SYS_SYSINFO were retired from on 2026-08-23
  SYS_EXEC_IMAGE: >-
    MEASURED 2026-08-20: NOT entered by any of the five selftest builds tried. No build in this tree is known to reach it, as SYS_EXEC
  SYS_RECEIVE_PROGRAM: >-
    receives a program image over IPC; no tracked workload provisions a program this way. Same dispatch row as its neighbours here, so the same two facts hold: the slot-3 check does not stop a caller, and a successful call arms an image

  # (3) SC_NONE, AND STILL NOT PROBEABLE. The sweep of 2026-08-30 promoted twelve
  # SC_NONE handlers on the argument that the dispatch table admits everyone, so
  # a refusal test runs the body. These two are where that argument stops, and
  # they are recorded at length because the argument is otherwise a licence to
  # promote anything.
  SYS_GET_PASS: >-
    SC_NONE, so the body IS reachable by any caller -- and it BLOCKS. Its only early return is console_hw_owned(), and no ring-3 server owns the UART in the captest image, so the call reaches console_getc() and waits for a keystroke. MEASURED 2026-08-30, by writing the probe: it hung smoke-captest for the full 40s timeout with no marker. This is the difference from SYS_GET_LINE, which looks identical from the dispatch table and is `covered`: h_get_line tests CAP_CONSOLE inside the handler and refuses captest outright, where h_read's fd 0 branch and this one test no authority at all. Covering it needs a workload where a console server owns the UART, or a non-blocking branch this syscall does not have
  SYS_SHLIB_INFO: >-
    SC_NONE, so a probe would enter the body -- and the body returns at its FIRST LINE, because shlib_active() is false in every tracked image. Marking it covered on that basis would raise this file's number without ever running the capability gate the syscall is interesting for (S51, plus the SHLIB_INFO_UNGATED and SHLIB_INFO_TYPE_ONLY arms). "The body was entered" stops being coverage when the body is one branch of a feature compiled out, and this is the entry that says so. It IS entered on every boot of a SHLIB_SELFTEST build, by both shlibtest and shlibpeer, which is what make smoke-shlib asserts. It moves to `covered` when the shared library becomes part of an ordinary image, which is roadmap 2.5's remaining half
