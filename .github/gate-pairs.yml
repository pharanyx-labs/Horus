# Which smoke-* target is a control arm, and which base gate each one extends.
#
# WHY THIS FILE EXISTS. tools/check_gate_pairs.py used to decide "is this a
# control arm" by testing whether the string `control` appeared in the target
# NAME. Four falsification arms are named otherwise -- smoke-kfault-legacy and
# the three smoke-resume-guard-{legacy,nofloor,preclaim} -- and were counted as
# base gates. Nothing was left unprotected by that: all four run in CI and assert
# their markers exactly as a `-control` arm does. What was wrong was the COUNT,
# and both figures it produced are published and gated by doc-claims, so a
# documented number rested on a string match.
#
# WHY IT IS DECLARED RATHER THAN DERIVED. Three derivations were tried and each
# is wrong in a different direction, measured 2026-08-30:
#
#   by NAME       69 arms, missing the four above
#   by BUILD      87, because DEFECT_FLAGS holds instruments and policy opt-ins
#                 as well as defects. KSTACK_RACE_WIDEN, RNG_UNSEEDED_PROBE,
#                 SYSCALL_COVERAGE and KSTACK0_PARK_TRACE are each called "not a
#                 defect" in CLAUDE.md, and two are deliberately set in BOTH arms
#                 of a pair. smoke-heap64 and smoke-rng-seed are base gates that
#                 boot a defect-exposing configuration on purpose.
#   by ASSERTION  17 disagreements: many arms drive a bespoke script rather than
#                 tools/smoke_test.sh, so there is no marker to read.
#
# The distinction is a statement about INTENT -- does this target exist to prove
# the defect reproduces, or to prove the property holds -- and intent is not
# recoverable from the Makefile. So it is written down, the same bargain
# .github/ci-gating.yml makes for jobs: a target may be either, but not
# silently. check_gate_pairs.py fails the build if any smoke-* target is absent
# from this file, so a new one cannot inherit a classification by being named
# like an old one.

