# Exempt, each with the reason it cannot or should not gate a merge.
advisory:
  fuzz: >-
    Advisory by design. cargo-fuzz runs each target for a fixed 30-second
    budget, so a green result means "no crash found in 30 seconds", not "no
    crash exists". Time-boxed search is evidence of effort, not of absence, and
    gating on it would convert a scheduling hiccup into a merge block while
    adding no assurance. A crash it does find is a finding to triage, not a
    check to re-run.

  smoke-kstack-park: >-
    [G-9] Its workload -- PROC_SELFTEST at -smp 4 -- trips a PRE-EXISTING
    scheduler claim leak on roughly 40% of boots, so the gate reddens for a
    defect it does not test. Measured 2026-08-17: 9 failures in 20 boots at
    -smp 4 against 0 in 20 at -smp 1, and 8 of those 20 reported
    "stale scheduler claim at preempt_on_tick" under SCHED_INVARIANTS. The
    pre-#162 release timing gives 10 in 20, so this is not caused by the [G-8]
    fixes. The S20 park property it checks is real and the control arm still
    reproduces the defect on demand; what is not sound is requiring a workload
    nothing had ever run at -smp 4 before this gate. Promote it in the same
    commit that closes [G-9], and quote a rate.
    NARROWED 2026-08-17 and STILL ADVISORY. [G-9] was a cluster. Its exec
    hand-off component -- a single global g_exec_reenter_task consumed on the
    exit of every syscall on every CPU -- is fixed, falsified with
    EXEC_REENTER_GLOBAL=1 (0 thefts in 30 boots against 5 in 20), and is now
    gated by smoke-exec-reenter. With [G-10]'s page-table half fixed the same
    day, the workload went from ~45-50% failing to 2 boots in 30 (~7%). That is
    an improvement and not a close: the residue is a bogus resume %rsp handed
    back by the dispatcher -- the rest of [G-9], and not what this gate tests.
    A gate that reddens for a defect it does not test teaches the re-run reflex,
    which is exactly what this exemption exists to avoid, so it stays until
    [G-9] is closed rather than merely narrowed.
    NARROWED AGAIN 2026-08-17 and STILL ADVISORY. [G-10]'s page-table
    use-after-free is fixed too -- create_user_pagedir was recycling a slot's
    page tables while another CPU still had them in CR3 -- and that took the
    workload to 2 failures in 30 on the ship config this gate builds (~7%, from
    ~45%). `make smoke-kstack-park` now passes in its exact form. It is still not
    zero: the remainder is a bogus resume %rsp of -7. Promote this when that is
    closed and the rate is 0 over 30, not before -- 7% is one reddened pull
    request in fourteen, which is exactly the re-run reflex.
    GUARD FIXED 2026-08-18, RATE UNCHANGED, STILL ADVISORY. The clause above
    said the -7 was one the floor guard "misses because it tests only a lower
    bound". That was true when written and is not now: resume_rsp_is_bogus()
    tests against [__bss_start, __bss_end) at both ends, so -7 is rejected and
    reported rather than loaded, falsified with RESUME_GUARD_FLOOR_ONLY=1. That
    changes what a failing boot TELLS you, not how often one fails -- the guard
    is a detector, and what produces -7 is still unknown. So the rate stays ~7%,
    the promotion condition is unchanged, and this exemption stands.

  ruleset-audit: >-
    Schedule-only (daily cron plus workflow_dispatch), so it never runs on a
    pull request and has no conclusion to gate one with. It is listed here
    rather than excluded from the checker so that deleting it trips ci-gating:
    it is the job that verifies this file against the live ruleset, which is
    the last open half of [C-6], and a control that can be removed silently is
    the defect that finding describes. It fails loudly if its GitHub App
    credential is unconfigured rather than skipping.

  kani: >-
    Manual-only and skipped on ordinary runs (see its `if:` guard), so it has no
    conclusion to gate on. The proofs it runs are real assurance but too slow
    for every push; they are exercised deliberately rather than continuously.
