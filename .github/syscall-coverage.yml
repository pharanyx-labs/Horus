uncovered: {}
  # EMPTY SINCE 2026-10-14: every implemented syscall's handler body is entered by
  # a tracked workload (docs/LIMITATIONS.md 1.8, closed). The checker still fails
  # on an implemented syscall in neither list, so a new syscall lands here with a
  # reason or in `covered` with a workload that enters it.
  #
  # What each kind of gap has cost to close, which is the question this list is
  # asked when somebody wants to park an entry here:
  #
  # (1) THE CENTRAL GATE RETURNS FIRST: a real capability in the dispatch row, so
  #     a refusal is the table's and the body never runs (issue #176's shape).
  #     Closed by a probe task holding exactly that capability and nothing else
  #     (auditprobe, blockprobe, execprobe, formatprobe), never by endowing
  #     captest, whose refusals are only worth anything because it holds nothing.
  # (2) THE CALL WOULD SUCCEED and replace or duplicate the caller. Closed by a
  #     refusal inside the body (captest (h)) or by making the successor image
  #     the second half of the probe (execprobe).
  # (3) SC_NONE BUT NOT REACHED: compiled out of the tracked images, or blocking
  #     because it asked for no authority. Closed when the feature shipped in a
  #     tracked image, or when the call began to ask.
  # (4) NOT YET USED BY A TRACKED CLIENT. Closed by a refusal in the body
  #     (captest (g)) until a session called through it.
  #
  # A call whose body DESTROYS something is not a reason to leave it here. The
  # format's body refuses before it writes, so formatprobe enters it with calls
  # that are each one argument away from one it would authorise; the entry
  # this list carried until 2026-10-14 said the opposite.
