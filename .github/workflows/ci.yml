  smoke-session-smp-soak:
    name: SMP session soak (N consecutive boots; GATING since [G-8] closed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # GATING as of 2026-08-17, restored in the commit that closed finding G-8 --
    # which is what TESTS.md, this file and the Makefile have each required since
    # 2026-08-09: "restore it to gating in the same commit that resolves G-8,
    # either way -- and quote a rate, not a green run."
    #
    # The rate. G-8 was a task published as claimable while the CPU that gave it up
    # was still executing ISR C frames on its kernel stack; another CPU took it,
    # resumed it to ring 3, and its next trap rewrote those frames. Paired,
    # adjacent-boot alternating, 1600 boots at -smp 4: the pre-fix release site
    # (KSTACK_RELEASE_EARLY=1) failed 31/800, the shipped deferred release 0/800.
    # Fisher exact two-sided p = 6.9e-10. See TESTS.md.
    #
    # This job is now an ordinary regression gate: it no longer carries a known-open
    # finding, so a red run means something changed. It stays a soak rather than a
    # single boot because the defect class it covers is probabilistic, and one green
    # boot is not evidence about a 2-3% event -- that is how the lost-reply race
    # survived every green smoke job.
    #
    # NOT continue-on-error. Never re-run it: the re-run reflex is exactly how
    # smoke-console-smp's deadlock survived months of CI. A red soak is a finding.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # A 1-in-5 hang passes a single boot four times out of five, which is how the
      # lost-reply race survived every green smoke job. Only repetition witnesses it.
      # Raised 15 -> 45: at the ~3% rate measured for G-8, 15 boots witness it only
      # ~37% of the time, so an advisory job at 15 would mostly report nothing at
      # all. 45 boots reach ~75%, and the job is advisory, so a red one costs a read
      # rather than a re-run. Each boot is a few seconds.
      - name: Run SOAK_RUNS SMP sessions; any single hang fails the gate
        run: make smoke-session-smp-soak SOAK_RUNS=45
      # G-8 is rare, and until now every occurrence CI witnessed was destroyed by
      # the harness: the soak kept one reused temp log and printed `tail -20`. On
      # #142 that retained "PAGE FAULT at 0x525c71a094 err=" and discarded the
      # error code, rip, rsp, rbp and the claim line -- the whole payload #140 was
      # added to produce. The full serial of each failing boot is now kept, and
      # uploaded here so a red advisory run yields EVIDENCE rather than a rate.
      #
      # `if: always()` rather than `if: failure()` deliberately. The condition that
      # must never be wrong here is "an occurrence was captured and not uploaded",
      # and always() cannot get that wrong for any reason -- a failing earlier step,
      # a cancellation, a future edit to this job's conditions. The soak removes the
      # directory when every boot passed, so `if-no-files-found: ignore` makes a
      # clean run a no-op.
      - name: Upload the failing boots' serial logs (evidence, not a rate)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: smp-soak-evidence
          path: soak-evidence/
          if-no-files-found: ignore
          retention-days: 90
      # Symbolising against a rebuilt tree has produced a wrong reading of this
      # fault twice (TESTS.md). Ship the exact binary that produced the addresses.
      - name: Upload the kernel.elf that produced those addresses
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: smp-soak-kernel-elf
          path: kernel.elf
          if-no-files-found: ignore
          retention-days: 90

