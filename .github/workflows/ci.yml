  smoke-kfault:
    name: A CPL-0 fault is heard on serial (and the control arm is not)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Fault in the kernel on purpose after the console handover and require the report on serial
        run: make smoke-kfault SMOKE_TIMEOUT=180
      # The control arm, in the same job: without it, a green smoke-kfault is
      # consistent with the gate measuring the existence of the fault rather
      # than where the report went.
      - name: Restore println() reporting and require the report to be INAUDIBLE
        run: make smoke-kfault-legacy SMOKE_TIMEOUT=180

  smoke-resume-guard:
    name: The resume-%rsp floor guard fires and is heard (and both control arms are not)
    runs-on: ubuntu-latest
    # Backstop, not a performance budget: this job normally finishes in
    # minutes. Without it the default is 360, so a runner wedged on its
    # package install idles for six hours and the run never concludes --
    # which cost three runs on 2026-08-19. See CHANGES.md.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Return a bogus resume rsp on purpose and require the guard's PANIC line on serial
        run: make smoke-resume-guard SMOKE_TIMEOUT=180
      # The state another CPU's FATAL exception leaves behind. This is the arm
      # that would have caught G-8's mute guard: before the fix, the report was
      # bracketed fatal=1, lost the permanent claim, and halted without printing.
      - name: Hold the permanent panic claim first and require the report ANYWAY
        run: make smoke-resume-guard-preclaim SMOKE_TIMEOUT=180
      # Both control arms, in the same job. Without them a green run above is
      # consistent with the gate measuring the existence of the injection rather
      # than whether the guard reported it.
      - name: Restore the pre-fix fatal bracket and require the report to be INAUDIBLE
        run: make smoke-resume-guard-legacy SMOKE_TIMEOUT=180
      - name: Compile the guard out and require the report to be INAUDIBLE
        run: make smoke-resume-guard-nofloor SMOKE_TIMEOUT=180
      # The guard's OTHER half. Everything above injects 4, which is below the
      # floor; -7 is 0xFFFFFFFFFFFFFFF9 and sits ABOVE it, so a floor-only test
      # missed the whole negative class. A real boot produced exactly -7.
      - name: Return a NEGATIVE bogus resume rsp and require the guard's PANIC line
        run: make smoke-resume-guard-negative SMOKE_TIMEOUT=180
      - name: Restore the floor-only predicate and require the report to be INAUDIBLE
        run: make smoke-resume-guard-negative-control SMOKE_TIMEOUT=180
      # FALSE POSITIVES. Every arm above injects a bogus value and asks whether
      # the report APPEARS, so a predicate that rejected the entire address space
      # would pass all of them -- and one that rejected the IST stacks did. The
      # ceiling shipped bounded to .bss on the premise that every kernel stack is
      # a .bss array; the IST stacks are in .data, IST1 takes #PF, and the guard
      # halts on rejection, so the kernel died on the first ring-3 page fault of
      # any workload. Ten gates went red and this job stayed green.
      - name: Require the guard to stay SILENT on a legal IST resume rsp
        run: make smoke-resume-guard-ist SMOKE_TIMEOUT=180
      - name: Restore the bss-only bound and require the FALSE rejection to appear
        run: make smoke-resume-guard-ist-control SMOKE_TIMEOUT=180

  smoke-kstack-race:
    name: A task's kernel stack is executed by at most one CPU (S20; and the control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds and two widened sessions. The widening slows every task
    # switch on purpose, so the fixed arm runs a full ~5-minute session here and
    # longer on a runner; the control arm halts as soon as it reproduces and is
    # quick. Budgeted well above measured so a slow runner is not a red gate --
    # a required check that reddens for timing teaches the re-run reflex.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The window between handing a task to another CPU and leaving that task's
      # kernel stack -- finding G-8. Widened with a spin so the race is entered on
      # essentially every switch instead of at ~2-3% per boot, which is what made
      # this cost two 150-boot arms to observe once.
      - name: Widen the window and require the session to complete anyway
        run: make smoke-kstack-race
      # The load-bearing arm. Without it, the step above is consistent with
      # "a kernel with a spin in it still boots". With it, the SAME widened window
      # is fatal at the pre-fix release site and harmless at the shipped one.
      - name: Restore the pre-fix release site and require the race to REPRODUCE
        run: make smoke-kstack-race-control

  smoke-cr3-reclaim:
    name: A slot's page tables are not recycled while a CPU is on them (G-10; control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds plus CR3_RECLAIM_RUNS boots and 3 control boots. The
    # control arm halts as soon as it reproduces, which is every boot.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # create_user_pagedir freed the previous occupant's address space on a
      # uniprocessor argument. A CPU parked in kernel_idle never reloads CR3, and
      # SYS_KILL marks a task dead while it still runs in ring 3 elsewhere, so the
      # frames were recycled under a live core. Finding G-10.
      - name: Require no recycled page table to fault
        run: make smoke-cr3-reclaim
      # The load-bearing arm. Without it the step above is consistent with "this
      # runner never reused a slot".
      - name: Remove the guard and require the free-in-use to REPRODUCE
        run: make smoke-cr3-reclaim-control

  smoke-exec-reenter:
    name: An exec re-entry is consumed by the CPU that armed it (G-9; control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds and 2 x EXEC_REENTER_RUNS boots. Passing boots exit on
    # their marker in ~25s; the control arm halts as soon as it reproduces. The
    # cost driver is the rest of [G-9], which stalls 2 boots in 30 to the 180s budget, so
    # this is sized well above measured rather than tightly.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # g_exec_reenter_task was ONE global consumed on the exit of every syscall
      # on every CPU. An exec armed on one core was taken by another, which
      # claimed the exec'ing task and resumed the frame the exec tail had just
      # built -- while the core that ran the exec was still on it. Finding G-9.
      - name: Require no CPU to take another CPU's exec re-entry
        run: make smoke-exec-reenter
      # The load-bearing arm. Without it, the step above is consistent with
      # "the workload did not happen to exec concurrently on this runner".
      - name: Restore the shared hand-off and require the theft to REPRODUCE
        run: make smoke-exec-reenter-control

  smoke-spawn-owner:
    name: A staged image is spawnable only by the task that armed it (G-11; control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds and two single boots. Both arms are deterministic and
    # exit on their marker in ~25s, so this is the cheapest security gate in the
    # file; the budget is for the builds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The staged image was ambient state: nothing recorded which task armed
      # it, and SYS_SUDO spawns whatever is armed AS UID 0 in a different
      # syscall from the arm -- so a correct password could elevate another
      # task's program. Finding G-11, property S21. The self-test forges a
      # foreign owner, requires the refusal, then re-arms honestly and requires
      # the spawn to succeed: a check that refuses everything is not a check.
      - name: Require a foreign staged image to be refused (and your own accepted)
        run: make smoke-spawn-owner
      # The load-bearing arm. Without it, the step above is consistent with a
      # kernel that never reached the check at all.
      - name: Remove the owner check and require the foreign image to be SPAWNED
        run: make smoke-spawn-owner-control

  defect-flags:
    name: "Every boot states which defect flags built it (and a flag change forces a rebuild)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # A clean kernel must say so POSITIVELY. An absent line is ambiguous
      # between "clean", "the reporting was removed" and "the boot died early".
      - name: A clean build reports no defect flags
        run: make smoke-defect-flags
      # Without this, the gate above is satisfied by a kernel that prints "none"
      # unconditionally.
      - name: An injected build names the flag it carries
        run: make smoke-defect-flags-control
      # THE FOOTGUN: build with an injection, rebuild WITHOUT clean and without
      # the flag. On 2026-08-20 that sequence produced a kernel still carrying
      # KSP_GUARD_INJECT and a false [G-9] "reproduction" at 2 boots in 3.
      - name: A flagless rebuild after an injected one comes out clean
        run: make smoke-defect-flags-rebuild
      # And the arm that proves the stamp is what does it.
      - name: Drop the stamp dependency and require the stale flag to SURVIVE
        run: make smoke-defect-flags-rebuild-control

  ksp-guard:
    name: "A bogus resume %rsp is refused where it is produced (G-9)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # All four switch functions end in the same three lines and every selection
      # loop only required saved_ksp to be NON-ZERO -- and -7 is non-zero. The
      # guard refuses an implausible value and NAMES the producer, so the next
      # reproduction of G-9's residue is a fact rather than a mystery. This is the
      # arm that proves the guard can fire at all.
      # The FALSE-POSITIVE direction, and the one whose absence is a known way to
      # ship a regression: on an ordinary boot every resume value is legal and
      # the guard must stay SILENT. Without this, a predicate that rejected every
      # stack pointer would satisfy the injection arm below perfectly -- which is
      # exactly how the resume-%rsp guard once shipped a bound that rejected the
      # IST stacks and reddened ten gates at once.
      - name: Require the guard to stay silent on a healthy boot
        run: make smoke-ksp-guard
      - name: Forge -7 and require the guard to name task_exit_switch
        run: make smoke-ksp-guard-control

  syscall-coverage:
    name: "Which syscall handlers a test actually enters is decided, not drifting"
    runs-on: ubuntu-latest
    # Two clean builds and two full workloads (a scripted ring-3 session, then
    # the conformance suite). The session is the long pole.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # captest is a REFUSAL suite: its checks for SYS_DMESG and SYS_AUDIT_DIGEST
      # both assert SYS_ERR_PERM, and the capability gate returns before the
      # handler runs. Both syscalls were named by the suite, neither handler had
      # ever executed, and issue #176 -- reproducible for every static buffer in
      # the system -- was invisible to all 100 checks. This measures which
      # handler bodies actually run and fails on drift in EITHER direction.
      - name: Measure handler entry and diff against the manifest
        run: make smoke-syscall-coverage

  gate-pairs:
    name: "Every control arm has a base gate, and every gate runs"
    runs-on: ubuntu-latest
    # Source analysis only -- no build, no QEMU. Seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The control-arm discipline is this repo's answer to "would this gate fail
      # if the property broke", and nothing checked that the pairs stayed intact.
      # smoke-ksp-guard-control was found on 2026-08-21 with no positive
      # counterpart: an arm proving the guard COULD fire, with nothing asking
      # whether it stayed silent on a legal value -- the same missing direction
      # that once let the resume-%rsp guard reject the IST stacks.
      - name: Refuse an orphan control arm, or a gate nobody runs
        run: python3 tools/check_gate_pairs.py

  defer-exemption:
    name: "The claim audit's exemption outlives the release it exempts (G-9; control arm proves it)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # percpu_deferred_release[] IS the auditor's exemption. Clearing it before
      # the lock that drops the claim leaves a window in which the task is
      # claimed, un-exempt and mid-release -- and an audit landing there reports a
      # leak that is not one. The window is widened in BOTH arms so the pair is
      # deterministic rather than a soak.
      - name: The widened window is silent with the exemption held
        run: make smoke-defer-exemption
      - name: Control arm — clear the exemption early and the audit accuses
        run: make smoke-defer-exemption-control

  switch-commit:
    name: "A refused switch leaves no claim behind (G-9 root cause; control arm proves it)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # ksp_refuse() returns 0, which is also task_exit_switch's legal "nothing
      # runnable" return. Committing the switch before validating therefore
      # orphaned the claim on a task the caller then parked away from.
      - name: A refused resume value orphans no claim
        run: make smoke-switch-commit
      - name: Control arm — commit first and the claim is orphaned
        run: make smoke-switch-commit-control

  claim-release:
    name: "A CPU in ring 3 owes no deferred release (G-9 class; control arm proves it)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The claim audit cannot see an unpaid deferred release: it exempts exactly
      # that state as a legitimate mid-handover. So the debt is checked where it
      # is provably settled instead -- at ring 3.
      - name: The invariant holds on a clean build
        run: make smoke-claim-release
      - name: Control arm — strip the release and it must fire
        run: make smoke-claim-release-control

  libhorus:
    name: "The shared userspace runtime keeps its bounds, and refuses rather than spins"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Sharing a runtime concentrates risk: a bug in libhorus now breaks init,
      # shell, fs_server and console_server at once, where a bug in one private
      # copy used to break one program. The shared copy is held to a standard the
      # seven private copies never were.
      - name: libhorus conformance from ring 3
        run: make smoke-libhorus
      # The security half. Without this arm the gate above passes identically
      # against a library that spins on every refusal -- G-8 signature C, where a
      # capability denial is indistinguishable from a hang.
      - name: Control arm — a permanent refusal must not be retried
        run: make smoke-libhorus-retry-control
      # The termination half: strncpy's semantics leave the buffer unterminated
      # exactly when the source did not fit.
      - name: Control arm — ustrncpy must always terminate
        run: make smoke-libhorus-strncpy-control

  vfs:
    name: "Two filesystem servers, two mounts, one namespace (2.4)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Both directions in one target: reads zeros through /dev/zero and keeps
      # /bin on the root mount, and asserts a mount needs a capability.
      - name: The VFS mount table from ring 3
        run: make smoke-vfs
      # Routing. Under first-match /dev/zero reaches the root filesystem, which
      # has an inode 0 of its own -- so it ANSWERS about a different object
      # rather than failing, which is why the check is which server replied.
      - name: Control arm — longest prefix must win
        run: make smoke-vfs-prefix-control
      # The mount gate: a prefix string alone must not install a mount.
      - name: Control arm — a mount needs a capability, not a name
        run: make smoke-vfs-mount-control

  passwd-probe:
    name: "The in-kernel ramfs is unreachable from ring 3 (H-3)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Four doors, one probe: an ordinary uid-1000 task with no delegated
      # capability must not open the user-database file, read any ramfs fd,
      # create a file, or list the store.
      - name: An unprivileged task is refused the in-kernel ramfs
        run: make smoke-passwd-probe
      # Restores the four slot-3 gates. Without this arm the gate above passes
      # identically against a kernel that never had the syscalls at all, which
      # is not the property being claimed.
      - name: Control arm — slot-3 gated, the store is readable
        run: make smoke-passwd-probe-control
      # The fifth door, found 2026-08-23. SYS_EXEC_LEGACY (14) creates a TASK on
      # the same slot-3 authority, and the [H-3] sweep could not see it because
      # the dispatch entry was a bare `[14]`. Under this arm the uid-1000 probe
      # calls it and is handed a task id, which is what it did against the tree
      # as it then stood.
      - name: Control arm — the retired legacy syscalls, including the one that spawns a task
        run: make smoke-passwd-probe-legacy-control

  frame:
    name: "A frame capability names an object, and a delegate maps only what it holds"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Both directions in one target: one task retypes a frame out of its
      # CAP_UNTYPED, maps it and asserts every refusal the map path owes, then
      # delegates a READ-only copy; the other sees the shared bytes and cannot
      # obtain a writable mapping. A gate that only refuses is satisfied by a
      # kernel that refuses everything.
      - name: Frame capabilities from ring 3
        run: make smoke-frame
      # The one the whole design turns on. Every task is born holding a CAP_FRAME
      # in slot 3 -- the capability that made [C-1] reachable -- so if the object
      # were a physical address rather than a table index, any task would map
      # physical 0x400000 into ring 3 on the first boot.
      - name: Control arm — the legacy slot-3 CAP_FRAME must map nothing
        run: make smoke-frame-index-control
      # Delegation must reduce. Aimed at the cap_lookup rights floor rather than
      # at the have & want intersection, because given the floor the intersection
      # is redundant and an arm against it could not fail.
      - name: Control arm — a READ-only delegate must not obtain a writable mapping
        run: make smoke-frame-rights-control

  rng-seed:
    name: "The CSPRNG refuses to emit keystream before it is seeded"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # Both directions in one boot: the probe asks the pool for output before
      # entropy_init() and must be refused, AND the boot must still reach the
      # ring-3 shell banner afterwards. Without the second half the gate is
      # passed by a fill() that refuses everything -- which is not hypothetical,
      # it is what `if true` in place of `if !self.seeded` produces, and that
      # mutation was run against this target and does go red (kernel PANIC from
      # stack_protector_init).
      - name: An unseeded pool is refused, and a seeded one still serves
        run: make smoke-rng-seed
      # The falsifying arm: the cargo feature compiles the check out, the same
      # probe receives ChaCha20 keystream under the published startup key, and
      # the base gate above goes red against this build.
      - name: Control arm — without the check, the unseeded pool serves keystream
        run: make smoke-rng-seed-control

  defect-flags-documented:
    name: "Every defect flag has a row in the table that claims to list them all"
    runs-on: ubuntu-latest
    # Source analysis only -- no build, no QEMU. Seconds. Deliberately NOT a step
    # in the `defect-flags` job, which boots QEMU and takes 45 minutes: a check
    # this cheap should not wait on one that expensive to tell you a doc is wrong.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # docs/BUILDING.md asserts its defect-flag table is "the complete list".
      # That sentence was false when it was written: RESUME_RSP_INJECT,
      # RESUME_RSP_INJECT_PRECLAIM and WAL_CRASHTEST were all DEFECT_FLAGS
      # members with no row, and one of them appeared nowhere in the file. A
      # control arm nobody can find is one nobody will re-run, which makes an
      # undocumented arm indistinguishable from a deleted one.
      - name: Refuse an undocumented defect flag, or a row no build can produce
        run: python3 tools/check_defect_flags.py

  syscall-abi:
    name: "Every user pointer reaches the kernel full-width (issue #176)"
    runs-on: ubuntu-latest
    # Source analysis only -- no build, no QEMU. Seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # sys_dmesg() and sys_audit_digest() passed their buffer as
      # (uint32_t)(unsigned long)ptr, handing the kernel the low 32 bits of an
      # address the caller never named. A runtime gate only covers the syscalls
      # some probe happens to call; this covers every wrapper in the header,
      # including ones nothing calls yet, because it is a property of the source.
      - name: Refuse any syscall wrapper that narrows a pointer
        run: python3 tools/check_syscall_abi.py

  smoke-klog-forge:
    name: A ring-3 task cannot forge into or evict from the kernel log (H-2/S23; control arm proves it)
    runs-on: ubuntu-latest
    # Two clean builds and two single boots, both deterministic and both exiting
    # on their marker in ~25s. The budget is for the builds, not the boots.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # SYS_DMESG -- the READ side of the kernel message ring -- has required
      # CAP_KERNEL_LOG since I-1. The WRITE side required nothing: h_write called
      # print(), which appended every byte to klog before it tested console
      # ownership, so any task could forge dmesg lines and flood the 16 KiB ring
      # to evict genuine ones. Finding H-2, property S23. The probe is ENDOWED
      # with CAP_KERNEL_LOG (READ only -- root_cnode[15] mints no other right) so
      # that it reads the ring back and is still refused the write direction: a
      # bare task would prove a weaker claim than the finding makes.
      - name: Require a ring-3 flood to reach the console and NOT the kernel log
        run: make smoke-klog-forge
      # The load-bearing arm. Without it, the step above is consistent with a
      # kernel whose klog simply stopped recording anything at all.
      - name: Remove the gate and require the forgery AND the eviction to REPRODUCE
        run: make smoke-klog-forge-control
      # The probe's buffer is a STATIC, so it lives above 4 GiB
      # (USER_IMAGE_ASLR_BASE is 16 GiB) and exercises the full-width pointer ABI
      # as a side effect of reading the log back. SYSCALL_PTR_TRUNC32=1 restores
      # the wrappers that truncated it to 32 bits (issue #176); the probe must
      # then be unable to read the log at all. Without this arm, nothing notices
      # if the buffer ever goes back to the stack and the ABI half stops being
      # tested.
      - name: Restore the 32-bit pointer truncation and require the probe to FAIL
        run: make smoke-klog-forge-abi-control

  smoke-kstack-park:
    name: A dying task's CPU parks on its own kernel stack (S20 park path)
    runs-on: ubuntu-latest
    # Backstop, not a budget. The control arm may boot up to
    # KSTACK_PARK_CONTROL_ATTEMPTS (24) times when KSTACK0_PARK_TRACE keeps killing
    # the workload (~40% of boots, and it is the instrument doing it -- see the
    # Makefile); boots that die are the fast ones (~6s on the runner that reddened
    # 9476799), but a run of mostly-conclusive boots is not.
    timeout-minutes: 75
    # MERGE-GATING since #190, and able to say so since this comment was written.
    #
    # It carried `continue-on-error: true` while it was advisory ([G-9], now
    # closed). #190 promoted it by editing .github/ci-gating.yml and the ruleset,
    # and touched no workflow; #191 rewrote the job NAME one line above to delete
    # the word ADVISORY from the published context, and left the line below it
    # alone. So for the whole of that window GitHub required a context that
    # reported SUCCESS however the steps exited, and the ruleset audit -- which
    # compares NAMES -- had nothing to notice.
    #
    # It was not idle. This job failed on `main` at 9476799 (the control arm did
    # not reproduce in 8 boots) inside a run GitHub reported green, and on
    # a59667ab before that. `tools/check_ci_gating.py` now refuses the
    # combination outright, so a required job cannot be made unfailable again.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # The three fault/exit fallbacks in idt.c used to park every CPU on
      # tasks[0].kernel_stack_top -- one stack. The workload is the process
      # self-test at -smp 4 because it kills tasks on purpose: a HEALTHY session
      # never enters the path at all (0 parks in 3 boots), so gating on the
      # session would have been a green check over a code path nobody ran.
      - name: Kill tasks on four CPUs and require every park to be on its own stack
        run: make smoke-kstack-park
      # Without this arm the step above is consistent with "the park path is
      # unreachable", which is exactly what it looked like before the workload
      # was chosen to kill tasks.
      - name: Restore the shared park and require it to REPRODUCE
        run: make smoke-kstack-park-control

  smoke-session:
