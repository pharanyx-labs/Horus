- id: exported-serial-truncated
  harness: exported_serials_are_derived_or_refused
  file: rust/src/capability.rs
  defect: the export narrows the serial to 32 bits, so a derived serial comes back as 0 or primordial
  find: |2
        assign_fresh_serial(next_serial)
    }
  replace: |2
        assign_fresh_serial(next_serial) & 0xFFFF_FFFF
    }
- id: transfer-drops-a-right
  harness: transfer_keeps_rights_and_records_the_parent
  file: rust/src/capability.rs
  defect: a transfer masks off the first right instead of copying the source's rights
  find: '    rust_cap_mint(cspace, cspace_size, dest_slot, src_slot, !0u32, next_serial, 0)'
  replace: '    rust_cap_mint(cspace, cspace_size, dest_slot, src_slot, !1u32, next_serial, 0)'
- id: grant-from-user-copies-pipe-ends
  harness: grant_from_user_refuses_exactly_pipe_ends
  file: rust/src/capability.rs
  defect: a ring-3 grant copies a pipe end like any other type
  find: '    if src.is_null() || !copyable_from_ring3((*src).typ) {'
  replace: '    if src.is_null() {'
- id: revoke-target-only
  harness: revoke_empties_the_target_and_its_children_only
  file: rust/src/capability.rs
  defect: the single-cspace revoke empties the target and never sweeps what was derived from it
  find: '    revoke_subtree(&desc as *const CSpaceDesc, 1, ts, to, tally);'
  replace: '    let _ = (&desc, to, &tally);'
- id: split-keeps-the-parent-share
  harness: a_split_never_creates_time
  file: rust/src/sched.rs
  defect: the child's share is not taken from the parent, so every split creates time
  find: '    Ok((parent_share - share, share))'
  replace: '    Ok((parent_share, share))'
- id: split-believes-the-share
  harness: a_split_never_creates_time
  file: rust/src/sched.rs
  defect: the share is believed rather than checked, so a share too small for the budget is split off
  find: '    if (share as u64) * (period_us as u64) < (budget_us as u64) * (PPM_WHOLE as u64) {'
  replace: '    if false {'
- id: reclaim-past-a-whole-cpu
  harness: reclaim_never_exceeds_a_whole_cpu
  file: rust/src/sched.rs
  defect: reclaiming adds without the bound, so a parent can come to hold more than a whole CPU
  find: '        Some(s) if s <= PPM_WHOLE => s,'
  replace: '        Some(s) => s,'

